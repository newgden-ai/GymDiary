<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ТренДневник</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&display=swap" media="print" onload="this.media='all'">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="help/data.js" defer></script>
<style>
:root{
  --bg:#f6f5f2; --surface:#ffffff; --surface2:#f0eee8; --border:#e2ded4;
  --text:#1f2320; --text-dim:#6b6f68; --accent:#3d5a45; --accent2:#8a9a5b;
  --danger:#b3503f; --warn:#c08a2e; --radius:10px;
  --shadow:0 1px 2px rgba(0,0,0,.06);
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#181a17; --surface:#20221f; --surface2:#272a25; --border:#33362f;
    --text:#e9e8e2; --text-dim:#9a9d94; --accent:#8fae7d; --accent2:#c7d69a;
  }
}
:root[data-theme="dark"]{
  --bg:#181a17; --surface:#20221f; --surface2:#272a25; --border:#33362f;
  --text:#e9e8e2; --text-dim:#9a9d94; --accent:#8fae7d; --accent2:#c7d69a;
}
*{box-sizing:border-box;}
html,body{height:100%;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:var(--bg-art,none);pointer-events:none;}
.bottomnav{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.4;}
button,input,select,textarea{font-family:inherit;font-size:14px;color:var(--text);}
button{cursor:pointer;}
a{color:var(--accent);}
h1,h2,h3{margin:0 0 8px;font-weight:600;}
.hidden{display:none!important;}
.app{display:flex;min-height:100vh;}
.sidebar{width:210px;flex:0 0 210px;background:var(--surface);border-right:1px solid var(--border);padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto;}
.brand{font-weight:700;font-size:17px;padding:6px 10px 18px;letter-spacing:.2px;}
.navitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius);color:var(--text-dim);cursor:pointer;margin-bottom:2px;background:none;border:none;width:100%;text-align:left;}
.navitem:hover{background:var(--surface2);}
.navitem.active{background:var(--accent);color:var(--on-accent,#fff);}
.main{flex:1;min-width:0;padding:18px 20px 90px;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.btn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 13px;font-weight:500;}
.btn:hover{filter:brightness(0.97);}
.btn.primary{background:var(--accent);color:var(--on-accent,#fff);border-color:var(--accent);}
.btn.danger{background:var(--danger);color:#fff;border-color:var(--danger);}
.btn.ghost{background:transparent;border-color:transparent;}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:6px;}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;background:var(--surface2);border:1px solid var(--border);}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);}
.row{display:flex;gap:8px;align-items:center;}
.grow{flex:1;}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
.field label{font-size:12px;color:var(--text-dim);}
.field input,.field select,.field textarea{padding:8px 9px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);width:100%;}
.field textarea{resize:vertical;min-height:50px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid2>*,.grid3>*{min-width:0;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
/* calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.cal-head{background:var(--surface2);padding:6px;text-align:center;font-size:12px;color:var(--text-dim);}
.cal-cell{background:var(--surface);min-height:92px;padding:5px;cursor:pointer;display:flex;flex-direction:column;gap:3px;}
.cal-cell:hover{background:var(--surface2);}
.cal-cell.other{opacity:.4;}
.cal-cell.today .daynum{background:var(--accent);color:var(--on-accent,#fff);border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;}
.daynum{font-size:12px;font-weight:600;}
.chip{font-size:11px;border-radius:5px;padding:2px 5px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.week-cols{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
.week-col{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:6px;min-height:220px;}
.week-col.today{outline:2px solid var(--accent);}
.week-colhead{font-size:12px;color:var(--text-dim);margin-bottom:6px;text-align:center;}
.agenda-item{background:var(--surface2);border-radius:8px;padding:7px 8px;margin-bottom:6px;cursor:pointer;font-size:12.5px;}
.agenda-item .t{font-weight:600;}
.day-list .agenda-item{font-size:14px;padding:10px;}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:20px 10px;overflow:auto;z-index:50;}
.modal{background:var(--surface);border-radius:14px;max-width:640px;width:100%;padding:18px;margin:10px 0 60px;}
.modal h2{margin-bottom:12px;}
.block-card{border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:10px;background:var(--surface2);}
.ex-card{border:1px dashed var(--border);border-radius:8px;padding:8px;margin:6px 0;background:var(--surface);}
.set-row{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) minmax(0,1.4fr) 32px;gap:6px;align-items:center;margin-bottom:4px;}
.set-row input{padding:6px;min-width:0;width:100%;border:1px solid var(--border);border-radius:6px;background:var(--surface);}
.set-row .btn{padding:5px 0;width:32px;}
.ex-card .row,.block-card .row{flex-wrap:wrap;min-width:0;}
.ex-card.dropset{border:1px solid var(--warn);border-left:4px solid var(--warn);}
.drop-badge{background:var(--warn);color:#fff;border-radius:999px;font-size:11px;padding:1px 8px;font-weight:600;}
.ex-admin{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 32px;gap:6px;padding:8px 0;border-bottom:1px solid var(--border);}
.ex-admin input{grid-column:1/-1;}
.ex-admin input,.ex-admin select{min-width:0;width:100%;padding:6px;border:1px solid var(--border);border-radius:6px;background:var(--surface);}
.ex-admin .btn{padding:5px 0;}
.invite-code{font-size:18px;letter-spacing:1px;background:var(--surface2);border:1px dashed var(--border);border-radius:8px;padding:7px 10px;user-select:all;overflow-wrap:anywhere;}
.req-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--border);}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:9px 14px;border-radius:10px;z-index:100;font-size:14px;max-width:90vw;text-align:center;}
.del-link{color:var(--danger);font-size:12px;padding:3px 6px;margin-left:auto;}
.swatches{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.swatch{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
.swatch.on{border-color:var(--text);box-shadow:0 0 0 2px var(--surface) inset;}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;}
.theme-opt{display:flex;flex-direction:column;gap:6px;align-items:flex-start;background:var(--surface);border:2px solid var(--border);border-radius:10px;padding:8px;font-size:13px;text-align:left;}
.theme-opt.on{border-color:var(--accent);}
.theme-prev{position:relative;display:block;width:100%;height:54px;border-radius:7px;overflow:hidden;border:1px solid var(--border);}
.theme-prev i{position:absolute;bottom:7px;width:22px;height:9px;border-radius:4px;}
.theme-prev i:first-child{left:8px;}.theme-prev i:nth-child(2){left:34px;}
.theme-prev b{position:absolute;right:8px;top:8px;width:44%;height:26px;border-radius:5px;box-shadow:0 1px 3px rgba(0,0,0,.12);}
.ico{width:24px;height:24px;flex:0 0 auto;}
:root{--metal-hi:#8b9096;--metal-mid:#5a5f65;--metal-lo:#2c3035;--ico-red:#e3262e;}
.bottomnav button.active .ico,.navitem.active .ico{filter:drop-shadow(0 0 3px rgba(227,38,46,.45));}
.navitem .ico{width:20px;height:20px;}
.ach-ico{display:inline-flex;align-items:center;justify-content:center;}
.ach-ico .ico{width:26px;height:26px;}
.medals{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
.medal{min-width:30px;height:30px;padding:0 5px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:2px dashed var(--border);color:var(--text-dim);}
.medal.got{border:2px solid var(--accent2);background:var(--accent);color:var(--on-accent,#fff);}
.help-btn{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font:italic 700 13px Georgia,serif;display:inline-flex;align-items:center;justify-content:center;padding:0;flex:0 0 auto;}
.help-row{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);cursor:pointer;}
.help-row:last-child{border-bottom:none;}
.help-imgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:8px 0;}
.help-imgs img{width:100%;border-radius:8px;background:#fff;border:1px solid var(--border);}
.help-imgs.small{grid-template-columns:repeat(2,minmax(0,110px));}
.link-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;}
.link-card{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px;}
.help-imgs img{cursor:zoom-in;}
.help-note p{margin:0 0 6px;line-height:1.5;}
.zoom-box{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:200;display:flex;}
.zoom-scroll{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;-webkit-overflow-scrolling:touch;}
.zoom-box img{max-width:100%;max-height:100%;cursor:zoom-in;background:#fff;}
.zoom-box.zoomed .zoom-scroll{display:block;}
.zoom-box.zoomed img{max-width:none;max-height:none;width:250%;cursor:zoom-out;}
.zoom-close{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:2;width:38px;height:38px;border-radius:50%;border:none;background:rgba(255,255,255,.18);color:#fff;font-size:18px;}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:10px;max-height:420px;overflow:auto;padding-right:2px;}
.ach-tile{background:radial-gradient(circle at 50% 30%,#2a2a2e 0,#121214 70%);border:1px solid #2c2c30;border-radius:12px;padding:10px 6px 8px;text-align:center;color:#e9e9ea;display:flex;flex-direction:column;align-items:center;gap:3px;}
.ach-emo{font-size:34px;line-height:44px;height:44px;filter:grayscale(1) brightness(.9);opacity:.35;}
.ach-tile.got .ach-emo{filter:drop-shadow(0 0 8px color-mix(in srgb,var(--ach) 70%,transparent));opacity:1;}
.ach-tile.rare{background:radial-gradient(circle at 50% 30%,#2f2640 0,#131018 70%);}
.ach-tile.rare.got{border-color:#b388ff;box-shadow:0 0 16px -4px #b388ff inset, 0 0 10px -4px #b388ff;}
.ach-tile{position:relative;}
.ach-x{position:absolute;top:6px;right:7px;font-size:11px;font-weight:800;color:#121214;background:var(--ach);border-radius:999px;padding:1px 6px;}
.ach-tag{font-size:10px;line-height:1.25;color:#b9b9c0;font-style:italic;}
.ach-badge{width:100%;aspect-ratio:1;object-fit:contain;filter:grayscale(1) brightness(.55);opacity:.55;}
.ach-tile.got .ach-badge{filter:drop-shadow(0 0 10px color-mix(in srgb,var(--ach) 60%,transparent));opacity:1;}
.ach-tile.has-badge{padding:4px 4px 8px;}
.lw-poster{width:100%;aspect-ratio:2/3;border-radius:8px;overflow:hidden;border:2px solid #555;filter:grayscale(1) brightness(.5);}
.ach-tile.got .lw-poster{filter:none;border-color:#e3262e;box-shadow:0 0 10px rgba(227,38,46,.55);}
.lw-poster img{width:100%;height:100%;object-fit:cover;display:block;}
.tier-medal{position:relative;width:100%;aspect-ratio:1;filter:grayscale(1) brightness(.55);opacity:.6;}
.ach-tile.got .tier-medal{filter:drop-shadow(0 0 10px color-mix(in srgb,var(--ach) 60%,transparent));opacity:1;}
.tier-medal img{position:absolute;inset:0;width:100%;height:100%;}
.tier-medal .tier-ico{left:15.5%;top:5.5%;width:69%;height:69%;}
.tier-txt{position:absolute;left:12%;right:12%;top:72.5%;height:19%;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.05;
  font-weight:800;text-transform:uppercase;color:#f3d9a4;text-shadow:0 1px 0 #000,0 0 4px #000;overflow:hidden;overflow-wrap:anywhere;letter-spacing:-.2px;}
/* «Зоопарк» — рельефная однотонная медаль (как иллюстрированные значки): тон задаётся --ach / --hue */
.ach-tile.ach-zoo:not(.has-badge){border-radius:50% 50% 16px 16px / 38% 38% 16px 16px;border:3px solid color-mix(in srgb,var(--ach) 70%,#000);
  background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--ach) 55%,#1a1a1a) 0,color-mix(in srgb,var(--ach) 22%,#0e0e0e) 75%);
  box-shadow:inset 0 2px 2px rgba(255,255,255,.18),inset 0 -3px 6px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.4);}
.ach-tile.ach-zoo:not(.has-badge) .ach-emo{font-size:40px;opacity:.4;
  filter:grayscale(1) sepia(1) hue-rotate(calc(var(--hue,30deg) - 35deg)) saturate(.7) brightness(.85) contrast(1.15) drop-shadow(-1px -1px 0 rgba(255,255,255,.35)) drop-shadow(1px 2px 1px rgba(0,0,0,.85));}
.ach-tile.ach-zoo.got:not(.has-badge) .ach-emo{opacity:1;}
.ach-tile.ach-zoo .ach-t{font-family:Impact,'Arial Black',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.3px;font-size:12px;
  color:color-mix(in srgb,var(--ach) 55%,#fff);text-shadow:0 1px 0 rgba(0,0,0,.9),0 -1px 0 rgba(255,255,255,.15);}
.ach-tile.ach-zoo .ach-tag{color:color-mix(in srgb,var(--ach) 40%,#ddd);}
.ach-tile.ach-zoo:not(.got){filter:saturate(.35) brightness(.8);}
/* «Как техника» — стальная плита, заклёпки, опасная полоса */
.ach-tile.ach-machine{border-radius:6px;border:2px solid #3a3a3e;background:
  repeating-linear-gradient(135deg,#f5b82e 0 8px,#141414 8px 16px) top/100% 7px no-repeat,
  radial-gradient(circle at 7px 16px,#8d8d92 0 2px,transparent 3px),radial-gradient(circle at calc(100% - 7px) 16px,#8d8d92 0 2px,transparent 3px),
  radial-gradient(circle at 7px calc(100% - 7px),#8d8d92 0 2px,transparent 3px),radial-gradient(circle at calc(100% - 7px) calc(100% - 7px),#8d8d92 0 2px,transparent 3px),
  linear-gradient(180deg,#2e2f33,#18191b);padding-top:14px;}
.ach-tile.ach-machine .ach-t{font-family:Impact,'Arial Black','Oswald',sans-serif;text-transform:uppercase;letter-spacing:.3px;font-weight:400;font-size:12px;color:#f5f5f5;}
.ach-tile.ach-machine .ach-tag{font-style:normal;text-transform:uppercase;font-size:9px;letter-spacing:.4px;color:#f5b82e;}
.ach-tile.ach-machine.got{border-color:#f5b82e;box-shadow:0 0 14px -6px #f5b82e inset;}
.result-modal .ach-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));}
/* герои: портрет в медали. relief — рельефная бронза с ободком, mono — однотонная гравировка */
.hero-medal{width:74px;height:74px;border-radius:50%;padding:5px;margin:2px auto 4px;}
.hero-medal img{width:100%;height:100%;border-radius:50%;display:block;}
.hero-medal.relief{background:radial-gradient(circle at 35% 30%,#f3d08a,#a8782e 45%,#5a3b12 100%);box-shadow:inset 0 2px 3px rgba(255,255,255,.5),inset 0 -3px 5px rgba(0,0,0,.6),0 3px 8px rgba(0,0,0,.6);}
.hero-medal.relief img{filter:grayscale(1) sepia(1) saturate(1.4) hue-rotate(-8deg) contrast(1.35) brightness(.95);box-shadow:inset 0 0 8px rgba(0,0,0,.8);}
.hero-medal.mono{background:#3b3d42;border:2px solid #6c6f76;box-shadow:inset 0 0 0 3px #26272b;}
.hero-medal.mono img{filter:grayscale(1) contrast(1.6) brightness(1.05);mix-blend-mode:luminosity;opacity:.9;}
.ach-tile.ach-hero:not(.got) .hero-medal{filter:grayscale(1) brightness(.5);}
.ach-tile.ach-hero .ach-t{font-family:Impact,'Arial Black',sans-serif;font-weight:400;text-transform:uppercase;font-size:11px;letter-spacing:.2px;overflow-wrap:normal;word-break:normal;hyphens:auto;}
.subtabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;}
.subtabs button{flex:1;min-width:max-content;padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text-dim);font-weight:600;}
.subtabs button.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.fbar{height:10px;border-radius:6px;background:var(--surface2);overflow:hidden;border:1px solid var(--border);}
.fbar>i{display:block;height:100%;background:var(--accent);border-radius:6px;}
.fbar.over>i{background:var(--danger);}
.food-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--border);}
.food-item:first-of-type{border-top:none;}
.food-pick{display:block;width:100%;text-align:left;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);margin-bottom:6px;color:inherit;}
.bw-medal{width:64px;height:64px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;
  background:radial-gradient(circle at 35% 30%,#f1f3f5,#aeb6bf 45%,#6e7781 80%,#4c535b);box-shadow:inset 0 2px 3px rgba(255,255,255,.7),inset 0 -3px 5px rgba(0,0,0,.45),0 2px 5px rgba(0,0,0,.5);color:#23272c;text-shadow:0 1px 0 rgba(255,255,255,.55);}
.ach-tile:not(.got) .bw-medal{filter:grayscale(1) brightness(.55);}
.bw-medal span{font-size:15px;}.bw-medal b{font-size:17px;}.bw-medal i{font-style:normal;font-size:9.5px;font-weight:700;}
.bw-lad{border:1px solid var(--border);border-radius:10px;padding:8px 10px;margin-bottom:8px;background:var(--surface2);}
.bw-lad summary{display:flex;justify-content:space-between;cursor:pointer;list-style:none;}
.bw-row{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:12px;}
.bw-kg{width:58px;flex:0 0 58px;color:var(--text-dim);}
.bw-cells{flex:1;display:flex;gap:2px;min-width:0;}
.bw-cells i{flex:1;height:12px;border-radius:3px;background:var(--border);}
.bw-cells i.on{background:#9fb4c7;box-shadow:inset 0 1px 0 rgba(255,255,255,.5);}
.bw-best{width:28px;text-align:right;font-weight:700;}
.year-card{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--surface2);}
.year-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:8px;}
.ach-chips{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none;}
.ach-chip{flex:0 0 auto;border:1px solid var(--border);background:var(--surface2);border-radius:999px;padding:5px 10px;font-size:12.5px;white-space:nowrap;}
.ach-chip b{color:var(--ach);filter:brightness(.8);}
.ach-chip.on{background:#141416;color:#fff;border-color:var(--ach);}
.ach-chip.on b{filter:none;}
.ach-tile.got{border-color:color-mix(in srgb,var(--ach) 55%,#121214);box-shadow:0 0 14px -6px var(--ach) inset;}

.ach-t{font-size:12px;font-weight:700;line-height:1.2;overflow-wrap:anywhere;hyphens:auto;max-width:100%;}

/* ===================== AUTH MODULE (Telegram -> Supabase session) ===================== */
const Auth = (function(){
  let client = null, session = null;
  function log(msg){
    const el = document.getElementById('authLog');
    if(el){ el.style.display='block'; el.textContent += msg + '\n'; }
    console.log('[auth]', msg);
  }
  function setStatus(msg){ const el = document.getElementById('authStatus'); if(el) el.textContent = msg; }
  async function login(){
    if(!window.supabase){ setStatus('❌ Не удалось загрузить supabase-js (проверьте интернет).'); return null; }
    client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const tg = window.Telegram && window.Telegram.WebApp;
    if(!tg || !tg.initData){
      setStatus('❌ Откройте приложение через кнопку меню в Telegram-боте, а не напрямую в браузере.');
      return null;
    }
    tg.ready(); tg.expand && tg.expand();
    try{ tg.disableVerticalSwipes && tg.disableVerticalSwipes(); }catch(e){} // свайп вниз не сворачивает приложение и не сдвигает меню

    setStatus('Проверяем вход…');
    let res, payload;
    try{
      res = await fetch(SUPABASE_URL + '/functions/v1/telegram-auth', {
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
        },
        body: JSON.stringify({initData: tg.initData})
      });
      payload = await res.json();
    }catch(e){ setStatus('❌ Нет связи с сервером входа'); log(String(e)); return null; }

    if(!res.ok || payload.error){
      setStatus('Ошибка входа: '+(payload.error||res.status));
      log('HTTP: ' + res.status);
      log('Ответ сервера: ' + JSON.stringify(payload));
      log('URL: ' + SUPABASE_URL + '/functions/v1/telegram-auth');
      return null;
    }

    const { data, error } = await client.auth.verifyOtp({ email: payload.email, token: payload.otp, type:'email' });
    if(error){
  setStatus('❌ Не удалось войти: '+error.message);

}

/* ===================== STORAGE MODULE (Supabase, с diff-синхронизацией) ===================== */
const Storage = (function(){
  let selfId = null;
  // снимок последнего состояния, отправленного на сервер — по нему считаем, что изменилось
  let snapshot = { workouts:[], templates:[], exercises:[], profile:null };

  function rowsToDiff(current, previous, keyField){
    const prevMap = new Map(previous.map(r=>[r[keyField], JSON.stringify(r)]));
    const curMap = new Map(current.map(r=>[r[keyField], r]));
    const upserts = [];
    for(const [id,row] of curMap){
      const prevJson = prevMap.get(id);
      const curJson = JSON.stringify(row);
      if(prevJson === undefined || prevJson !== curJson) upserts.push(row);
    }
    const deletes = [];
    for(const [id] of prevMap){ if(!curMap.has(id)) deletes.push(id); }
    return { upserts, deletes };
  }

  function workoutToDb(w){
    return {
      id:w.id, participant_id:w.participantId, created_by:w.createdBy||selfId, date:w.date,
      time:w.time||null, duration:w.duration?Number(w.duration):null, name:w.name||null,

      recurring_group_id:w.recurringId||null, status:w.status||'planned'
    };

      result:r.result||'', recurringId:r.recurring_group_id||null, status:r.status||'planned' };
  }
  function templateToDb(t){ return { id:t.id, owner_id:(t.ownerId===undefined?selfId:t.ownerId), name:t.name, blocks:t.blocks||[], is_public:!!t.isPublic, author_name:t.authorName||null }; }
  function templateFromDb(r){ return { id:r.id, name:r.name, blocks:r.blocks||[], ownerId:r.owner_id, isPublic:!!r.is_public, authorName:r.author_name||'' }; }
  function exerciseToDb(e){ return { id:e.id, owner_id:(e.ownerId===undefined?selfId:e.ownerId), name:e.name, main_group:e.mainGroup, secondary_groups:e.secondaryGroups||[], type:e.type, image_url:e.imageUrl||null }; }
  function exerciseFromDb(r){ return { id:r.id, name:r.name, mainGroup:r.main_group, secondaryGroups:r.secondary_groups||[], type:r.type, imageUrl:r.image_url||null, ownerId:r.owner_id }; }

  async function load(auth){
    selfId = auth.userId;
    const client = auth.client;

    const [{data:profile}, {data:exRows}, {data:tplRows}] = await Promise.all([
      client.from('profiles').select('*').eq('id', selfId).single(),
      client.from('exercises').select('*').or(`owner_id.is.null,owner_id.eq.${selfId}`),
      client.from('templates').select('*').or(`owner_id.eq.${selfId},is_public.eq.true,owner_id.is.null`)
    ]);
    const social = await fetchSocial(client, profile);
    const wRows = social.wRows;

    const exercises = (exRows||[]).map(exerciseFromDb);
    const templates = (tplRows||[]).map(templateFromDb);
    const workouts = (wRows||[]).map(workoutFromDb);

    // пишем сразу в глобальный DB (а не в приватную копию), чтобы Storage и приложение
    // всегда смотрели на один и тот же объект — иначе DB.x = DB.x.filter(...) в коде
    // приложения перестаёт быть видно модулю Storage
    Object.assign(DB, {
      participants: social.participants,
      friends: social.friends, trainerLinks: social.links,
      details: social.details, weights: social.weights, activity: social.activity, certs: social.certs,
      me: { role: profile?.role || 'user', inviteCode: profile?.invite_code || '' },
      exercises, templates, workouts,
      settings: {
        units: profile?.units || 'kg',
        theme: profile?.theme || 'auto',
        themeColor: profile?.theme_color || 'forest',
        restDefault: profile?.rest_default ?? 90
      }
    });
    snapshot = {
      workouts: JSON.parse(JSON.stringify(wRows||[])),
      templates: JSON.parse(JSON.stringify((tplRows||[]).filter(r=>profile?.role==='admin' || r.owner_id===selfId).map(r=>templateToDb(templateFromDb(r))))),
      exercises: JSON.parse(JSON.stringify((exRows||[]).filter(r=>profile?.role==='admin' || r.owner_id===selfId))),
      profile: profile ? JSON.parse(JSON.stringify(profile)) : null
    };
    return DB;
  }

  // участники: я + принятые друзья; тренировки: мои + подопечных (где я активный тренер)
  async function fetchSocial(client, profile){
    const since = dstr(new Date(Date.now()-120*86400000));
    const res = await Promise.all([
      client.rpc('my_friends'),
      client.from('trainer_links').select('*'),
      client.from('profile_details').select('*'),          // RLS: свои + тех, кто разрешил показывать
      client.from('body_weights').select('*').order('date'),
      client.from('daily_activity').select('*').gte('date', since),
      client.from('user_achievements').select('*').not('competition_name','is',null).order('competition_date',{ascending:false})
    ]);
    const [{data:friends}, {data:links}, {data:details}, {data:weights}, {data:activity}, {data:certs}] = res;
    // ошибки загрузки не прячем — иначе раздел просто выглядит пустым
    const errs = res.map((r,i)=>r.error?['участники','тренеры','личные данные','вес','активность','сертификаты'][i]+': '+r.error.message:null).filter(Boolean);
    if(errs.length) setTimeout(()=>toast('Ошибка загрузки — '+errs.join('; ')), 800);
    const traineeIds = (links||[]).filter(l=>l.trainer_id===selfId && l.active).map(l=>l.trainee_id);
    const {data:wRows} = await client.from('workouts').select('*').in('participant_id', [selfId, ...traineeIds]);
    const self = (DB.participants[0] && DB.participants[0].id===selfId) ? DB.participants[0]
      : { id: selfId, name: profile?.name || 'Я', color: profile?.color || '#3d5a45' };
    // подопечным тренер выбирает свой цвет; пока не выбран — берём незанятый из палитры
    const used = new Set([self.color, ...(links||[]).map(l=>l.color).filter(Boolean)]);
    const autoColor = () => PALETTE.find(c=>!used.has(c) && used.add(c)) || '#888';
    const participants = [self, ...(friends||[]).filter(f=>f.status==='accepted').map(f=>{
      const tl = (links||[]).find(l=>l.trainer_id===selfId && l.trainee_id===f.other_id && l.active);
      return {id:f.other_id, name:f.name, color: tl ? (tl.color || autoColor()) : (f.color||'#888')};
    })];
    return { friends: friends||[], links: links||[], wRows: wRows||[], participants, details: details||[], weights: weights||[], activity: activity||[], certs: certs||[] };
  }
  // перечитать участников/заявки/тренировки после действий в разделе «Участники»
  async function reloadSocial(){
    const client = Auth.getClient(); if(!client) return;
    clearTimeout(saveTimer); await syncAll();
    const social = await fetchSocial(client, null);
    Object.assign(DB, { participants: social.participants, friends: social.friends, trainerLinks: social.links,
      details: social.details, weights: social.weights, activity: social.activity, certs: social.certs,
      workouts: social.wRows.map(workoutFromDb) });
    snapshot.workouts = JSON.parse(JSON.stringify(social.wRows.map(r=>workoutToDb(workoutFromDb(r)))));
  }

  let saveTimer = null;
  function save(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(syncAll, 500);
  }

  async function syncAll(){
    const client = Auth.getClient();
    if(!client) return;
    try{
      const wDb = DB.workouts.map(workoutToDb);
      const wDiff = rowsToDiff(wDb, snapshot.workouts, 'id');
      if(wDiff.upserts.length) await client.from('workouts').upsert(wDiff.upserts);
      if(wDiff.deletes.length) await client.from('workouts').delete().in('id', wDiff.deletes);

      // свои шаблоны синхронизируем; чужие общие — только чтение (админ может править все)
      const tDb = DB.templates.filter(t=>isAdmin() || t.ownerId===undefined || t.ownerId===selfId).map(templateToDb);
      const tDiff = rowsToDiff(tDb, snapshot.templates, 'id');
      if(tDiff.upserts.length) await client.from('templates').upsert(tDiff.upserts);
      if(tDiff.deletes.length) await client.from('templates').delete().in('id', tDiff.deletes);

      // обычный пользователь синхронизирует только свои упражнения; админ — все (в т.ч. общие)
      const ownExDb = DB.exercises.filter(e=>isAdmin() || e.ownerId===selfId).map(exerciseToDb);
      const eDiff = rowsToDiff(ownExDb, snapshot.exercises, 'id');
      if(eDiff.upserts.length) await client.from('exercises').upsert(eDiff.upserts);
      if(eDiff.deletes.length) await client.from('exercises').delete().in('id', eDiff.deletes);

      const self = DB.participants[0];
      const profileRow = { name:self.name, color:self.color, units:DB.settings.units, theme:DB.settings.theme, theme_color:DB.settings.themeColor, rest_default:Number(DB.settings.restDefault)||90 };
      if(!snapshot.profile || JSON.stringify(profileRow) !== JSON.stringify({name:snapshot.profile.name,color:snapshot.profile.color,units:snapshot.profile.units,theme:snapshot.profile.theme,theme_color:snapshot.profile.theme_color,rest_default:snapshot.profile.rest_default})){
        await client.from('profiles').update(profileRow).eq('id', selfId);
      }

      snapshot = {
        workouts: JSON.parse(JSON.stringify(wDb)),
        templates: JSON.parse(JSON.stringify(tDb)),
        exercises: JSON.parse(JSON.stringify(ownExDb)),
        profile: { id:selfId, ...profileRow }
      };
    }catch(e){ console.error('Ошибка синхронизации:', e); }
  }
  function isGlobalExercise(e){ return e.ownerId === null || e.ownerId === undefined; }

  function exportJSON(){
    const blob = new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download='trendnevnik-backup-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
  }
  function importJSON(obj){
    // Импорт из старой локальной резервной копии: аккуратно переносим тренировки/шаблоны/кастомные упражнения,
    // не трогая id профиля, и сразу шлём на сервер через обычный save()
    if(obj.workouts) DB.workouts = obj.workouts.map(w=>({...w, participantId:selfId}));
    if(obj.templates) DB.templates = obj.templates;
    if(obj.exercises) DB.exercises = DB.exercises.concat(obj.exercises.filter(e=>!DB.exercises.some(x=>x.id===e.id)).map(e=>({...e, ownerId:selfId})));
    save();
  }
  return { workoutFromDb, exerciseFromDb, load, save, flush: ()=>{ clearTimeout(saveTimer); return syncAll(); }, reloadSocial, exportJSON, importJSON, uid: ()=> (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2,10)) };
})();

/* ===================== CALC MODULE (tonnage) ===================== */
const Calc = (function(){
  // bw — вес спортсмена: подход без веса отягощения (подтягивания, отжимания…) = повторения × собственный вес
  function setTonnage(s, bw){ const wt = Number(s.weight)||0, r = Number(s.reps)||0; return (wt>0 ? wt : (Number(bw)||0)) * r; }
  function exTonnage(ex, bw){ return (ex.sets||[]).reduce((a,s)=>a+setTonnage(s, bw),0); }
  // bwFor(w, ex) задаёт приложение: какой собственный вес подставлять для упражнения этой тренировки (0 — не учитывать)
  let bwFor = () => 0;
  function setBodyWeightProvider(fn){ bwFor = fn; }
  function blockTonnage(b, w){ return (b.exercises||[]).reduce((a,ex)=>a+exTonnage(ex, w?bwFor(w,ex):0),0); }
  function workoutTonnage(w){ return (w.blocks||[]).reduce((a,b)=>a+blockTonnage(b, w),0); }
  function muscleBreakdown(w, exercisesDb){
    const map = {};
    (w.blocks||[]).forEach(b=>(b.exercises||[]).forEach(ex=>{
      const info = exercisesDb.find(e=>e.id===ex.exerciseId);
      if(!info) return;
      const t = exTonnage(ex, bwFor(w, ex));
      if(t<=0) return;
      map[info.mainGroup] = (map[info.mainGroup]||0) + t;
    }));
    return map;
  }
  return {setTonnage, exTonnage, blockTonnage, workoutTonnage, muscleBreakdown, setBodyWeightProvider, bwFor:(w,ex)=>bwFor(w,ex)};
})();

function weeklyStreak(workouts){
  if(!workouts.length) return {current:0, longest:0};
  const weeks = Array.from(new Set(workouts.map(w=>weekKeyOf(w.date)))).sort();
  let longest=1, run=1;
  for(let i=1;i<weeks.length;i++){
    const diffDays = Math.round((parseD(weeks[i])-parseD(weeks[i-1]))/86400000);
    run = (diffDays===7) ? run+1 : 1;
    longest = Math.max(longest, run);
  }
  const thisWeek = weekKeyOf(dstr(new Date()));
  let current=0;
  const lastWeek = weeks[weeks.length-1];
  const gapFromNow = Math.round((parseD(thisWeek)-parseD(lastWeek))/86400000)/7;
  if(gapFromNow<=1){
    current=1;
    for(let i=weeks.length-1;i>0;i--){
      const diffDays = Math.round((parseD(weeks[i])-parseD(weeks[i-1]))/86400000);
      if(diffDays===7) current++; else break;
    }
  }
  return {current, longest};
}

function heroContext(workouts){
  const uid = (workouts[0]||{}).participantId || State.achFor;
  const exOf = id => DB.exercises.find(e=>e.id===id) || {};
  const sets = []; workouts.forEach(w=>(w.blocks||[]).forEach(b=>(b.exercises||[]).forEach(ex=>(ex.sets||[]).forEach(s=>sets.push({w, ex, info:exOf(ex.exerciseId), s})))));
  const byWeek = {}; workouts.forEach(w=>{ const k=weekKeyOf(w.date); (byWeek[k]=byWeek[k]||[]).push(w); });
  const d = (DB.details||[]).find(x=>x.user_id===uid) || {};
  const dates = [...new Set(workouts.map(w=>w.date))].sort(); let run=0, best=0, prev=null;
  dates.forEach(ds=>{ run = prev && (parseD(ds)-parseD(prev))/86400000===1 ? run+1 : 1; best=Math.max(best,run); prev=ds; });
  const weeks = Object.keys(byWeek).sort(); let wr=0, wbest=0, wprev=null;
  const c = {
    bw: bodyWeightOn(uid, dstr(new Date())), height: Number(d.height_cm)||0, streak: weeklyStreak(workouts).longest, dayStreak: best,
    maxW: (rx, minReps=1) => Math.max(0, ...sets.filter(x=>rx.test(x.info.name||'') && Number(x.s.reps)>=minReps).map(x=>Number(x.s.weight)||0)),
    maxReps: rx => Math.max(0, ...sets.filter(x=>rx.test(x.info.name||'')).map(x=>Number(x.s.reps)||0)),
    has: (w, rx) => (w.blocks||[]).some(b=>(b.exercises||[]).some(ex=>rx.test(exOf(ex.exerciseId).name||''))),
    hasType: (w, t) => (w.blocks||[]).some(b=>(b.exercises||[]).some(ex=>exOf(ex.exerciseId).type===t)),
    hasGroup: (w, gs) => (w.blocks||[]).some(b=>(b.exercises||[]).some(ex=>gs.includes(exOf(ex.exerciseId).mainGroup))),
    workoutsWith: rx => workouts.filter(w=>c.has(w,rx)).length,
    bestTonWith: rx => Math.max(0, ...workouts.filter(w=>c.has(w,rx)).map(w=>Calc.workoutTonnage(w))),
    count: fn => workouts.filter(fn).length,
    maxWeekOf: fn => Math.max(0, ...Object.values(byWeek).map(ws=>ws.filter(fn).length)),
    maxWeekSets: Math.max(0, ...Object.values(byWeek).map(ws=>ws.reduce((a,w)=>a+(w.blocks||[]).reduce((b,bl)=>b+(bl.exercises||[]).reduce((e,ex)=>e+(ex.sets||[]).filter(s=>Number(s.reps)>0||Number(s.time)>0).length,0),0),0))),
    weeksInRowWith: n => { let r=0, bst=0, pv=null; weeks.forEach(k=>{ if(byWeek[k].length>=n){ r = pv && (parseD(k)-parseD(pv))/86400000===7 ? r+1 : 1; bst=Math.max(bst,r); pv=k; } else { r=0; pv=null; } }); return bst; },
    // все условия выполнены; прогресс — по самому отстающему условию
    all: pairs => { const ok = pairs.every(([v,t])=>t>0 && v>=t); const pct = Math.min(...pairs.map(([v,t])=>t>0?Math.min(1,v/t):0));
      return {got:ok, cur:Math.round(pct*100), target:100}; }
  };
  return c;
}

function bwLadderData(sets){

function compressBw(list){
  const groups = {}; list.forEach(a=>{ if(a.cat==='bw'){ const k = a.ladder+'|'+a.kg; (groups[k]=groups[k]||[]).push(a); } });
  const keep = new Set(Object.values(groups).map(g=>g.reduce((m,a)=>a.reps>m.reps?a:m)));
  return list.filter(a=>a.cat!=='bw' || keep.has(a)).map(a=>a.cat==='bw' ? {...a, more: groups[a.ladder+'|'+a.kg].length-1} : a);

/* ===================== UTIL ===================== */
function pad(n){return n<10?'0'+n:''+n;}
function dstr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseD(s){const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}
function fmtDate(s){const d=parseD(s);return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});}
function fmtDateShort(s){const d=parseD(s);return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'});}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtNum(n){return Math.round(n*10)/10;}
function convW(kg, units){ return units==='lb' ? fmtNum(kg*2.20462) : fmtNum(kg); }
function unitLabel(units){ return units==='lb' ? 'фунт' : 'кг'; }
function toKg(v, units){ return units==='lb' ? (Number(v)||0)/2.20462 : (Number(v)||0); }

const DB = { participants:[{id:'', name:'Я', color:'#3d5a45'}], exercises:[], workouts:[], templates:[], settings:{units:'kg', theme:'auto', restDefault:90, themeColor:'forest'} };
function selfParticipantId(){ return DB.participants[0].id; }
// собственный вес участника на дату тренировки: последний замер не позже даты, иначе ближайший позже, иначе из анкеты
function bodyWeightOn(uid, date){
  const list = (DB.weights||[]).filter(x=>x.user_id===uid);
  const before = list.filter(x=>x.date<=date).sort((a,b)=>b.date.localeCompare(a.date))[0];
  const after = list.filter(x=>x.date>date).sort((a,b)=>a.date.localeCompare(b.date))[0];
  const d = (DB.details||[]).find(x=>x.user_id===uid);
  return Number((before||after||{}).weight_kg) || Number(d&&d.weight_kg) || 0;
}
Calc.setBodyWeightProvider((w, ex)=>{
  const info = DB.exercises.find(e=>e.id===ex.exerciseId);
  if(!info || !['strength','functional'].includes(info.type)) return 0;
  return bodyWeightOn(w.participantId, w.date);
});

/* ===================== CALENDAR VIEW ===================== */
function occurrencesInRange(from,to){
  // returns workouts (materialized) with date within [from,to]
  return DB.workouts.filter(w=>{
    const d=parseD(w.date); return d>=from && d<=to;
  });
}
function viewCalendar(){
  const d = State.calDate;
  let header='', body='';
  if(State.calMode==='month'){
    const y=d.getFullYear(), m=d.getMonth();
    const first = new Date(y,m,1);
    const startOffset = (first.getDay()+6)%7; // Monday-first
    const gridStart = new Date(y,m,1-startOffset);
    header = d.toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
    let cells='';
    const today=new Date();
    for(let i=0;i<42;i++){
      const cd = new Date(gridStart); cd.setDate(gridStart.getDate()+i);
      const isOther = cd.getMonth()!==m;
      const isToday = sameDay(cd,today);
      const ds = dstr(cd);
      const dayWorkouts = DB.workouts.filter(w=>w.date===ds).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
      const chips = dayWorkouts.slice(0,3).map(w=>{
        const p = DB.participants.find(x=>x.id===w.participantId);
        return `<div class="chip ${w.status==='done'?'':'planned'}" style="background:${colorBg(p&&p.color)}" data-open-workout="${w.id}">${w.time||''} ${esc(w.name||WT[w.type]||'')}</div>`;
      }).join('');
      const more = dayWorkouts.length>3 ? `<div class="muted">+${dayWorkouts.length-3} ещё</div>` : '';
      const act = !dayWorkouts.length && (DB.activity||[]).find(a=>a.date===ds && a.user_id===selfParticipantId() && a.kind!=='none');
      cells += `<div class="cal-cell ${isOther?'other':''} ${isToday?'today':''}" data-day="${ds}">
        <div class="daynum">${cd.getDate()}</div>${chips}${more}${act?`<div class="act-tag" title="Активность из бота">${ACTIVITY_LABELS[act.kind]||'активность'}${act.steps?' '+Math.round(act.steps/1000)+'к шагов':''}</div>`:''}</div>`;
    }
    body = `<div class="cal-grid">${WEEKDAYS.map(w=>`<div class="cal-head">${w}</div>`).join('')}${cells}</div>`;
  } else if(State.calMode==='week'){
    const startOffset = (d.getDay()+6)%7;
    const weekStart = new Date(d); weekStart.setDate(d.getDate()-startOffset);
    header = 'Неделя ' + fmtDateShort(dstr(weekStart)) + ' — ' + fmtDateShort(dstr(new Date(weekStart.getFullYear(),weekStart.getMonth(),weekStart.getDate()+6)));
    const today=new Date();
    let cols='';
    for(let i=0;i<7;i++){
      const cd=new Date(weekStart); cd.setDate(weekStart.getDate()+i);
      const ds=dstr(cd);
      const items = DB.workouts.filter(w=>w.date===ds).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
      cols += `<div class="week-col ${sameDay(cd,today)?'today':''}" data-day="${ds}">
        <div class="week-colhead">${WEEKDAYS[i]} ${cd.getDate()}</div>
        ${items.map(w=>{const p=DB.participants.find(x=>x.id===w.participantId);
          return `<div class="agenda-item ${w.status==='done'?'':'planned'}" style="${colorStripe(p&&p.color,3)}" data-open-workout="${w.id}"><span class="t">${w.time||''}</span> ${esc(w.name||WT[w.type]||'')}<br><span class="muted">${p?esc(p.name):''}</span></div>`;}).join('')}
        <button class="btn sm ghost" data-add-day="${ds}">+ добавить</button>
      </div>`;
    }
    body = `<div class="week-cols">${cols}</div>`;
  } else { // day
    const ds = dstr(d);
    header = fmtDate(ds);
    const items = DB.workouts.filter(w=>w.date===ds).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    body = `<div class="day-list card">${items.length? items.map(w=>{
      const p=DB.participants.find(x=>x.id===w.participantId);
      const t=Calc.workoutTonnage(w);
      return `<div class="agenda-item ${w.status==='done'?'':'planned'}" style="${colorStripe(p&&p.color,4)}" data-open-workout="${w.id}">
        <div class="t">${w.time||'--:--'} · ${esc(w.name||WT[w.type]||'')} ${w.duration?('· '+w.duration+' мин'):''}</div>
        <div class="muted">${p?esc(p.name):''} · ${WT[w.type]||''} ${t>0?('· тоннаж '+fmtNum(t)+' кг'):''}</div>
      </div>`;
    }).join('') : '<div class="muted">Нет тренировок в этот день</div>'}
    <button class="btn primary" style="margin-top:8px" data-add-day="${ds}">+ Добавить тренировку</button>
    </div>`;
  }
  return `
  <div class="topbar">
    <div class="row">
      <button class="btn" data-cal-nav="prev">←</button>
      <button class="btn" data-cal-nav="today">Сегодня</button>
      <button class="btn" data-cal-nav="next">→</button>
      <h2 style="margin-left:8px;text-transform:capitalize">${header}</h2>
    </div>
    <div class="row">
      ${['month','week','day'].map(mm=>`<button class="btn ${State.calMode===mm?'primary':''}" data-cal-mode="${mm}">${mm==='month'?'Месяц':mm==='week'?'Неделя':'День'}</button>`).join('')}
      <button class="btn primary" data-add-day="${dstr(State.calMode==='month'?new Date():d)}">+ Тренировка</button>
    </div>
  </div>
  ${body}`;
}

function openWorkoutModal(opts){
  // opts: {date} for new, {workoutId} for edit, {templateId,date} to instantiate from template
  let w;
  if(opts.workoutId){
    w = JSON.parse(JSON.stringify(DB.workouts.find(x=>x.id===opts.workoutId)));
  } else if(opts.templateId){
    const t = DB.templates.find(x=>x.id===opts.templateId);
    w = {id:Storage.uid(), date:opts.date||dstr(new Date()), time:'09:00', duration:60, name:t.name,
      participantId:(DB.participants[0]||{}).id, type:'strength', blocks:JSON.parse(JSON.stringify(t.blocks)),
      notes:'', result:'', recurringId:null};
  } else {
    w = {id:Storage.uid(), date:opts.date||dstr(new Date()), time:'09:00', duration:60, name:'',
      participantId:(DB.participants[0]||{}).id, type:'strength', blocks:[], notes:'', result:'', recurringId:null};
  }
  State.modal = {kind:'workout', w, isNew: !opts.workoutId, recurRule:{on:false, freq:'weekly', days:[], until:''}};
  renderModal();
}
function closeModal(){ State.modal = (State.modal && State.modal.kind==='help' && State.modal.back) || null; renderModal(); }

function lastResultFor(exerciseId, participantId, excludeWorkoutId){
  const past = DB.workouts.filter(w=>w.id!==excludeWorkoutId && w.participantId===participantId)
    .sort((a,b)=> (b.date+(b.time||'')).localeCompare(a.date+(a.time||'')));
  for(const w of past){
    for(const b of w.blocks||[]){
      for(const ex of b.exercises||[]){
        if(ex.exerciseId===exerciseId && ex.sets && ex.sets.length){
          return {date:w.date, sets:ex.sets};
        }
      }
    }
  }
  return null;
}
function bestSetFor(exerciseId, participantId, excludeWorkoutId, isCardio){
  let best=null, bestDate=null, bestScore=-1;
  DB.workouts.forEach(w=>{
    if(w.id===excludeWorkoutId || w.participantId!==participantId) return;
    (w.blocks||[]).forEach(b=>(b.exercises||[]).forEach(ex=>{
      if(ex.exerciseId!==exerciseId) return;
      (ex.sets||[]).forEach(s=>{
        const score = isCardio ? (Number(s.distance)||0) : Calc.setTonnage(s, Calc.bwFor(w, ex));
        if(score>bestScore && score>0){ bestScore=score; best=s; bestDate=w.date; }
      });
    }));
  });
  return best ? {set:best, date:bestDate} : null;
}

/* ===================== EVENT DELEGATION (bound once; survives re-renders) ===================== */
function pathGet(idx){ return idx.split('.').map(Number); }

function handleModalClick(e, ds){
  const modal = State.modal; if(!modal) return false;
  if(ds.closeOverlay!==undefined){ if(e.target===e.currentTarget||e.target.hasAttribute('data-close-overlay')) closeModal(); return true; }
  if(ds.closeModal!==undefined){ closeModal(); return true; }
  if(ds.help!==undefined){ openHelp(ds.help, modal); return true; }
  if(ds.zoom!==undefined){ openZoom(ds.zoom); return true; }

  if(modal.kind==='workout'){
    const w = modal.w;
    if(ds.addBlock!==undefined){ w.blocks.push(blankBlock(ds.addBlock)); renderModal(); return true; }
    if(ds.removeBlock!==undefined){ w.blocks.splice(+ds.removeBlock,1); renderModal(); return true; }
    if(ds.addExercise!==undefined){ modal.pendingBlock=+ds.addExercise; modal.kind='exercisePicker'; modal.query=''; modal._back={w,isNew:modal.isNew,recurRule:modal.recurRule}; renderModal(); return true; }
    if(ds.removeExercise!==undefined){ const [bi,ei]=pathGet(ds.removeExercise); w.blocks[bi].exercises.splice(ei,1); renderModal(); return true; }
    if(ds.addSet!==undefined){
      const [bi,ei]=pathGet(ds.addSet); const ex=w.blocks[bi].exercises[ei]; const ns=blankSet();
      const last=ex.sets[ex.sets.length-1];
      // дроп-сет: следующий этап подставляем с весом −20% (кратно 2.5 кг)
      if(ex.isDropset && last && Number(last.weight)>0) ns.weight = Math.max(0, Math.round(Number(last.weight)*0.8/2.5)*2.5);
      ex.sets.push(ns); renderModal(); return true;
    }
    if(ds.removeSet!==undefined){ const [bi,ei,si]=pathGet(ds.removeSet); w.blocks[bi].exercises[ei].sets.splice(si,1); renderModal(); return true; }
    if(ds.saveWorkout!==undefined){ saveWorkoutFromModal(); return true; }
    if(ds.finishWorkout!==undefined){ finishWorkout(); return true; }
    if(ds.saveAsTemplate!==undefined){ State.modal={kind:'saveTemplate', suggestedName:w.name, sourceBlocks:w.blocks}; renderModal(); return true; }
    if(ds.deleteWorkout!==undefined){
      State.modal={kind:'confirmDelete', title:'Удалить тренировку?', text:'Это действие нельзя отменить.', onYes:()=>{
        if(w.recurringId){ State.modal={kind:'recurEdit', mode:'delete', w}; renderModal(); return; }
        DB.workouts = DB.workouts.filter(x=>x.id!==w.id); Storage.save(); closeModal(); rerender();
      }};
      renderModal(); return true;
    }
  } else if(modal.kind==='exercisePicker'){
    if(ds.pickExercise!==undefined){
      const bi = modal.pendingBlock; const back=modal._back;
      const nex=blankExercise(ds.pickExercise); nex.isDropset = back.w.blocks[bi].kind==='dropset';
      back.w.blocks[bi].exercises.push(nex);
      State.modal = {kind:'workout', w:back.w, isNew:back.isNew, recurRule:back.recurRule};
      renderModal(); return true;
    }
    if(ds.createExercise!==undefined){
      const name = (modal.query||'').trim(); if(!name) return true;
      const ex = {id:Storage.uid(), name, mainGroup:'other', secondaryGroups:[], type:'strength', ownerId:selfParticipantId()};
      DB.exercises.push(ex); Storage.save();
      const bi = modal.pendingBlock; const back=modal._back;
      const nex=blankExercise(ex.id); nex.isDropset = back.w.blocks[bi].kind==='dropset';
      back.w.blocks[bi].exercises.push(nex);
      State.modal = {kind:'workout', w:back.w, isNew:back.isNew, recurRule:back.recurRule};
      renderModal(); return true;
    }
  } else if(modal.kind==='cert'){
    if(ds.sendCert!==undefined){ sendCert(); return true; }
  } else if(modal.kind==='importTemplates'){
    if(ds.importExample!==undefined){ modal.text = IMPORT_EXAMPLE; modal.error=''; renderModal(); return true; }
    if(ds.importRun!==undefined){
      modal.text = document.getElementById('importText').value;
      const exBefore = DB.exercises.length;
      try{
        const list = parseTemplatesText(modal.text);
        if(!list.length) throw new Error('не найдено ни одного шаблона');
        list.forEach(t=>DB.templates.push({id:Storage.uid(), ownerId:selfParticipantId(), isPublic:false, name:t.name, blocks:t.blocks}));
        Storage.save(); closeModal(); renderMain();
        toast(`Импортировано шаблонов: ${list.length}`+(DB.exercises.length>exBefore?`, новых упражнений: ${DB.exercises.length-exBefore}`:''));
      }catch(e){ DB.exercises.length = exBefore; modal.error = e.message; renderModal(); }
      return true;
    }
  } else if(modal.kind==='confirmDelete'){
    if(ds.confirmYes!==undefined){ modal.onYes(); return true; }
  } else if(modal.kind==='recurEdit'){
    if(ds.recurScope!==undefined){ handleRecurScope(ds.recurScope); return true; }
  } else if(modal.kind==='saveTemplate'){
    if(ds.confirmTemplate!==undefined){
      const name = document.getElementById('tplName').value.trim() || 'Без названия';
      DB.templates.push({id:Storage.uid(), ownerId:selfParticipantId(), name, blocks: JSON.parse(JSON.stringify(modal.sourceBlocks))});
      Storage.save(); closeModal(); if(State.view==='templates') rerender();
      return true;
    }
  }
  return false;
}

// при вводе подхода не перерисовываем всё окно (на iPhone это дёргает клавиатуру) — обновляем только цифры
let liveRaf = 0;
function liveUpdateModal(){
  cancelAnimationFrame(liveRaf);
  liveRaf = requestAnimationFrame(()=>{ if(!State.modal || State.modal.kind!=='workout') return;
    const tmp = document.createElement('div'); tmp.innerHTML = renderWorkoutModal();
    tmp.querySelectorAll('[data-live]').forEach(n=>{ const cur = document.querySelector(`#modalRoot [data-live="${n.dataset.live}"]`);
      if(cur && cur.innerHTML !== n.innerHTML) cur.innerHTML = n.innerHTML; }); });
}
function preserveFocusAndRerender(renderFn){
  const ae = document.activeElement;
  let attr=null, val=null, start=null, end=null;
  if(ae && (ae.tagName==='INPUT'||ae.tagName==='TEXTAREA')){
    for(const a of ['data-set','data-w','data-block-rest','data-setting']){
      if(ae.hasAttribute(a)){ attr=a; val=ae.getAttribute(a); break; }
    }
    start = ae.selectionStart; end = ae.selectionEnd;
  }
  renderFn();
  if(attr){
    const again = document.querySelector('['+attr+'="'+CSS.escape(val)+'"]');
    if(again){ again.focus(); if(start!=null && again.setSelectionRange){ try{ again.setSelectionRange(start,end); }catch(err){} } }
  }
}
function handleModalChange(e, ds){
  const modal = State.modal; if(!modal) return false;
  if(modal.kind==='workout'){
    const w = modal.w;
    if(ds.w!==undefined){ w[ds.w] = e.target.value; if(ds.w==='participantId') renderModal(); else Storage.save(); return true; }
    if(ds.blockRest!==undefined){ w.blocks[+ds.blockRest].restSeconds = +e.target.value; return true; }
    if(ds.dropset!==undefined){ const [bi,ei]=pathGet(ds.dropset); w.blocks[bi].exercises[ei].isDropset = e.target.checked; renderModal(); return true; }
    if(ds.set!==undefined){
      const parts = ds.set.split('.'); const bi=+parts[0],ei=+parts[1],si=+parts[2],field=parts[3];
      let val = e.target.value;
      if(field==='weight'){ w.blocks[bi].exercises[ei].sets[si].weight = val===''?'':toKg(val, DB.settings.units); }
      else if(field==='reps'||field==='time'||field==='distance'){ w.blocks[bi].exercises[ei].sets[si][field]=val===''?'':Number(val); }
      else { w.blocks[bi].exercises[ei].sets[si][field]=val; }
      liveUpdateModal(); return true;
    }
    if(ds.recurOn!==undefined){ modal.recurRule.on = e.target.checked; renderModal(); return true; }
    if(ds.recurFreq!==undefined){ modal.recurRule.freq = e.target.value; renderModal(); return true; }
    if(ds.recurUntil!==undefined){ modal.recurRule.until = e.target.value; return true; }
    if(ds.recurDay!==undefined){
      const i = +ds.recurDay; const days = modal.recurRule.days; const p = days.indexOf(i);
      if(e.target.checked && p===-1) days.push(i);
      if(!e.target.checked && p!==-1) days.splice(p,1);
      return true;
    }
  }
  return false;
}

function handleRecurScope(scope){
  const w = State.modal.w;
  const mode = State.modal.mode;
  if(mode==='delete'){
    if(scope==='single'){ DB.workouts = DB.workouts.filter(x=>x.id!==w.id); }
    else { DB.workouts = DB.workouts.filter(x=> !(x.recurringId===w.recurringId && x.date>=w.date)); }
  } else if(mode==='save'){
    if(scope==='single'){
      const idx = DB.workouts.findIndex(x=>x.id===w.id); DB.workouts[idx]=w;
    } else {
      const idx = DB.workouts.findIndex(x=>x.id===w.id);
      const orig = DB.workouts[idx];
      DB.workouts.forEach((x,i)=>{ if(x.recurringId===w.recurringId && x.date>=w.date){
        DB.workouts[i] = Object.assign({}, w, {id:x.id, date:x.date});
      }});
    }
  }
  Storage.save(); closeModal(); rerender();
}

// ===== LIGHT WEIGHT: новый личный рекорд веса в упражнении =====
// постеры лежат в img/lightweight/01.jpg … NN.jpg — чтобы добавить персонажа, положите следующий номер и увеличьте LW_COUNT
const LW_COUNT = 15;
const lwShown = new Set();   // уже показанные рекорды в этой сессии (id тренировки + упражнение + вес)
// рекорды тренировки: максимальный вес (≥1 повтор) больше, чем во всех прошлых тренировках этого участника
function findRecords(w){
  const out = [];
  (w.blocks||[]).forEach(b=>(b.exercises||[]).forEach(ex=>{
    let best = null;
    (ex.sets||[]).forEach(st=>{ const wt = Number(st.weight)||0, r = Number(st.reps)||0; if(wt>0 && r>=1 && (!best || wt>best.weight || (wt===best.weight && r>best.reps))) best = {weight:wt, reps:r}; });
    if(!best) return;
    let prev = 0;
    DB.workouts.forEach(o=>{ if(o.id===w.id || o.participantId!==w.participantId) return;
      (o.blocks||[]).forEach(ob=>(ob.exercises||[]).forEach(oe=>{ if(oe.exerciseId!==ex.exerciseId) return;
        (oe.sets||[]).forEach(st=>{ if(Number(st.reps)>=1) prev = Math.max(prev, Number(st.weight)||0); }); })); });
    const info = DB.exercises.find(e=>e.id===ex.exerciseId);
    if(prev>0 && best.weight>prev && !out.some(x=>x.exerciseId===ex.exerciseId)) out.push({exerciseId:ex.exerciseId, name:info?info.name:'упражнение', weight:best.weight, reps:best.reps, prev});
  }));
  return out;
}
function showLightWeight(w){
  const recs = findRecords(w).filter(r=>!lwShown.has(w.id+r.exerciseId+r.weight));
  if(!recs.length) return;
  recs.forEach(r=>lwShown.add(w.id+r.exerciseId+r.weight));
  const n = 1 + Math.floor(Math.random()*LW_COUNT), units = DB.settings.units;
  const box = document.createElement('div'); box.className = 'lw-box';
  box.innerHTML = `<div class="lw-frame"><img src="img/lightweight/${String(n).padStart(2,'0')}.jpg" alt="Light weight"></div>
    <div class="lw-text">${recs.map(r=>`Впервые достигнут вес <b>${convW(r.weight,units)} ${unitLabel(units)}</b> в упражнении <b>${esc(r.name)}</b>, количество повторений <b>${r.reps}</b>`).join('<br>')}</div>
    <button class="btn primary lw-ok">Light weight, baby! 💪</button>`;
  box.onclick = e=>{ if(e.target===box || e.target.classList.contains('lw-ok')) box.remove(); };
  document.body.appendChild(box);
}
// ачивки, полученные именно этой тренировкой: сравниваем «до» и «после» её учёта
function workoutAchievements(w){
  const pid = w.participantId, today = dstr(new Date());
  const isDone = o => o.status==='done' || (o.date<=today && hasFilledSets(o));
  const others = DB.workouts.filter(o=>o.participantId===pid && o.id!==w.id && isDone(o));
  State.achFor = pid;
  const before = achievementsList(others), after = achievementsList([...others, w]);
  const bMap = new Map(before.map(x=>[x.cat+'|'+x.title, x])), prevOf = a => bMap.get(a.cat+'|'+a.title) || {};
  const fresh = after.filter(a=>{ const b = prevOf(a); return a.got && (!b.got || (a.cat==='beast' && a.count>(b.count||0))); })
    .map(a=>a.cat==='beast' ? {...a, count:a.count-(prevOf(a).count||0)} : a);
  return compressBw(fresh);   // из лестницы «Свой вес» — только верхняя новая ступень
}

function hasFilledSets(w){ return (w.blocks||[]).some(b=>(b.exercises||[]).some(ex=>(ex.sets||[]).some(s=>Number(s.reps)>0||Number(s.time)>0||Number(s.distance)>0))); }
// «Завершить»: отмечаем выполненной, сохраняем на сервер и просим бота прислать итог (участнику и его тренерам)
async function finishWorkout(){
  const w = State.modal.w;
  if(!hasFilledSets(w)){ toast('Заполните хотя бы один подход'); return; }
  if(!w.name) w.name = WT[w.type] || 'Тренировка';
  w.status = 'done';
  const idx = DB.workouts.findIndex(x=>x.id===w.id); if(idx<0) DB.workouts.push(w); else DB.workouts[idx]=w;
  rerender();
  const achs = showWorkoutResult(w);
  try{
    await Storage.flush();
    const r = await fetch(SUPABASE_URL + '/functions/v1/telegram-bot', { method:'POST',
      headers:{'Content-Type':'application/json', apikey:SUPABASE_ANON_KEY, Authorization:'Bearer '+Auth.getToken()},
      body: JSON.stringify({action:'workout_done', workout_id:w.id, achievements: achs.slice(0,30).map(a=>`${a.icon} ${a.title}${a.cat==='beast'&&a.count>1?' ×'+a.count:''}`)}) });
    toast(r.ok ? '💪 Тренировка завершена — итог отправлен в бот' : 'Тренировка сохранена, но бот не ответил');
  }catch(e){ toast('Тренировка сохранена, но бот недоступен'); }
}
function saveWorkoutFromModal(){
  const w = State.modal.w, isNew = State.modal.isNew, recur = State.modal.recurRule;
  const wasDone = !isNew && (DB.workouts.find(x=>x.id===w.id)||{}).status==='done';
  // прошедшая тренировка с заполненными подходами считается выполненной (для вечернего вопроса бота)
  if(w.status!=='done' && w.date<=dstr(new Date()) && hasFilledSets(w)) w.status='done';
  if(isNew && w.status!=='done') w.status='planned';
  if(w.status==='done' && !wasDone && !(recur && recur.on)) setTimeout(()=>showWorkoutResult(w), 50);
  if(!w.name) w.name = WT[w.type] || 'Тренировка';
  if(isNew){
    if(recur && recur.on){
      const groupId = Storage.uid();
      const start = parseD(w.date);
      const until = recur.until? parseD(recur.until) : new Date(start.getFullYear(), start.getMonth()+2, start.getDate());
      let cur = new Date(start);
      let count=0;
      while(cur<=until && count<400){
        const wd = (cur.getDay()+6)%7;
        const match = recur.freq==='daily' ? true : recur.days.includes(wd);
        if(match){
          const copy = JSON.parse(JSON.stringify(w));
          copy.id = Storage.uid(); copy.date = dstr(cur); copy.recurringId = groupId;
          DB.workouts.push(copy); count++;
        }
        cur = new Date(cur.getFullYear(),cur.getMonth(),cur.getDate()+1);
      }
    } else {
      DB.workouts.push(w);
    }
    Storage.save(); closeModal(); rerender();
  } else {
    if(w.recurringId){
      State.modal = {kind:'recurEdit', mode:'save', w};
      renderModal();
    } else {
      const idx = DB.workouts.findIndex(x=>x.id===w.id); DB.workouts[idx]=w;
      Storage.save(); closeModal(); rerender();
    }
  }
}

/* ===================== TEMPLATE IMPORT (текстовый формат + JSON) ===================== */
const IMPORT_EXAMPLE = `# Грудь + трицепс
Жим лёжа: 60x10, 80x8, 80x8
Суперсет (отдых 60):
- Жим гантелей лёжа: 20x12, 20x10
- Разведение гантелей: 10x12, 10x12
Дроп-сет: Жим лёжа: 100x8, 80x8, 60x10
Французский жим: 3 по 10-12
Отжимания: 15, 12, 10

# Кардио
Бег: 30 мин, 5 км`;
function normName(n){ return String(n||'').toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ').trim(); }
function findOrCreateExercise(name, isCardio){
  const n = normName(name);
  let ex = DB.exercises.find(e=>normName(e.name)===n);
  if(!ex){ ex = {id:Storage.uid(), name:name.trim(), mainGroup:'other', secondaryGroups:[], type:isCardio?'cardio':'strength', ownerId:selfParticipantId()}; DB.exercises.push(ex); }
  return ex.id;
}
// "80x8, 80x8" | "3 по 10-12" | "3 по 8 @ 60" | "15, 12" (свой вес) | "30 мин, 5 км"
function parseSets(spec){
  spec = spec.trim(); const sets = [];
  const cardio = /мин|км/i.test(spec);
  if(cardio){
    const t = spec.match(/([\d.,]+)\s*мин/i), d = spec.match(/([\d.,]+)\s*км/i);
    sets.push({...blankSet(), time: t?Number(t[1].replace(',','.')):'', distance: d?Number(d[1].replace(',','.')):''});
    return {sets, cardio:true};
  }
  const m = spec.match(/^(\d+)\s*(?:по|x|х|×|\*)\s*(\d+)(?:\s*[-–]\s*(\d+))?(?:\s*@\s*([\d.,]+))?$/i);
  if(m && /по|@/i.test(spec) || (m && m[3])){
    for(let i=0;i<+m[1];i++) sets.push({...blankSet(), reps:+m[2], weight: m[4]?Number(m[4].replace(',','.')):'', note: m[3]?`${m[2]}–${m[3]} повт.`:''});
    return {sets, cardio:false};
  }
  spec.split(/[,;]/).map(x=>x.trim()).filter(Boolean).forEach(part=>{
    const wr = part.match(/^([\d.,]+)\s*(?:кг)?\s*[xх×*]\s*(\d+)$/i);
    if(wr) sets.push({...blankSet(), weight:Number(wr[1].replace(',','.')), reps:+wr[2]});
    else if(/^\d+$/.test(part)) sets.push({...blankSet(), reps:+part});
    else throw new Error('не понял подход «'+part+'»');
  });
  return {sets, cardio:false};
}
function parseTemplatesText(text){
  text = text.trim();
  if(text.startsWith('[') || text.startsWith('{')){
    // JSON: [{name, blocks:[{kind, restSeconds, exercises:[{name, isDropset, sets:[{weight,reps,time,distance,note}]}]}]}]
    const arr = [].concat(JSON.parse(text));
    return arr.map(t=>({name:t.name||'Без названия', blocks:(t.blocks||[]).map(b=>({id:Storage.uid(), kind:b.kind||'normal', restSeconds:+b.restSeconds||60,
      exercises:(b.exercises||[]).map(e=>({exerciseId:findOrCreateExercise(e.name, (e.sets||[]).some(s=>s.distance||s.time)), isDropset:!!e.isDropset,
        sets:(e.sets||[{}]).map(s=>({...blankSet(), ...s}))}))}))}));
  }
  const out = []; let cur = null, superset = null;
  text.split(/\r?\n/).forEach((raw, i)=>{
    const line = raw.trim(); if(!line) { superset=null; return; }
    const err = msg => { throw new Error(`строка ${i+1}: ${msg}`); };
    if(line.startsWith('#')){ cur = {name:line.replace(/^#+/,'').trim()||'Без названия', blocks:[]}; out.push(cur); superset=null; return; }
    if(!cur){ cur = {name:'Импортированный шаблон', blocks:[]}; out.push(cur); }
    const ss = line.match(/^суперсет\s*(?:\(\s*отдых\s*(\d+)\s*\))?\s*:?\s*$/i);
    if(ss){ superset = {id:Storage.uid(), kind:'superset', restSeconds:+ss[1]||60, exercises:[]}; cur.blocks.push(superset); return; }
    let body = line, inSuperset = false, drop = false;
    if(/^[-–•]/.test(body)){ if(!superset) err('упражнение с «-» должно идти после строки «Суперсет:»'); inSuperset = true; body = body.replace(/^[-–•]\s*/,''); }
    else superset = null;
    const dm = body.match(/^дроп-?сет\s*:\s*(.+)$/i); if(dm){ drop = true; body = dm[1]; }
    const idx = body.lastIndexOf(':'); if(idx<0) err('нет двоеточия между упражнением и подходами');
    const name = body.slice(0,idx).trim(); if(!name) err('не указано упражнение');
    let parsed; try{ parsed = parseSets(body.slice(idx+1)); }catch(e){ err(e.message); }
    const ex = {exerciseId:findOrCreateExercise(name, parsed.cardio), isDropset:drop, sets:parsed.sets};
    if(inSuperset) superset.exercises.push(ex);
    else cur.blocks.push({id:Storage.uid(), kind:drop?'dropset':'normal', restSeconds:DB.settings.restDefault||90, exercises:[ex]});
  });
  return out;
}
function renderImportModal(){
  return `<div class="overlay" data-close-overlay="1"><div class="modal" data-stop>
    <h2>Импорт шаблонов</h2>

// итоги года: считаем из загруженных тренировок; если их нет (старые годы) — берём свод с сервера (yearly_archive)
function yearSummary(ws, y){
  const list = ws.filter(w=>w.date.startsWith(y+'-')).sort((a,b)=>a.date.localeCompare(b.date));
  if(!list.length) return null;
  const tons = list.map(w=>Calc.workoutTonnage(w)); const bi = tons.indexOf(Math.max(...tons));
  const weeks = new Set(list.map(w=>weekKeyOf(w.date))).size;
  const weeksInYear = y===new Date().getFullYear() ? Math.max(1, Math.ceil((Date.now()-new Date(y,0,1))/(7*86400000))) : 52;
  const durs = list.map(w=>Number(w.duration)||0).filter(Boolean);
  return { year:y, first:{date:list[0].date, name:list[0].name, tonnage:tons[0]}, best:{date:list[bi].date, name:list[bi].name, tonnage:tons[bi]},
    avgDur: durs.length ? durs.reduce((a,b)=>a+b,0)/durs.length : 0, stability: Math.min(100, weeks/weeksInYear*100),
    total: list.length, tonnage: tons.reduce((a,b)=>a+b,0), current: y===new Date().getFullYear() };
}
async function loadArchive(pid){
  State.archive = State.archive || {}; State.archive[pid] = [];   // помечаем «загружается», чтобы не запрашивать повторно
  const {data} = await Auth.getClient().from('yearly_archive').select('*').eq('participant_id', pid);
  State.archive[pid] = data || []; if(State.view==='stats') renderMain();
}
function archiveCard(pid){
  if(!State.archive || !State.archive[pid]){ loadArchive(pid); }

  const ws = DB.workouts.filter(w=>w.participantId===pid && (w.status==='done' || (w.date<=dstr(new Date()) && hasFilledSets(w))));
  const years = [...new Set([...ws.map(w=>+w.date.slice(0,4)), ...server.map(r=>r.year)])].sort((a,b)=>b-a);
  const units = DB.settings.units, kg = v => `${fmtNum(convW(v,units))} ${unitLabel(units)}`;
  const rows = years.map(y=>{ const l = yearSummary(ws, y); if(l) return l; const r = server.find(x=>x.year===y);
    return r && { year:y, first:r.first_workout||{}, best:r.best_workout||{}, avgDur:+r.avg_duration_min||0, stability:+r.stability_percent||0, total:r.total_workouts, tonnage:+r.total_tonnage||0 }; }).filter(Boolean);

// дневник: сразу последние 60 дней (для недельного графика и «недавних»), более ранние даты — по запросу
async function loadFood(date){
  const c = Auth.getClient(), uid = foodUid();
  State.foodLoaded = State.foodLoaded || {}; State.foodRows = State.foodRows || [];
  let q = c.from('food_log').select('*').eq('user_id', uid);
  if(!State.foodLoaded[uid]){
    const L = State.foodLoaded[uid] = {}, since = dstr(new Date(Date.now()-60*86400000));
    for(let d=parseD(since); d<=new Date(); d.setDate(d.getDate()+1)) L[dstr(d)] = 1;
    q = q.gte('date', since);
  } else { State.foodLoaded[uid][date] = 1; q = q.eq('date', date); }
  const {data, error} = await q.order('created_at');
  if(error){ toast('Не загрузился дневник питания: '+error.message); return; }
  const ids = new Set(State.foodRows.map(r=>r.id));
  State.foodRows.push(...(data||[]).filter(r=>!ids.has(r.id)));
  if(State.view==='food') renderMain();
}

// норма по формуле Миффлина — Сан-Жеора × активность, с поправкой на цель
const KCAL_GOALS = [['lose','Снижение веса',0.85],['keep','Поддержание веса',1],['gain','Набор мышечной массы',1.1]];
// цель питания: выбранная в разделе калорий, иначе — по цели занятий из личных данных
const kcalGoalOf = d => d.kcal_goal || (/похуд/i.test(d.goal||'') ? 'lose' : /масс/i.test(d.goal||'') ? 'gain' : 'keep');
function foodNorm(uid = foodUid()){
  const d = (DB.details||[]).find(x=>x.user_id===uid) || {};
  const w = +d.weight_kg || 0, h = +d.height_cm || 0, age = +ageFrom(d.birth_date) || 0;
  const goal = kcalGoalOf(d), gk = KCAL_GOALS.find(g=>g[0]===goal)[2], act = +d.activity || 1.375;
  const bmr = (w && h && age && d.gender) ? Math.round(10*w + 6.25*h - 5*age + (d.gender==='male' ? 5 : -161)) : 0;
  const tdee = bmr ? Math.round(bmr * act / 10) * 10 : 0;                       // расход за день = поддержание веса
  const byGoal = Object.fromEntries(KCAL_GOALS.map(([id,,k])=>[id, Math.round(bmr * act * k / 10) * 10]));
  const auto = bmr ? byGoal[goal] : 0;
  const kcal = +d.kcal_target || auto;
  if(!kcal) return null;
  const pk = goal==='keep' ? 1.6 : 2;
  const p = w ? w * pk : kcal*0.25/4, f = w ? w*0.9 : kcal*0.3/9;
  return { kcal, auto, manual: !!+d.kcal_target, goal, gk, bmr, tdee, byGoal, act, age, h, pk, gender: d.gender,
    p: Math.round(p), f: Math.round(f), c: Math.max(0, Math.round((kcal - p*4 - f*9)/4)), weight: w, activity: d.activity || '1.375' };
}
// «почему так»: расчёт по шагам простыми словами
function normExplain(n){
  if(!n.bmr) return '';
  const g = KCAL_GOALS.find(x=>x[0]===n.goal);
  return `<details class="base-group" style="margin-top:10px"><summary>Почему такая норма?</summary><div style="padding:8px 2px;line-height:1.5">
    <p><b>1. Базовый обмен — ${n.bmr} ккал.</b><br>Столько организм тратит в полном покое: на дыхание, сердце, мозг, температуру тела.<br>
    <span class="muted">Формула Миффлина — Сан-Жеора: 10 × ${fmtNum(n.weight)} кг + 6,25 × ${fmtNum(n.h)} см − 5 × ${n.age} лет ${n.gender==='male'?'+ 5':'− 161'} = ${n.bmr}.</span></p>
    <p><b>2. С учётом активности — ${n.tdee} ккал.</b><br>Базовый обмен × ${String(n.act).replace('.',',')} — активность: ${(ACTIVITY.find(a=>+a[0]===+n.act)||['',''])[1].toLowerCase().replace(' (',', ').replace(')','')}. Это ваш расход за день — при такой калорийности вес держится на месте.</p>
    <p><b>3. Цель «${g[1].toLowerCase()}» — ${n.byGoal[n.goal]} ккал.</b><br>${
      n.goal==='lose' ? 'Минус 15% от расхода. Небольшой дефицит даёт снижение примерно на 0,3–0,7 кг в неделю и не съедает мышцы; жёсткие диеты замедляют обмен и возвращают вес.'
      : n.goal==='gain' ? 'Плюс 10% к расходу. Небольшой профицит даёт материал для роста мышц при силовых тренировках; больший — чаще уходит в жир.'
      : 'Калорийность равна расходу: вес стабилен, энергии хватает на тренировки и восстановление.'}</p>
    <p><b>4. Белки, жиры, углеводы.</b><br>Белок ${String(n.pk).replace('.',',')} г на кг веса (${n.p} г) — строительный материал мышц${n.goal==='keep'?'':', при дефиците и наборе нужно больше'}.<br>
    Жиры 0,9 г/кг (${n.f} г) — для гормонов и усвоения витаминов.<br>Углеводы — всё остальное (${n.c} г): основное топливо для тренировок.</p>
    <p class="muted">Это ориентир, а не точная цифра. Если 2–3 недели вес меняется не так, как нужно, скорректируйте норму на 100–200 ккал.</p>
  </div></details>`;
}
// примерный расход на тренировках дня: силовая ≈ 5 МЕТ, кардио ≈ 7 МЕТ
function workoutBurn(date, weight){
  return Math.round(DB.workouts.filter(w=>w.participantId===foodUid() && w.date===date && (w.status==='done' || hasFilledSets(w)))
    .reduce((a,w)=>a + (w.type==='cardio' ? 7 : 5) * (weight||70) * (Number(w.duration)||0)/60, 0));
}

  const wMax = Math.max(n ? n.kcal : 0, ...week.map(x=>x.kcal), 1) * 1.1, W = 340, H = 160;

      <text x="${10+i*bw+bw/2}" y="${H-6}" font-size="11" text-anchor="middle" fill="currentColor" opacity=".7">${wd(x.ds)}</text>

async function saveFoodPatch(patch, msg){

}

function foodMatches(q){
  const recent = []; const seen = new Set();
  (State.foodRows||[]).filter(r=>r.user_id===foodUid()).reverse().forEach(r=>{ const k = normName(r.name); if(!seen.has(k) && +r.grams>0){ seen.add(k);
    const g = +r.grams/100; const cat0 = FOOD_DB.find(x=>normName(x.name)===k);
    recent.push({name:r.name, kcal:+r.kcal/g, p:+r.protein/g, f:+r.fat/g, c:+r.carbs/g, lastGrams:+r.grams, recent:true, unit:r.unit, pc:cat0&&cat0.pc, pcName:cat0&&cat0.pcName}); } });
  const nq = normName(q||'');
  const cat = FOOD_DB.filter(x=>!seen.has(normName(x.name)));
  if(!nq) return [...recent.slice(0,8), ...cat].slice(0,40);
  const stem = w => w.length>=4 ? w.slice(0,-1) : w;
  const words = nq.split(' ');
  const hit = x => { const n = normName(x.name), nw = n.split(/[\s(),%]+/);
    return words.every(w => n.includes(w) || nw.some(t => t.startsWith(stem(w)))); };
  return [...recent, ...cat].filter(hit).sort((a,b)=>(normName(b.name).startsWith(nq)) - (normName(a.name).startsWith(nq))).slice(0,40);
}

async function saveFoodEntry(){
  const m = State.modal, num = v => { const x = parseFloat(String(v??'').replace(',','.')); return isFinite(x) ? x : 0; };
  let item, grams;
  if(m.custom){
    const cu = m.cu; grams = num(cu.grams);
    if(!(cu.name||'').trim() || grams<=0 || num(cu.kcal)<=0) return toast('Заполните название, граммы и калории');
    item = {name:cu.name.trim(), kcal:num(cu.kcal), p:num(cu.p), f:num(cu.f), c:num(cu.c), unit:cu.unit||'g'};
  } else { item = m.sel; grams = num(m.grams); if(grams<=0) return toast(unitOf(item)==='мл'?'Укажите объём':'Укажите вес порции'); }
  const r = foodCalc(item, grams), rd = v => Math.round(v*10)/10;
  const row = { user_id: m.uid, date: m.date, meal: m.meal, name: item.name, unit: unitOf(item)==='мл' ? 'ml' : 'g', grams: rd(grams), kcal: rd(r.kcal), protein: rd(r.p), fat: rd(r.f), carbs: rd(r.c) };
  const c = Auth.getClient();
  const {data, error} = m.editId ? await c.from('food_log').update(row).eq('id', m.editId).select().single() : await c.from('food_log').insert(row).select().single();
  if(error) return toast('Не сохранено: '+error.message);
  State.foodRows = State.foodRows.filter(r=>r.id!==m.editId).concat([data]); State.modal = null; renderModal(); renderMain();
}

function foodClick(ds){
  const a = ds.food, m = State.modal;
  if(a==='prev' || a==='next'){ const d = parseD(foodDate()); d.setDate(d.getDate() + (a==='next'?1:-1)); if(dstr(d)<=dstr(new Date())) State.foodDate = dstr(d); renderMain(); return; }
  if(a==='details'){ State.view='participants'; State.participantProfile=selfParticipantId(); rerender(); return; }
  if(a==='saveNorm') return saveFoodNorm();
  if(a==='goal') return saveFoodPatch({kcal_goal: ds.g}, 'Цель сохранена');
  if(a==='del'){ const id = ds.id;
    Auth.getClient().from('food_log').delete().eq('id', id).then(({error})=>{ if(error) return toast('Ошибка: '+error.message);
      State.foodRows = State.foodRows.filter(r=>r.id!==id); renderMain(); });
    return; }
  if(a==='add'){ State.modal = {kind:'food', uid: foodUid(), meal: ds.meal, date: foodDate(), q:''}; renderModal(); return; }
  if(a==='edit'){ const r = State.foodRows.find(x=>x.id===ds.id); if(!r) return; const g = +r.grams/100, cat0 = FOOD_DB.find(x=>normName(x.name)===normName(r.name));
    State.modal = {kind:'food', uid: r.user_id, meal: r.meal, date: r.date, editId: r.id, grams: +r.grams,
      sel: {name:r.name, kcal:+r.kcal/g, p:+r.protein/g, f:+r.fat/g, c:+r.carbs/g, unit:r.unit, pc:cat0&&cat0.pc, pcName:cat0&&cat0.pcName}};
    renderModal(); return; }
  if(!m || m.kind!=='food') return;
  if(a==='pick'){ const it = m.list[+ds.i]; m.sel = it; m.grams = it.lastGrams || it.pc || 100; renderModal(); return; }
  if(a==='pc'){ m.grams = Math.round(m.sel.pc * +ds.k); renderModal(); return; }
  if(a==='back'){ m.sel = null; m.custom = false; renderModal(); return; }
  if(a==='unit'){ m.cu.unit = ds.u; renderModal(); return; }
  if(a==='custom'){ m.custom = true; m.cu = {name: m.q||''}; renderModal(); return; }
  if(a==='save') return saveFoodEntry();
}
function foodInput(e){
  const m = State.modal, key = e.target.dataset.foodIn; if(!m || m.kind!=='food') return;
  if(key==='q'){ m.q = e.target.value; renderModal(); const el = document.querySelector('[data-food-in="q"]'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } return; }
  if(key==='grams'){ m.grams = e.target.value; const box = document.getElementById('foodCalc'); if(box) box.innerHTML = foodCalcText(foodCalc(m.sel, parseFloat(String(m.grams).replace(',','.'))||0)); return; }
  if(key==='meal'){ m.meal = e.target.value; return; }
  if(key.startsWith('cu.')) m.cu[key.slice(3)] = e.target.value;
}

function membershipEnd(start, term){
  if(!start || !term || term==='custom') return null;
  const d = parseD(start), n = parseInt(term);
  if(term.endsWith('w')) d.setDate(d.getDate() + 7*n); else d.setMonth(d.getMonth() + n);
  d.setDate(d.getDate() - 1);
  return dstr(d);

function membershipStatus(end){

  return `Действует до <b>${fmtDate(end)}</b> · осталось ${days===0?'<b>последний день</b>':`<b>${days}</b> ${plural(days,'день','дня','дней')}`}`;

function weightChart(uid){
  const pts = (DB.weights||[]).filter(x=>x.user_id===uid).sort((a,b)=>a.date.localeCompare(b.date));
  if(pts.length<2) return `<div class="muted">${pts.length?`Вес ${fmtNum(pts[0].weight_kg)} кг (${fmtDateShort(pts[0].date)}). График появится после второго измерения.`:'Измерений веса пока нет.'}</div>`;
  const W=560,H=120, vals=pts.map(p=>+p.weight_kg), mn=Math.min(...vals)-1, mx=Math.max(...vals)+1;
  const X=i=>10+i*(W-20)/(pts.length-1), Y=v=>H-18-(v-mn)/(mx-mn)*(H-34);
  const d=pts.map((p,i)=>`${X(i)},${Y(+p.weight_kg)}`).join(' ');
  const diff=vals[vals.length-1]-vals[0];
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:120px"><polyline points="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>

    <text x="${W-10}" y="${H-3}" font-size="11" fill="currentColor" opacity=".6" text-anchor="end">${fmtDateShort(pts[pts.length-1].date)} · ${fmtNum(vals[vals.length-1])} кг</text></svg>

}
