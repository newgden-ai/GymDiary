<style>

  --text:#1f2320; --text-dim:#6b6f68; --accent:#3d5a45; --accent2:#8a9a5b;

}

*{box-sizing:border-box;}
html,body{height:100%;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.4;}

h1,h2,h3{margin:0 0 8px;font-weight:600;}
.hidden{display:none!important;}
.app{display:flex;min-height:100vh;}

.field textarea{resize:vertical;min-height:50px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}

.week-cols{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}

.ex-card{border:1px dashed var(--border);border-radius:8px;padding:8px;margin:6px 0;background:var(--surface);}

.tot-box{background:var(--accent);color:#fff;border-radius:10px;padding:10px 12px;margin-top:10px;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);}

.chips-wrap{display:flex;gap:6px;flex-wrap:wrap;}

<script>

/* ===================== AUTH MODULE (Telegram -> Supabase session) ===================== */
const Auth = (function(){
  let client = null, session = null;
  function log(msg){
    const el = document.getElementById('authLog');
    if(el){ el.style.display='block'; el.textContent += msg + '\n'; }
    console.log('[auth]', msg);
  }
  function setStatus(msg){ const el = document.getElementById('authStatus'); if(el) el.textContent = msg; }
  async function login(){
    if(!window.supabase){ setStatus('❌ Не удалось загрузить supabase-js (проверьте интернет).'); return null; }
    client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const tg = window.Telegram && window.Telegram.WebApp;
    if(!tg || !tg.initData){
      setStatus('❌ Откройте приложение через кнопку меню в Telegram-боте, а не напрямую в браузере.');
      return null;
    }
    tg.ready(); tg.expand && tg.expand();

    setStatus('Проверяем вход…');
    let res, payload;
    try{
      res = await fetch(SUPABASE_URL + '/functions/v1/telegram-auth', {
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
        },
        body: JSON.stringify({initData: tg.initData})
      });
      payload = await res.json();
    }catch(e){ setStatus('❌ Нет связи с сервером входа'); log(String(e)); return null; }

    if(!res.ok || payload.error){ setStatus('❌ Ошибка входа: '+(payload.error||res.status)); log(JSON.stringify(payload)); return null; }

    const { data, error } = await client.auth.verifyOtp({ email: payload.email, token: payload.otp, type:'email' });
    if(error){ setStatus('❌ Не удалось войти: '+error.message); return null; }

    session = data.session;
    setStatus('Загружаем данные…');
    return { client, userId: data.user.id };
  }
  function getClient(){ return client; }
  return { login, getClient };
})();

/* ===================== STORAGE MODULE (Supabase, с diff-синхронизацией) ===================== */
const Storage = (function(){
  let selfId = null;
  // снимок последнего состояния, отправленного на сервер — по нему считаем, что изменилось
  let snapshot = { workouts:[], templates:[], exercises:[], profile:null };

  function rowsToDiff(current, previous, keyField){
    const prevMap = new Map(previous.map(r=>[r[keyField], JSON.stringify(r)]));
    const curMap = new Map(current.map(r=>[r[keyField], r]));
    const upserts = [];
    for(const [id,row] of curMap){
      const prevJson = prevMap.get(id);
      const curJson = JSON.stringify(row);
      if(prevJson === undefined || prevJson !== curJson) upserts.push(row);
    }
    const deletes = [];
    for(const [id] of prevMap){ if(!curMap.has(id)) deletes.push(id); }
    return { upserts, deletes };
  }

  function workoutToDb(w){
    return {
      id:w.id, participant_id:w.participantId, created_by:selfId, date:w.date,
      time:w.time||null, duration:w.duration?Number(w.duration):null, name:w.name||null,
      type:w.type, blocks:w.blocks||[], notes:w.notes||null, result:w.result||null,
      recurring_group_id:w.recurringId||null, status:'done'
    };
  }
  function workoutFromDb(r){
    return { id:r.id, date:r.date, time:r.time||'', duration:r.duration||'', name:r.name||'',
      participantId:r.participant_id, type:r.type, blocks:r.blocks||[], notes:r.notes||'',
      result:r.result||'', recurringId:r.recurring_group_id||null };
  }
  function templateToDb(t){ return { id:t.id, owner_id:selfId, name:t.name, blocks:t.blocks||[] }; }
  function templateFromDb(r){ return { id:r.id, name:r.name, blocks:r.blocks||[] }; }
  function exerciseToDb(e){ return { id:e.id, owner_id:selfId, name:e.name, main_group:e.mainGroup, secondary_groups:e.secondaryGroups||[], type:e.type, image_url:e.imageUrl||null }; }
  function exerciseFromDb(r){ return { id:r.id, name:r.name, mainGroup:r.main_group, secondaryGroups:r.secondary_groups||[], type:r.type, imageUrl:r.image_url||null, ownerId:r.owner_id }; }

  async function load(auth){
    selfId = auth.userId;
    const client = auth.client;

    const [{data:profile}, {data:exRows}, {data:tplRows}, {data:wRows}] = await Promise.all([
      client.from('profiles').select('*').eq('id', selfId).single(),
      client.from('exercises').select('*').or(`owner_id.is.null,owner_id.eq.${selfId}`),
      client.from('templates').select('*').eq('owner_id', selfId),
      client.from('workouts').select('*').eq('participant_id', selfId)
    ]);

    const exercises = (exRows||[]).map(exerciseFromDb);
    const templates = (tplRows||[]).map(templateFromDb);
    const workouts = (wRows||[]).map(workoutFromDb);

    // пишем сразу в глобальный DB (а не в приватную копию), чтобы Storage и приложение
    // всегда смотрели на один и тот же объект — иначе DB.x = DB.x.filter(...) в коде
    // приложения перестаёт быть видно модулю Storage
    Object.assign(DB, {
      participants: [{ id: selfId, name: profile?.name || 'Я', color: profile?.color || '#3d5a45' }],
      exercises, templates, workouts,
      settings: {
        units: profile?.units || 'kg',
        theme: profile?.theme || 'auto',
        themeColor: profile?.theme_color || 'forest',
        restDefault: profile?.rest_default ?? 90
      }
    });
    snapshot = {
      workouts: JSON.parse(JSON.stringify(wRows||[])),
      templates: JSON.parse(JSON.stringify(tplRows||[])),
      exercises: JSON.parse(JSON.stringify((exRows||[]).filter(r=>r.owner_id===selfId))),
      profile: profile ? JSON.parse(JSON.stringify(profile)) : null
    };
    return DB;
  }

  let saveTimer = null;
  function save(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(syncAll, 500);
  }

  async function syncAll(){
    const client = Auth.getClient();
    if(!client) return;
    try{
      const wDb = DB.workouts.map(workoutToDb);
      const wDiff = rowsToDiff(wDb, snapshot.workouts, 'id');
      if(wDiff.upserts.length) await client.from('workouts').upsert(wDiff.upserts);
      if(wDiff.deletes.length) await client.from('workouts').delete().in('id', wDiff.deletes);

      const tDb = DB.templates.map(templateToDb);
      const tDiff = rowsToDiff(tDb, snapshot.templates, 'id');
      if(tDiff.upserts.length) await client.from('templates').upsert(tDiff.upserts);
      if(tDiff.deletes.length) await client.from('templates').delete().in('id', tDiff.deletes);

      // синхронизируем только свои кастомные упражнения (owner_id = self); общие — только на чтение
      const ownExDb = DB.exercises.filter(e=>e.ownerId===selfId).map(exerciseToDb);
      const eDiff = rowsToDiff(ownExDb, snapshot.exercises, 'id');
      if(eDiff.upserts.length) await client.from('exercises').upsert(eDiff.upserts);
      if(eDiff.deletes.length) await client.from('exercises').delete().in('id', eDiff.deletes);

      const self = DB.participants[0];
      const profileRow = { name:self.name, color:self.color, units:DB.settings.units, theme:DB.settings.theme, theme_color:DB.settings.themeColor, rest_default:Number(DB.settings.restDefault)||90 };
      if(!snapshot.profile || JSON.stringify(profileRow) !== JSON.stringify({name:snapshot.profile.name,color:snapshot.profile.color,units:snapshot.profile.units,theme:snapshot.profile.theme,theme_color:snapshot.profile.theme_color,rest_default:snapshot.profile.rest_default})){
        await client.from('profiles').update(profileRow).eq('id', selfId);
      }

      snapshot = {
        workouts: JSON.parse(JSON.stringify(wDb)),
        templates: JSON.parse(JSON.stringify(tDb)),
        exercises: JSON.parse(JSON.stringify(ownExDb)),
        profile: { id:selfId, ...profileRow }
      };
    }catch(e){ console.error('Ошибка синхронизации:', e); }
  }
  function isGlobalExercise(e){ return e.ownerId === null || e.ownerId === undefined; }

  function exportJSON(){
    const blob = new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download='trendnevnik-backup-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
  }
  function importJSON(obj){
    // Импорт из старой локальной резервной копии: аккуратно переносим тренировки/шаблоны/кастомные упражнения,
    // не трогая id профиля, и сразу шлём на сервер через обычный save()
    if(obj.workouts) DB.workouts = obj.workouts.map(w=>({...w, participantId:selfId}));
    if(obj.templates) DB.templates = obj.templates;
    if(obj.exercises) DB.exercises = DB.exercises.concat(obj.exercises.filter(e=>!DB.exercises.some(x=>x.id===e.id)).map(e=>({...e, ownerId:selfId})));
    save();
  }
  return { load, save, exportJSON, importJSON, uid: ()=> (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2,10)) };
})();

/* ===================== CALC MODULE (tonnage) ===================== */
const Calc = (function(){
  function setTonnage(s){ return (Number(s.weight)||0) * (Number(s.reps)||0); }
  function exTonnage(ex){ return (ex.sets||[]).reduce((a,s)=>a+setTonnage(s),0); }
  function blockTonnage(b){ return (b.exercises||[]).reduce((a,ex)=>a+exTonnage(ex),0); }
  function workoutTonnage(w){ return (w.blocks||[]).reduce((a,b)=>a+blockTonnage(b),0); }
  function muscleBreakdown(w, exercisesDb){
    const map = {};
    (w.blocks||[]).forEach(b=>(b.exercises||[]).forEach(ex=>{
      const info = exercisesDb.find(e=>e.id===ex.exerciseId);
      if(!info) return;
      const t = exTonnage(ex);
      if(t<=0) return;
      map[info.mainGroup] = (map[info.mainGroup]||0) + t;
    }));
    return map;
  }
  return {setTonnage, exTonnage, blockTonnage, workoutTonnage, muscleBreakdown};
})();

const TONNAGE_COMPARISONS = [

function tonnageComparison(kg){
  let best=null;
  for(const [th,label] of TONNAGE_COMPARISONS){ if(kg>=th) best=[th,label]; }
  return best;
}
function nextTonnageComparison(kg){
  return TONNAGE_COMPARISONS.find(([th])=>kg<th) || null;
}
const WORKOUT_MILESTONES = [10,25,50,100,250,500];
const HOUR_MILESTONES = [10,25,50,100,200];
const STREAK_MILESTONES = [2,4,8,12,26,52];
function weeklyStreak(workouts){
  if(!workouts.length) return {current:0, longest:0};
  const weeks = Array.from(new Set(workouts.map(w=>weekKeyOf(w.date)))).sort();
  let longest=1, run=1;
  for(let i=1;i<weeks.length;i++){
    const diffDays = Math.round((parseD(weeks[i])-parseD(weeks[i-1]))/86400000);
    run = (diffDays===7) ? run+1 : 1;
    longest = Math.max(longest, run);
  }
  const thisWeek = weekKeyOf(dstr(new Date()));
  let current=0;
  const lastWeek = weeks[weeks.length-1];
  const gapFromNow = Math.round((parseD(thisWeek)-parseD(lastWeek))/86400000)/7;
  if(gapFromNow<=1){
    current=1;
    for(let i=weeks.length-1;i>0;i--){
      const diffDays = Math.round((parseD(weeks[i])-parseD(weeks[i-1]))/86400000);
      if(diffDays===7) current++; else break;
    }
  }
  return {current, longest};
}
function milestoneBlock(current, milestones, icon, label){
  const reached = milestones.filter(m=>current>=m);
  const next = milestones.find(m=>current>current-1 && current<m) ?? milestones.find(m=>current<m);
  const pct = next ? Math.min(100, Math.round(current/next*100)) : 100;
  return `<div style="margin-bottom:10px">

/* ===================== UTIL ===================== */
function pad(n){return n<10?'0'+n:''+n;}
function dstr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseD(s){const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}
function fmtDate(s){const d=parseD(s);return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});}
function fmtDateShort(s){const d=parseD(s);return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'});}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtNum(n){return Math.round(n*10)/10;}
function convW(kg, units){ return units==='lb' ? fmtNum(kg*2.20462) : fmtNum(kg); }
function unitLabel(units){ return units==='lb' ? 'фунт' : 'кг'; }
function toKg(v, units){ return units==='lb' ? (Number(v)||0)/2.20462 : (Number(v)||0); }

/* ===================== CALENDAR VIEW ===================== */
function occurrencesInRange(from,to){
  // returns workouts (materialized) with date within [from,to]
  return DB.workouts.filter(w=>{
    const d=parseD(w.date); return d>=from && d<=to;
  });
}
function viewCalendar(){
  const d = State.calDate;
  let header='', body='';
  if(State.calMode==='month'){
    const y=d.getFullYear(), m=d.getMonth();
    const first = new Date(y,m,1);
    const startOffset = (first.getDay()+6)%7; // Monday-first
    const gridStart = new Date(y,m,1-startOffset);
    header = d.toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
    let cells='';
    const today=new Date();
    for(let i=0;i<42;i++){
      const cd = new Date(gridStart); cd.setDate(gridStart.getDate()+i);
      const isOther = cd.getMonth()!==m;
      const isToday = sameDay(cd,today);
      const ds = dstr(cd);
      const dayWorkouts = DB.workouts.filter(w=>w.date===ds).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
      const chips = dayWorkouts.slice(0,3).map(w=>{
        const p = DB.participants.find(x=>x.id===w.participantId);
        return `<div class="chip" style="background:${p?p.color:'#888'}" data-open-workout="${w.id}">${w.time||''} ${esc(w.name||WT[w.type]||'')}</div>`;
      }).join('');
      const more = dayWorkouts.length>3 ? `<div class="muted">+${dayWorkouts.length-3} ещё</div>` : '';
      cells += `<div class="cal-cell ${isOther?'other':''} ${isToday?'today':''}" data-day="${ds}">
        <div class="daynum">${cd.getDate()}</div>${chips}${more}</div>`;
    }
    body = `<div class="cal-grid">${WEEKDAYS.map(w=>`<div class="cal-head">${w}</div>`).join('')}${cells}</div>`;
  } else if(State.calMode==='week'){
    const startOffset = (d.getDay()+6)%7;
    const weekStart = new Date(d); weekStart.setDate(d.getDate()-startOffset);
    header = 'Неделя ' + fmtDateShort(dstr(weekStart)) + ' — ' + fmtDateShort(dstr(new Date(weekStart.getFullYear(),weekStart.getMonth(),weekStart.getDate()+6)));
    const today=new Date();
    let cols='';
    for(let i=0;i<7;i++){
      const cd=new Date(weekStart); cd.setDate(weekStart.getDate()+i);
      const ds=dstr(cd);
      const items = DB.workouts.filter(w=>w.date===ds).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
      cols += `<div class="week-col ${sameDay(cd,today)?'today':''}" data-day="${ds}">
        <div class="week-colhead">${WEEKDAYS[i]} ${cd.getDate()}</div>
        ${items.map(w=>{const p=DB.participants.find(x=>x.id===w.participantId);
          return `<div class="agenda-item" style="border-left:3px solid ${p?p.color:'#888'}" data-open-workout="${w.id}"><span class="t">${w.time||''}</span> ${esc(w.name||WT[w.type]||'')}<br><span class="muted">${p?esc(p.name):''}</span></div>`;}).join('')}
        <button class="btn sm ghost" data-add-day="${ds}">+ добавить</button>
      </div>`;
    }
    body = `<div class="week-cols">${cols}</div>`;
  } else { // day
    const ds = dstr(d);
    header = fmtDate(ds);
    const items = DB.workouts.filter(w=>w.date===ds).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    body = `<div class="day-list card">${items.length? items.map(w=>{
      const p=DB.participants.find(x=>x.id===w.participantId);
      const t=Calc.workoutTonnage(w);
      return `<div class="agenda-item" style="border-left:4px solid ${p?p.color:'#888'}" data-open-workout="${w.id}">
        <div class="t">${w.time||'--:--'} · ${esc(w.name||WT[w.type]||'')} ${w.duration?('· '+w.duration+' мин'):''}</div>
        <div class="muted">${p?esc(p.name):''} · ${WT[w.type]||''} ${t>0?('· тоннаж '+fmtNum(t)+' кг'):''}</div>
      </div>`;
    }).join('') : '<div class="muted">Нет тренировок в этот день</div>'}
    <button class="btn primary" style="margin-top:8px" data-add-day="${ds}">+ Добавить тренировку</button>
    </div>`;
  }
  return `
  <div class="topbar">
    <div class="row">
      <button class="btn" data-cal-nav="prev">←</button>
      <button class="btn" data-cal-nav="today">Сегодня</button>
      <button class="btn" data-cal-nav="next">→</button>
      <h2 style="margin-left:8px;text-transform:capitalize">${header}</h2>
    </div>
    <div class="row">
      ${['month','week','day'].map(mm=>`<button class="btn ${State.calMode===mm?'primary':''}" data-cal-mode="${mm}">${mm==='month'?'Месяц':mm==='week'?'Неделя':'День'}</button>`).join('')}
      <button class="btn primary" data-add-day="${dstr(State.calMode==='month'?new Date():d)}">+ Тренировка</button>
    </div>
  </div>
  ${body}`;
}

function lastResultFor(exerciseId, participantId, excludeWorkoutId){
  const past = DB.workouts.filter(w=>w.id!==excludeWorkoutId && w.participantId===participantId)
    .sort((a,b)=> (b.date+(b.time||'')).localeCompare(a.date+(a.time||'')));
  for(const w of past){
    for(const b of w.blocks||[]){
      for(const ex of b.exercises||[]){
        if(ex.exerciseId===exerciseId && ex.sets && ex.sets.length){
          return {date:w.date, sets:ex.sets};
        }
      }
    }
  }
  return null;
}
function bestSetFor(exerciseId, participantId, excludeWorkoutId, isCardio){
  let best=null, bestDate=null, bestScore=-1;
  DB.workouts.forEach(w=>{
    if(w.id===excludeWorkoutId || w.participantId!==participantId) return;
    (w.blocks||[]).forEach(b=>(b.exercises||[]).forEach(ex=>{
      if(ex.exerciseId!==exerciseId) return;
      (ex.sets||[]).forEach(s=>{
        const score = isCardio ? (Number(s.distance)||0) : Calc.setTonnage(s);
        if(score>bestScore && score>0){ bestScore=score; best=s; bestDate=w.date; }
      });
    }));
  });
  return best ? {set:best, date:bestDate} : null;
}

/* ===================== EVENT DELEGATION (bound once; survives re-renders) ===================== */
function pathGet(idx){ return idx.split('.').map(Number); }

function handleModalClick(e, ds){
  const modal = State.modal; if(!modal) return false;
  if(ds.closeOverlay!==undefined){ if(e.target===e.currentTarget||e.target.hasAttribute('data-close-overlay')) closeModal(); return true; }
  if(ds.closeModal!==undefined){ closeModal(); return true; }

  if(modal.kind==='workout'){
    const w = modal.w;
    if(ds.addBlock!==undefined){ w.blocks.push(blankBlock(ds.addBlock)); renderModal(); return true; }
    if(ds.removeBlock!==undefined){ w.blocks.splice(+ds.removeBlock,1); renderModal(); return true; }
    if(ds.addExercise!==undefined){ modal.pendingBlock=+ds.addExercise; modal.kind='exercisePicker'; modal.query=''; modal._back={w,isNew:modal.isNew,recurRule:modal.recurRule}; renderModal(); return true; }
    if(ds.removeExercise!==undefined){ const [bi,ei]=pathGet(ds.removeExercise); w.blocks[bi].exercises.splice(ei,1); renderModal(); return true; }
    if(ds.addSet!==undefined){ const [bi,ei]=pathGet(ds.addSet); w.blocks[bi].exercises[ei].sets.push(blankSet()); renderModal(); return true; }
    if(ds.removeSet!==undefined){ const [bi,ei,si]=pathGet(ds.removeSet); w.blocks[bi].exercises[ei].sets.splice(si,1); renderModal(); return true; }
    if(ds.saveWorkout!==undefined){ saveWorkoutFromModal(); return true; }
    if(ds.saveAsTemplate!==undefined){ State.modal={kind:'saveTemplate', suggestedName:w.name, sourceBlocks:w.blocks}; renderModal(); return true; }
    if(ds.deleteWorkout!==undefined){
      State.modal={kind:'confirmDelete', title:'Удалить тренировку?', text:'Это действие нельзя отменить.', onYes:()=>{
        if(w.recurringId){ State.modal={kind:'recurEdit', mode:'delete', w}; renderModal(); return; }
        DB.workouts = DB.workouts.filter(x=>x.id!==w.id); Storage.save(); closeModal(); rerender();
      }};
      renderModal(); return true;
    }
  } else if(modal.kind==='exercisePicker'){
    if(ds.pickExercise!==undefined){
      const bi = modal.pendingBlock; const back=modal._back;
      back.w.blocks[bi].exercises.push(blankExercise(ds.pickExercise));
      State.modal = {kind:'workout', w:back.w, isNew:back.isNew, recurRule:back.recurRule};
      renderModal(); return true;
    }
    if(ds.createExercise!==undefined){
      const name = (modal.query||'').trim(); if(!name) return true;
      const ex = {id:Storage.uid(), name, mainGroup:'other', secondaryGroups:[], type:'strength', ownerId:selfParticipantId()};
      DB.exercises.push(ex); Storage.save();
      const bi = modal.pendingBlock; const back=modal._back;
      back.w.blocks[bi].exercises.push(blankExercise(ex.id));
      State.modal = {kind:'workout', w:back.w, isNew:back.isNew, recurRule:back.recurRule};
      renderModal(); return true;
    }
  } else if(modal.kind==='confirmDelete'){
    if(ds.confirmYes!==undefined){ modal.onYes(); return true; }
  } else if(modal.kind==='recurEdit'){
    if(ds.recurScope!==undefined){ handleRecurScope(ds.recurScope); return true; }
  } else if(modal.kind==='saveTemplate'){
    if(ds.confirmTemplate!==undefined){
      const name = document.getElementById('tplName').value.trim() || 'Без названия';
      DB.templates.push({id:Storage.uid(), name, blocks: JSON.parse(JSON.stringify(modal.sourceBlocks))});
      Storage.save(); closeModal(); if(State.view==='templates') rerender();
      return true;
    }
  }
  return false;
}

function preserveFocusAndRerender(renderFn){
  const ae = document.activeElement;
  let attr=null, val=null, start=null, end=null;
  if(ae && (ae.tagName==='INPUT'||ae.tagName==='TEXTAREA')){
    for(const a of ['data-set','data-w','data-block-rest','data-setting']){
      if(ae.hasAttribute(a)){ attr=a; val=ae.getAttribute(a); break; }
    }
    start = ae.selectionStart; end = ae.selectionEnd;
  }
  renderFn();
  if(attr){
    const again = document.querySelector('['+attr+'="'+CSS.escape(val)+'"]');
    if(again){ again.focus(); if(start!=null && again.setSelectionRange){ try{ again.setSelectionRange(start,end); }catch(err){} } }
  }
}
function handleModalChange(e, ds){
  const modal = State.modal; if(!modal) return false;
  if(modal.kind==='workout'){
    const w = modal.w;
    if(ds.w!==undefined){ w[ds.w] = e.target.value; if(ds.w==='participantId') renderModal(); else Storage.save(); return true; }
    if(ds.blockRest!==undefined){ w.blocks[+ds.blockRest].restSeconds = +e.target.value; return true; }
    if(ds.dropset!==undefined){ const [bi,ei]=pathGet(ds.dropset); w.blocks[bi].exercises[ei].isDropset = e.target.checked; renderModal(); return true; }
    if(ds.set!==undefined){
      const parts = ds.set.split('.'); const bi=+parts[0],ei=+parts[1],si=+parts[2],field=parts[3];
      let val = e.target.value;
      if(field==='weight'){ w.blocks[bi].exercises[ei].sets[si].weight = val===''?'':toKg(val, DB.settings.units); }
      else if(field==='reps'||field==='time'||field==='distance'){ w.blocks[bi].exercises[ei].sets[si][field]=val===''?'':Number(val); }
      else { w.blocks[bi].exercises[ei].sets[si][field]=val; }
      preserveFocusAndRerender(renderModal); return true;
    }
    if(ds.recurOn!==undefined){ modal.recurRule.on = e.target.checked; renderModal(); return true; }
    if(ds.recurFreq!==undefined){ modal.recurRule.freq = e.target.value; renderModal(); return true; }
    if(ds.recurUntil!==undefined){ modal.recurRule.until = e.target.value; return true; }
    if(ds.recurDay!==undefined){
      const i = +ds.recurDay; const days = modal.recurRule.days; const p = days.indexOf(i);
      if(e.target.checked && p===-1) days.push(i);
      if(!e.target.checked && p!==-1) days.splice(p,1);
      return true;
    }
  }
  return false;
}

function handleRecurScope(scope){
  const w = State.modal.w;
  const mode = State.modal.mode;
  if(mode==='delete'){
    if(scope==='single'){ DB.workouts = DB.workouts.filter(x=>x.id!==w.id); }
    else { DB.workouts = DB.workouts.filter(x=> !(x.recurringId===w.recurringId && x.date>=w.date)); }
  } else if(mode==='save'){
    if(scope==='single'){
      const idx = DB.workouts.findIndex(x=>x.id===w.id); DB.workouts[idx]=w;
    } else {
      const idx = DB.workouts.findIndex(x=>x.id===w.id);
      const orig = DB.workouts[idx];
      DB.workouts.forEach((x,i)=>{ if(x.recurringId===w.recurringId && x.date>=w.date){
        DB.workouts[i] = Object.assign({}, w, {id:x.id, date:x.date});
      }});
    }
  }
  Storage.save(); closeModal(); rerender();
}

function saveWorkoutFromModal(){
  const w = State.modal.w, isNew = State.modal.isNew, recur = State.modal.recurRule;
  if(!w.name) w.name = WT[w.type] || 'Тренировка';
  if(isNew){
    if(recur && recur.on){
      const groupId = Storage.uid();
      const start = parseD(w.date);
      const until = recur.until? parseD(recur.until) : new Date(start.getFullYear(), start.getMonth()+2, start.getDate());
      let cur = new Date(start);
      let count=0;
      while(cur<=until && count<400){
        const wd = (cur.getDay()+6)%7;
        const match = recur.freq==='daily' ? true : recur.days.includes(wd);
        if(match){
          const copy = JSON.parse(JSON.stringify(w));
          copy.id = Storage.uid(); copy.date = dstr(cur); copy.recurringId = groupId;
          DB.workouts.push(copy); count++;
        }
        cur = new Date(cur.getFullYear(),cur.getMonth(),cur.getDate()+1);
      }
    } else {
      DB.workouts.push(w);
    }
    Storage.save(); closeModal(); rerender();
  } else {
    if(w.recurringId){
      State.modal = {kind:'recurEdit', mode:'save', w};
      renderModal();
    } else {
      const idx = DB.workouts.findIndex(x=>x.id===w.id); DB.workouts[idx]=w;
      Storage.save(); closeModal(); rerender();
    }
  }
}

function monthKeyOf(ds){ return ds.slice(0,7); }
function groupSumBy(workouts, keyFn){ const m={}; workouts.forEach(w=>{ const k=keyFn(w.date); m[k]=(m[k]||0)+Calc.workoutTonnage(w); }); return m; }
function avgOfValues(obj){ const vals=Object.values(obj); return vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : 0; }

  const avgT = list.length? totalT/list.length : 0;

      exTotals[key].tonnage += Calc.setTonnage(s);
    });
    exTotals[key].count++;
  })));

  // simple sparkline of tonnage by day
  const byDay = {};
  list.forEach(w=>{ byDay[w.date]=(byDay[w.date]||0)+Calc.workoutTonnage(w); });
  const days = Object.keys(byDay).sort();
  const maxV = Math.max(1,...days.map(d=>byDay[d]));
  const svgW=560, svgH=110, step = days.length>1? svgW/(days.length-1) : svgW;
  const pts = days.map((d,i)=>`${i*step},${svgH-6-(byDay[d]/maxV)*(svgH-16)}`).join(' ');

  return `<div class="topbar"><h2>Статистика</h2>
    <div class="row">
      <select data-stats-participant><option value="">Все участники</option>${DB.participants.map(p=>`<option value="${p.id}" ${State.statsParticipant===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
      <select data-stats-period>${[['week','Неделя'],['month','Месяц'],['3m','3 месяца'],['6m','6 месяцев'],['year','Год'],['all','Всё время']].map(([id,l])=>`<option value="${id}" ${State.statsPeriod===id?'selected':''}>${l}</option>`).join('')}</select>
    </div></div>

  <div class="grid3" style="margin-bottom:10px">
    <div class="card"><div class="muted">Тренировок</div><div style="font-size:22px;font-weight:700">${list.length}</div></div>
    <div class="card"><div class="muted">Общий тоннаж</div><div style="font-size:22px;font-weight:700">${fmtNum(convW(totalT,units))} ${unitLabel(units)}</div></div>
    <div class="card"><div class="muted">Часы тренировок</div><div style="font-size:22px;font-weight:700">${fmtNum(hours)} ч</div></div>
  </div>

  <div class="card" style="margin-bottom:10px">
    <h3>Тоннаж по дням</h3>
    ${days.length>1? `<svg viewBox="0 0 ${svgW} ${svgH}" style="width:100%;height:110px"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2"/></svg>` : '<div class="muted">Недостаточно данных для графика</div>'}
  </div>

  <div class="card" style="margin-bottom:10px">
    <h3>По группам мышц</h3>
    <table><thead><tr><th>Группа</th><th>Тоннаж</th></tr></thead><tbody>
    ${Object.keys(mgTotals).sort((a,b)=>mgTotals[b]-mgTotals[a]).map(g=>`<tr><td>${MG[g]||g}</td><td>${fmtNum(convW(mgTotals[g],units))} ${unitLabel(units)}</td></tr>`).join('') || '<tr><td colspan="2" class="muted">Нет данных</td></tr>'}
    </tbody></table>
  </div>

  <div class="card">
    <h3>По упражнениям</h3>
    <table><thead><tr><th>Упражнение</th><th>Макс. вес</th><th>Макс. повт.</th><th>Тоннаж</th><th>Раз</th></tr></thead><tbody>
    ${Object.values(exTotals).sort((a,b)=>b.tonnage-a.tonnage).map(e=>`<tr><td>${esc(e.name)}</td><td>${fmtNum(convW(e.maxW,units))}</td><td>${e.maxR}</td><td>${fmtNum(convW(e.tonnage,units))}</td><td>${e.count}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">Нет данных</td></tr>'}
    </tbody></table>
  </div>`;
}

/* ===================== SETTINGS VIEW ===================== */
function viewSettings(){
  const s = DB.settings;
  return `<div class="topbar"><h2>Настройки</h2></div>
  <div class="card" style="margin-bottom:10px">
    <div class="field"><label>Единицы веса</label><select data-setting="units"><option value="kg" ${s.units==='kg'?'selected':''}>Килограммы</option><option value="lb" ${s.units==='lb'?'selected':''}>Фунты</option></select></div>
    <div class="field"><label>Тема</label><select data-setting="theme"><option value="auto" ${s.theme==='auto'?'selected':''}>Системная</option><option value="light" ${s.theme==='light'?'selected':''}>Светлая</option><option value="dark" ${s.theme==='dark'?'selected':''}>Тёмная</option></select></div>
    <div class="field"><label>Таймер отдыха по умолчанию, сек</label><input type="text" inputmode="numeric" data-setting="restDefault" value="${s.restDefault}"></div>
    <div class="field"><label>Цветовая палитра</label>
      <div class="chips-wrap">${PRESET_THEMES.map(t=>`<button class="pill" data-pick-theme="${t.id}" style="border:2px solid ${s.themeColor===t.id?'var(--text)':'var(--border)'};background:${t.accent};color:#fff">${esc(t.name)}</button>`).join('')}</div>
    </div>
  </div>
  <div class="card" style="margin-bottom:10px">
    <h3>Управление упражнениями</h3>
    <table><thead><tr><th>Название</th><th>Группа</th><th>Тип</th><th></th></tr></thead><tbody>
    ${DB.exercises.map(e=>`<tr><td>${esc(e.name)}</td><td>${MG[e.mainGroup]||''}</td><td>${WT[e.type]||e.type}</td><td><button class="btn sm danger" data-delete-exercise="${e.id}">✕</button></td></tr>`).join('')}
    </tbody></table>
  </div>
  <div class="card" style="margin-bottom:10px">
    <h3>Резервное копирование</h3>
    <div class="row">
      <button class="btn" data-export="1">Экспорт (скачать JSON)</button>
      <label class="btn">Импорт JSON<input type="file" id="importFile" accept="application/json" style="display:none"></label>
    </div>
    <p class="muted">Импорт полностью заменит текущие данные.</p>
  </div>
  <div class="card">
    <h3>Таймер отдыха</h3>
    <div class="row"><span id="timerDisplay" style="font-size:22px;font-weight:700">${fmtTime(timerLeft)}</span>
      <button class="btn" data-timer="start">Старт</button>
      <button class="btn" data-timer="pause">Пауза</button>
      <button class="btn" data-timer="reset">Сброс</button>
    </div>
  </div>`;
}
let timerInterval=null, timerRunning=false, timerLeft = 90;
function fmtTime(t){ const m=Math.floor(t/60), s=t%60; return pad(m)+':'+pad(s); }

/* ===================== MAIN VIEW EVENT HANDLERS (delegated) ===================== */
function applyTheme(){
  document.documentElement.setAttribute('data-theme', DB.settings.theme==='auto' ? '' : DB.settings.theme);
  const t = PRESET_THEMES.find(x=>x.id===DB.settings.themeColor) || PRESET_THEMES[0];
  document.documentElement.style.setProperty('--accent', t.accent);
  document.documentElement.style.setProperty('--accent2', t.accent2);
}

function handleMainClick(e, ds){
  if(ds.nav!==undefined){ State.view=ds.nav; State.participantProfile=null; rerender(); return true; }
  if(ds.calNav!==undefined){
    const act = ds.calNav, d = State.calDate;
    if(act==='today') State.calDate = new Date();
    else{
      const dir = act==='prev'?-1:1;
      if(State.calMode==='month') State.calDate = new Date(d.getFullYear(), d.getMonth()+dir, 1);
      else if(State.calMode==='week') State.calDate = new Date(d.getFullYear(), d.getMonth(), d.getDate()+7*dir);
      else State.calDate = new Date(d.getFullYear(), d.getMonth(), d.getDate()+dir);
    }
    renderMain(); return true;
  }
  if(ds.calMode!==undefined){ State.calMode=ds.calMode; renderMain(); return true; }
  if(ds.openWorkout!==undefined){ e.preventDefault(); openWorkoutModal({workoutId:ds.openWorkout}); return true; }
  if(ds.addDay!==undefined){ openWorkoutModal({date:ds.addDay}); return true; }
  if(ds.day!==undefined){ if(State.calMode==='month'){ State.calDate=parseD(ds.day); State.calMode='day'; renderMain(); } return true; }
  if(ds.repeatWorkout!==undefined){
    const orig = DB.workouts.find(w=>w.id===ds.repeatWorkout);
    const copy = JSON.parse(JSON.stringify(orig));
    copy.id = Storage.uid(); copy.date = dstr(new Date()); copy.recurringId=null;
    DB.workouts.push(copy); Storage.save();
    openWorkoutModal({workoutId:copy.id}); return true;
  }
  if(ds.useTemplate!==undefined){ openWorkoutModal({templateId:ds.useTemplate, date:dstr(new Date())}); return true; }
  if(ds.deleteTemplate!==undefined){ DB.templates=DB.templates.filter(t=>t.id!==ds.deleteTemplate); Storage.save(); renderMain(); return true; }
  if(ds.renameTemplate!==undefined){
    const t = DB.templates.find(x=>x.id===ds.renameTemplate);
    const nn = prompt('Новое название шаблона', t.name); if(nn){ t.name=nn; Storage.save(); renderMain(); }
    return true;
  }
  if(ds.addParticipant!==undefined){
    alert('Пока можно добавлять только по приглашению — эта функция появится на следующем шаге вместе с друзьями/тренерами.');
    return true;
  }
  if(ds.openParticipant!==undefined){ State.participantProfile=ds.openParticipant; renderMain(); return true; }
  if(ds.backParticipants!==undefined){ State.participantProfile=null; renderMain(); return true; }
  if(ds.saveParticipant!==undefined){
    const p = DB.participants.find(x=>x.id===ds.saveParticipant);
    p.name = document.getElementById('editPname').value || p.name;
    p.color = document.getElementById('editPcolor').value;
    Storage.save(); renderMain(); return true;
  }
  if(ds.deleteParticipant!==undefined){
    if(!confirm('Удалить участника и всю его историю тренировок?')) return true;
    const pid = ds.deleteParticipant;
    DB.participants = DB.participants.filter(x=>x.id!==pid);
    DB.workouts = DB.workouts.filter(w=>w.participantId!==pid);
    Storage.save(); State.participantProfile=null; renderMain(); return true;
  }
  if(ds.deleteExercise!==undefined){
    if(!confirm('Удалить упражнение?')) return true;
    DB.exercises = DB.exercises.filter(x=>x.id!==ds.deleteExercise);
    Storage.save(); renderMain(); return true;
  }
  if(ds.export!==undefined){ Storage.exportJSON(); return true; }
  if(ds.pickTheme!==undefined){ DB.settings.themeColor = ds.pickTheme; Storage.save(); applyTheme(); renderMain(); return true; }
  if(ds.timer!==undefined){
    const act = ds.timer;
    if(act==='start' && !timerRunning){
      timerRunning=true;
      timerInterval = setInterval(()=>{
        if(timerLeft>0){ timerLeft--; const d=document.getElementById('timerDisplay'); if(d) d.textContent=fmtTime(timerLeft); }
        else { clearInterval(timerInterval); timerRunning=false; }
      },1000);
    } else if(act==='pause'){ clearInterval(timerInterval); timerRunning=false; }
    else if(act==='reset'){ clearInterval(timerInterval); timerRunning=false; timerLeft=DB.settings.restDefault||90; const d=document.getElementById('timerDisplay'); if(d) d.textContent=fmtTime(timerLeft); }
    return true;
  }
  return false;
}

function handleMainChange(e, ds){
  if(ds.hf!==undefined){ State.historyFilters[ds.hf]=e.target.value; renderMain(); return true; }
  if(ds.statsParticipant!==undefined){ State.statsParticipant=e.target.value; renderMain(); return true; }
  if(ds.statsPeriod!==undefined){ State.statsPeriod=e.target.value; renderMain(); return true; }
  if(ds.setting!==undefined){
    const key = ds.setting; const val = e.target.value;
    DB.settings[key] = (key==='restDefault') ? Number(val) : val;
    Storage.save();
    if(key==='theme') applyTheme();
    if(key==='restDefault' && !timerRunning) timerLeft = Number(val)||90;
    preserveFocusAndRerender(renderMain); return true;
  }
  if(e.target.id==='importFile'){
    const file = e.target.files[0]; if(!file) return true;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{ const obj = JSON.parse(reader.result); Storage.importJSON(obj); location.reload(); }
      catch(err){ alert('Не удалось прочитать файл: '+err.message); }
    };
    reader.readAsText(file);
    return true;
  }
  return false;
}

/* ===================== GLOBAL DELEGATED LISTENERS (bound once) ===================== */
function initEvents(){
  document.addEventListener('click', (e)=>{
    const modalEl = e.target.closest('#modalRoot [data-close-overlay],#modalRoot [data-close-modal],#modalRoot [data-add-block],#modalRoot [data-remove-block],#modalRoot [data-add-exercise],#modalRoot [data-remove-exercise],#modalRoot [data-add-set],#modalRoot [data-remove-set],#modalRoot [data-save-workout],#modalRoot [data-save-as-template],#modalRoot [data-delete-workout],#modalRoot [data-pick-exercise],#modalRoot [data-create-exercise],#modalRoot [data-confirm-yes],#modalRoot [data-recur-scope],#modalRoot [data-confirm-template]');
    if(modalEl){ if(handleModalClick({target:e.target, currentTarget:modalEl, preventDefault:()=>e.preventDefault()}, modalEl.dataset)) return; }
    const overlay = e.target.closest('.overlay');
    if(overlay && e.target===overlay){ closeModal(); return; }
    const mainEl = e.target.closest('#main [data-nav],#sidebar [data-nav],#bottomnav [data-nav],[data-cal-nav],[data-cal-mode],[data-open-workout],[data-add-day],[data-day],[data-repeat-workout],[data-use-template],[data-delete-template],[data-rename-template],[data-add-participant],[data-open-participant],[data-back-participants],[data-save-participant],[data-delete-participant],[data-delete-exercise],[data-export],[data-timer],[data-pick-theme]');
    if(mainEl){ handleMainClick(e, mainEl.dataset); }
  });
  function onChangeOrInput(e){
    if(e.target.matches('[data-exsearch]')){
      if(e.type!=='input') return;
      State.modal.query = e.target.value; renderModal();
      const el = document.querySelector('[data-exsearch]'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      return;
    }
    // for free-text/number fields use 'input' for live recalculation; for select/checkbox use 'change'
    const tag = e.target.tagName;
    const isTextish = tag==='INPUT' && ['text','number','date','time'].includes(e.target.type);
    if(isTextish && e.type!=='input') return;
    if(!isTextish && e.type!=='change') return;
    const modalEl = e.target.closest('#modalRoot [data-w],#modalRoot [data-block-rest],#modalRoot [data-dropset],#modalRoot [data-set],#modalRoot [data-recur-on],#modalRoot [data-recur-freq],#modalRoot [data-recur-until],#modalRoot [data-recur-day]');
    if(modalEl){ if(handleModalChange(e, modalEl.dataset)) return; }
    const mainEl = e.target.closest('[data-hf],[data-stats-participant],[data-stats-period],[data-setting],#importFile');
    if(mainEl){ handleMainChange(e, mainEl.dataset); }
  }
  document.addEventListener('change', onChangeOrInput);
  document.addEventListener('input', onChangeOrInput);
}

/* ===================== INIT ===================== */
(async function init(){
  const auth = await Auth.login();
  if(!auth) return; // authOverlay уже показывает причину ошибки, дальше не идём
  try{
    await Storage.load(auth);
  }catch(e){
    document.getElementById('authStatus').textContent = '❌ Не удалось загрузить данные';
    document.getElementById('authLog').style.display='block';
    document.getElementById('authLog').textContent = String(e && e.stack || e);
    return;
  }
  applyTheme();
  initEvents();
  rerender();
  const overlay = document.getElementById('authOverlay');
  if(overlay) overlay.remove();
})();

</script>
