function fitCalTitle(){ const h = document.querySelector('#main .cal-nav h2'); if(!h) return; let fs = 28; h.style.fontSize = fs+'px';
  while(h.scrollWidth > h.clientWidth && fs > 13){ fs--; h.style.fontSize = fs+'px'; } }
function viewCalendar(){
  const d = State.calDate;
  let header='', body='';
  if(State.calMode==='month'){
    const y=d.getFullYear(), m=d.getMonth();
    const first = new Date(y,m,1);
    const startOffset = (first.getDay()+6)%7; // Monday-first
    const gridStart = new Date(y,m,1-startOffset);
    header = calMonthTitle(d);
    let cells='';
    const today=new Date();
    for(let i=0;i<42;i++){
      const cd = new Date(gridStart); cd.setDate(gridStart.getDate()+i);
      const isOther = cd.getMonth()!==m;
      const isToday = sameDay(cd,today);
      const ds = dstr(cd);
      const dayWorkouts = DB.workouts.filter(w=>w.date===ds).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
      const chips = dayWorkouts.slice(0,3).map(w=>{
        const p = DB.participants.find(x=>x.id===w.participantId);
        return `<div class="chip ${w.status==='done'?'':'planned'}" style="background:${colorBg(p&&p.color)}" data-open-workout="${w.id}">${w.time||''} ${esc(w.name||WT[w.type]||'')}</div>`;
      }).join('');
      const more = dayWorkouts.length>3 ? `<div class="muted">+${dayWorkouts.length-3} ещё</div>` : '';
      const act = !dayWorkouts.length && (DB.activity||[]).find(a=>a.date===ds && a.user_id===selfParticipantId() && a.kind!=='none');
      cells += `<div class="cal-cell ${isOther?'other':''} ${isToday?'today':''}" data-day="${ds}">
        <div class="daynum">${cd.getDate()}</div>${chips}${more}${act?`<div class="act-tag" title="Активность из бота">${ACTIVITY_LABELS[act.kind]||'активность'}${act.steps?' '+Math.round(act.steps/1000)+'к шагов':''}</div>`:''}</div>`;
    }
    body = `<div class="cal-grid">${WEEKDAYS.map(w=>`<div class="cal-head">${w}</div>`).join('')}${cells}</div>`;
  } else if(State.calMode==='week'){
    const startOffset = (d.getDay()+6)%7;
    const weekStart = new Date(d); weekStart.setDate(d.getDate()-startOffset);
    header = calWeekTitle(weekStart, new Date(weekStart.getFullYear(),weekStart.getMonth(),weekStart.getDate()+6));
    const today=new Date();
    let cols='';
    for(let i=0;i<7;i++){
      const cd=new Date(weekStart); cd.setDate(weekStart.getDate()+i);
      const ds=dstr(cd);
      const items = DB.workouts.filter(w=>w.date===ds).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
      cols += `<div class="week-col ${sameDay(cd,today)?'today':''}" data-day="${ds}">
        <div class="week-colhead">${WEEKDAYS[i]} ${cd.getDate()}</div>
        ${items.map(w=>{const p=DB.participants.find(x=>x.id===w.participantId);
          return `<div class="agenda-item ${w.status==='done'?'':'planned'}" style="${colorStripe(p&&p.color,3)}" data-open-workout="${w.id}"><span class="t">${w.time||''}</span> ${esc(w.name||WT[w.type]||'')}<br><span class="muted">${p?esc(p.name):''}</span></div>`;}).join('')}
        <button class="btn sm ghost" data-add-day="${ds}">+ добавить</button>
      </div>`;
    }
    body = `<div class="week-cols">${cols}</div>`;
  } else { // day
    const ds = dstr(d);
    header = calDayTitle(d);
    const items = DB.workouts.filter(w=>w.date===ds).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    body = `<div class="day-list card">${items.length? items.map(w=>{
      const p=DB.participants.find(x=>x.id===w.participantId);
      const t=Calc.workoutTonnage(w);
      return `<div class="agenda-item ${w.status==='done'?'':'planned'}" style="${colorStripe(p&&p.color,4)}" data-open-workout="${w.id}">
        <div class="t">${w.time||'--:--'} · ${esc(w.name||WT[w.type]||'')} ${w.duration?('· '+w.duration+' мин'):''}</div>
        <div class="muted">${p?esc(p.name):''} · ${WT[w.type]||''} ${t>0?('· тоннаж '+fmtNum(t)+' кг'):''}</div>
      </div>`;
    }).join('') : '<div class="muted">Нет тренировок в этот день</div>'}
    </div>`;
  }
  return `
  <div class="topbar">
    <div class="row cal-nav">
      <button class="btn" data-cal-nav="prev">←</button>
      <button class="btn" data-cal-nav="today">Сегодня</button>
      <button class="btn" data-cal-nav="next">→</button>
      <h2 class="cal-title" data-no-tr>${header}</h2>
    </div>
    <div class="row">
      ${['month','week','day'].map(mm=>`<button class="btn ${State.calMode===mm?'primary':''}" data-cal-mode="${mm}">${mm==='month'?'Месяц':mm==='week'?'Неделя':'День'}</button>`).join('')}
    </div>
  </div>
  ${guidedCard()}
  <div class="row cal-actions">
    <button class="btn primary" data-add-day="${dstr(State.calMode==='month'?new Date():d)}">+ тренировку</button>
    <button class="btn" data-nav="templates">📋 Шаблоны</button>
    <button class="btn sm ghost cal-log" data-nav="history" title="Журнал тренировок">🕘 Журнал</button>
  </div>
  ${body}`;
}

/* ===================== WORKOUT MODAL ===================== */
function blankSet(){return {weight:'',reps:'',time:'',distance:'',incline:'',note:''};}
function blankExercise(exerciseId){return {exerciseId, isDropset:false, sets:[blankSet()]};}
function blankBlock(kind){return {id:Storage.uid(), kind:kind||'normal', restSeconds:Number(DB.settings.restDefault)||120, exercises:[]};}

// из шаблона: веса/повторы/время/дистанция становятся серыми подсказками (ph), поля пустые — пользователь вводит свой результат
function templatePlaceholders(blocks){
  const F = ['weight','reps','time','distance','incline'];
  const move = o => { const ph = {}; F.forEach(k=>{ if(o[k]!==undefined && o[k]!==null && o[k]!==''){ ph[k] = o[k]; o[k] = ''; } }); if(Object.keys(ph).length) o.ph = ph; return o; };
  return JSON.parse(JSON.stringify(blocks||[])).map(b=>({...b, exercises:(b.exercises||[]).map(ex=>({...ex, sets:(ex.sets||[]).map(st=>{ move(st); (st.drops||[]).forEach(move); return st; })}))}));
}
// подсказка поля: значение из шаблона (серым) или обычная подпись
const phOf = (s, k, def, conv) => s && s.ph && s.ph[k]!==undefined && s.ph[k]!=='' ? esc(String(conv ? conv(s.ph[k]) : s.ph[k])) : def;
function openWorkoutModal(opts){
  // opts: {date} for new, {workoutId} for edit, {templateId,date} to instantiate from template
  let w;
  if(opts.workoutId){
    w = JSON.parse(JSON.stringify(DB.workouts.find(x=>x.id===opts.workoutId)));
  } else if(opts.templateId){
    const t = DB.templates.find(x=>x.id===opts.templateId);
    w = {id:Storage.uid(), date:opts.date||dstr(new Date()), time:'09:00', duration:60, name:t.name,
      participantId:(DB.participants[0]||{}).id, type:'strength', blocks:templatePlaceholders(t.blocks),
      notes:'', result:'', recurringId:null};
  } else {
    w = {id:Storage.uid(), date:opts.date||dstr(new Date()), time:'09:00', duration:60, name:'',
      participantId:(DB.participants[0]||{}).id, type:'strength', blocks:[], notes:'', result:'', recurringId:null};
  }
  State.modal = {kind:'workout', w, isNew: !opts.workoutId, recurRule:{on:false, freq:'weekly', days:[], until:''}};
  renderModal();
}
// «Назад»/закрыть: всегда ровно на один шаг — во вложенном окне (выбор упражнения, справка, шаблон, подтверждение)
// возвращаемся в то окно, из которого его открыли; данные тренировки при этом не теряются
function closeModal(){
  const was = State.modal;
  if(was && was.kind==='workout') autosaveWorkout(true);
  if(was && was.kind==='guided'){ if(was.sub){ was.sub = null; renderModal(); return; } Rest.stop(true); clearInterval(swTimer); was.sw = null; guidedSaveW(was.w); State.modal = null; renderModal(); renderMain(); return; }
  let back = (was && was.back) || null;
  if(was && was.kind==='exercisePicker' && was._back) back = was._back.kind ? was._back : {kind:'workout', ...was._back};
  State.modal = back; renderModal();
  if(was && was.kind==='workout') renderMain();
}
// автосохранение: всё, что записано в окне тренировки, сразу попадает в дневник (и через 0,5 с — на сервер)
function autosaveWorkout(){
  const m = State.modal; if(!m || m.kind!=='workout') return;
  const w = m.w;
  if(m.isNew && m.recurRule && m.recurRule.on) return;            // повторяющуюся создаём только кнопкой «Сохранить»
  const has = (w.blocks||[]).length || w.name || w.notes || w.result || w.bodyWeight;
  const idx = DB.workouts.findIndex(x=>x.id===w.id);
  if(idx<0 && !has) return;
  if(!w.status) w.status = 'planned';
  if(idx<0) DB.workouts.push(w); else DB.workouts[idx] = w;
  Storage.save();
}
function flashEl(sel){ requestAnimationFrame(()=>{ const el = document.querySelector('#modalRoot '+sel); if(!el) return;
  el.classList.add('flash'); const r = el.getBoundingClientRect(); if(r.top<60 || r.bottom>innerHeight-60) el.scrollIntoView({block:'center', behavior:'smooth'});
  setTimeout(()=>el.classList.remove('flash'), 700); }); }
// кардио одной кнопкой: общее упражнение по названию (или своё, если общего ещё нет)
function addCardioBlock(w, name){
  let ex = DB.exercises.find(e=>normName(e.name)===normName(name) && e.type==='cardio') || DB.exercises.find(e=>normName(e.name)===normName(name));
  if(!ex){ ex = {id:Storage.uid(), name, mainGroup:'other', secondaryGroups:[], type:'cardio', ownerId:selfParticipantId()}; DB.exercises.push(ex); }
  const b = blankBlock('normal'); b.exercises.push(blankExercise(ex.id)); w.blocks.push(b);
  if(w.type==='strength' && w.blocks.every(bl=>bl.exercises.every(e=>(DB.exercises.find(x=>x.id===e.exerciseId)||{}).type==='cardio'))) w.type='cardio';
  setTimeout(()=>flashEl(`[data-block="${w.blocks.length-1}"]`), 0);
}

function lastResultFor(exerciseId, participantId, excludeWorkoutId){
  const past = DB.workouts.filter(w=>w.id!==excludeWorkoutId && w.participantId===participantId)
    .sort((a,b)=> (b.date+(b.time||'')).localeCompare(a.date+(a.time||'')));
  for(const w of past){
    for(const b of w.blocks||[]){
      for(const ex of b.exercises||[]){
        if(ex.exerciseId===exerciseId && ex.sets && ex.sets.length){
          return {date:w.date, sets:ex.sets};
        }
      }
    }
  }
  return null;
}
function bestSetFor(exerciseId, participantId, excludeWorkoutId, isCardio){
  let best=null, bestDate=null, bestScore=-1;
  DB.workouts.forEach(w=>{
    if(w.id===excludeWorkoutId || w.participantId!==participantId) return;
    (w.blocks||[]).forEach(b=>(b.exercises||[]).forEach(ex=>{
      if(ex.exerciseId!==exerciseId) return;
      (ex.sets||[]).forEach(s=>{
        const score = isCardio ? (Number(s.distance)||0) : Calc.setTonnage(s, Calc.bwFor(w, ex));
        if(score>bestScore && score>0){ bestScore=score; best=s; bestDate=w.date; }
      });
    }));
  });
  return best ? {set:best, date:bestDate} : null;
}

function setHistory(exerciseId, participantId, excludeId){

  DB.workouts.forEach(o=>{ if(o.id===excludeId || o.participantId!==participantId) return;
    (o.blocks||[]).forEach(b=>(b.exercises||[]).forEach(e=>{ if(e.exerciseId!==exerciseId) return;
      (e.sets||[]).forEach((s,i)=>{ const wt = Number(s.weight)||0, r = Number(s.reps)||0; if(r<1) return;
        const m = byIdx[i] = byIdx[i] || {}; const k = wt.toFixed(2); if(!m[k] || r>m[k].reps) m[k] = {reps:r, date:o.date}; }); })); });
  return byIdx;
}
function setRecordText(hist, si, s, units){
  const m = hist[si]; if(!m) return '';
  const wt = Number(s.weight)||0;
  if(wt>0){ const r = m[wt.toFixed(2)]; return r ? `рекорд ${si+1}-го подхода с ${convW(wt,units)} ${unitLabel(units)}: <b>${r.reps}</b> повт.` : `с ${convW(wt,units)} ${unitLabel(units)} в ${si+1}-м подходе ещё не работали`; }
  const top = Object.entries(m).map(([k,v])=>({wt:+k, reps:v.reps})).sort((a,b)=>b.wt-a.wt || b.reps-a.reps)[0];
  return top && top.wt>0 ? `рекорд ${si+1}-го подхода: <b>${convW(top.wt,units)}×${top.reps}</b>` : '';
}
function cardioPace(s){
  const t = Number(s.time)||0, d = Number(s.distance)||0; if(!(t>0 && d>0)) return '';
  const p = t/d, mm = Math.floor(p), ss = Math.round((p-mm)*60);
  return `темп ${mm}:${String(ss).padStart(2,'0')} /км · ${fmtNum(d/(t/60))} км/ч${Number(s.incline)?` · уклон ${fmtNum(+s.incline)}%`:''}`;
}

    <div data-live="st${bi}.${ei}.${si}">${isCardio ? (cardioPace(s)?`<div class="set-ton">${cardioPace(s)}</div>`:'')

    <div data-live="nb${bi}.${ei}">${needBw?`<div class="muted" style="font-size:11.5px">Упражнение со своим весом: тоннаж = (ваш вес + отягощение) × повторения — укажите вес тела вверху тренировки.</div>`:''}</div>
    <button class="btn sm ghost" data-add-set="${bi}.${ei}">${round?`+ круг (подход во всех упражнениях ${b.kind==='circuit'?'круга':'суперсета'})`:'+ подход'}</button>
    <div data-live="et${bi}.${ei}">${!isCardio && ton>0?`<div class="tonnage-line">${isDrop?'Тоннаж с дропами':'Тоннаж упражнения'}: <b>${fmtNum(convW(ton,units))} ${unitLabel(units)}</b></div>`:''}</div>

/* ===================== EVENT DELEGATION (bound once; survives re-renders) ===================== */
function pathGet(idx){ return idx.split('.').map(Number); }

// «+ Упражнение» без блока — создаём обычный блок в конце тренировки; в суперсете/круговой — добавляем в этот блок
function targetBlock(modal){ const w = modal._back.w; if(modal.pendingBlock==='new'){ w.blocks.push(blankBlock('normal')); modal.pendingBlock = w.blocks.length-1; } return modal.pendingBlock; }
function handleModalClick(e, ds){
  const modal = State.modal; if(!modal) return false;
  if(ds.closeOverlay!==undefined){ if(e.target===e.currentTarget||e.target.hasAttribute('data-close-overlay')) closeModal(); return true; }
  if(ds.closeModal!==undefined){ closeModal(); return true; }
  if(ds.help!==undefined){ openHelp(ds.help, modal); return true; }
  if(ds.zoom!==undefined){ openZoom(ds.zoom); return true; }
  if(ds.achInfo!==undefined){ const [t,,st]=ds.achInfo.split('|'); const a = [...(modal.achs||[]), ...(State.achAll||[])].find(x=>x.title===t) || {title:t};
    State.modal = {kind:'achInfo', a, status:st, back:modal}; renderModal(); return true; }

  if(modal.kind==='workout'){
    const w = modal.w;
    if(ds.addBlock!==undefined){ w.blocks.push(blankBlock(ds.addBlock)); renderModal(); return true; }
    if(ds.removeBlock!==undefined){ w.blocks.splice(+ds.removeBlock,1); renderModal(); return true; }
    if(ds.addExercise!==undefined){ modal.pendingBlock = ds.addExercise==='new' ? 'new' : +ds.addExercise; modal.kind='exercisePicker'; modal.query=''; modal._back={w,isNew:modal.isNew,recurRule:modal.recurRule}; renderModal(); return true; }
    if(ds.removeExercise!==undefined){ const [bi,ei]=pathGet(ds.removeExercise); w.blocks[bi].exercises.splice(ei,1); renderModal(); return true; }
    if(ds.addSet!==undefined){
      const [bi,ei]=pathGet(ds.addSet); const blk=w.blocks[bi];
      // суперсет: новый круг — по подходу в каждое упражнение пары; вес подставляем из прошлого круга
      const targets = isRoundBlock(blk) ? blk.exercises : [blk.exercises[ei]];
      const len = isRoundBlock(blk) ? Math.max(...targets.map(x=>x.sets.length)) : null;
      targets.forEach(ex=>{ if(len!==null && ex.sets.length>len) return; const ns=blankSet(); const last=ex.sets[ex.sets.length-1];
        if(last && Number(last.weight)>0) ns.weight = last.weight;
        if(ex.isDropset) ns.drops = [{weight:'',reps:''},{weight:'',reps:''},{weight:'',reps:''}];
        ex.sets.push(ns); });
      renderModal(); return true;
    }
    if(ds.moveBlock!==undefined){ const [bi,dir]=pathGet(ds.moveBlock); const to=bi+dir; if(to<0||to>=w.blocks.length) return true;
      [w.blocks[bi], w.blocks[to]] = [w.blocks[to], w.blocks[bi]]; renderModal(); flashEl(`[data-block="${to}"]`); return true; }
    if(ds.moveEx!==undefined){ const [bi,ei,dir]=pathGet(ds.moveEx); const list=w.blocks[bi].exercises; const ex=list[ei];
      let nb=bi, ne=ei+dir;
      if(ne<0 || ne>=list.length){ nb = bi+dir; if(nb<0||nb>=w.blocks.length) return true; list.splice(ei,1);
        const dst = w.blocks[nb].exercises; if(dir<0){ dst.push(ex); ne = dst.length-1; } else { dst.unshift(ex); ne = 0; } }
      else { [list[ei], list[ne]] = [list[ne], list[ei]]; }
      renderModal(); flashEl(`[data-ex="${nb}.${ne}"]`); return true; }
    if(ds.addCardio!==undefined){ addCardioBlock(w, ds.addCardio); renderModal(); return true; }
    if(ds.removeSet!==undefined){ const [bi,ei,si]=pathGet(ds.removeSet); const blk=w.blocks[bi];
      (isRoundBlock(blk) ? blk.exercises : [blk.exercises[ei]]).forEach(ex=>{ if(ex.sets.length>si) ex.sets.splice(si,1); });
      renderModal(); return true; }
    if(ds.setDrop!==undefined){ const [bi,ei,si]=pathGet(ds.setDrop); const st=w.blocks[bi].exercises[ei].sets[si];
      st.isDrop = !st.isDrop; if(st.isDrop && !st.drops) st.drops = [{weight:'',reps:''},{weight:'',reps:''},{weight:'',reps:''}];
      renderModal(); flashEl(`[data-ex="${bi}.${ei}"]`); return true; }
    if(ds.saveWorkout!==undefined){ saveWorkoutFromModal(); return true; }
    if(ds.closeEditor!==undefined){ closeWorkoutEditor(); return true; }
    if(ds.finishWorkout!==undefined){ finishWorkout(); return true; }
    if(ds.saveAsTemplate!==undefined){ autosaveWorkout(); State.modal={kind:'saveTemplate', suggestedName:w.name, sourceBlocks:w.blocks, back:modal}; renderModal(); return true; }
    if(ds.deleteWorkout!==undefined){
      State.modal={kind:'confirmDelete', title:'Удалить тренировку?', text:'Это действие нельзя отменить.', back:modal, onYes:()=>{
        if(w.recurringId){ State.modal={kind:'recurEdit', mode:'delete', w}; renderModal(); return; }
        DB.workouts = DB.workouts.filter(x=>x.id!==w.id); Storage.save(); State.modal = null; renderModal(); rerender();
      }};
      renderModal(); return true;
    }
  } else if(modal.kind==='exercisePicker'){
    if(ds.pickExercise!==undefined){
      const back=modal._back; const bi = targetBlock(modal);
      const nex=blankExercise(ds.pickExercise); nex.isDropset = back.w.blocks[bi].kind==='dropset';
      if(nex.isDropset) nex.sets.forEach(st=>st.drops=[{weight:'',reps:''},{weight:'',reps:''},{weight:'',reps:''}]);
      back.w.blocks[bi].exercises.push(nex);
      State.modal = {kind:'workout', w:back.w, isNew:back.isNew, recurRule:back.recurRule};
      renderModal(); return true;
    }
    if(ds.createExercise!==undefined){
      const name = (modal.query||'').trim(); if(!name) return true;
      const ex = {id:Storage.uid(), name, mainGroup:'other', secondaryGroups:[], type:'strength', ownerId:selfParticipantId()};
      DB.exercises.push(ex); Storage.save();
      const back=modal._back; const bi = targetBlock(modal);
      const nex=blankExercise(ex.id); nex.isDropset = back.w.blocks[bi].kind==='dropset';
      if(nex.isDropset) nex.sets.forEach(st=>st.drops=[{weight:'',reps:''},{weight:'',reps:''},{weight:'',reps:''}]);
      back.w.blocks[bi].exercises.push(nex);
      State.modal = {kind:'workout', w:back.w, isNew:back.isNew, recurRule:back.recurRule};
      renderModal(); return true;
    }
  } else if(modal.kind==='cert'){
    if(ds.sendCert!==undefined){ sendCert(); return true; }
  } else if(modal.kind==='importTemplates'){
    if(ds.importExample!==undefined){ modal.text = IMPORT_EXAMPLE; modal.error=''; renderModal(); return true; }
    if(ds.importRun!==undefined){
      modal.text = document.getElementById('importText').value;
      const exBefore = DB.exercises.length;
      try{
        const list = parseTemplatesText(modal.text);
        if(!list.length) throw new Error('не найдено ни одного шаблона');
        list.forEach(t=>DB.templates.push({id:Storage.uid(), ownerId:selfParticipantId(), isPublic:false, name:t.name, blocks:t.blocks}));
        Storage.save(); closeModal(); renderMain();
        toast(`Импортировано шаблонов: ${list.length}`+(DB.exercises.length>exBefore?`, новых упражнений: ${DB.exercises.length-exBefore}`:''));
      }catch(e){ DB.exercises.length = exBefore; modal.error = e.message; renderModal(); }
      return true;
    }
  } else if(modal.kind==='confirmDelete'){
    if(ds.confirmYes!==undefined){ modal.onYes(); return true; }
  } else if(modal.kind==='recurEdit'){
    if(ds.recurScope!==undefined){ handleRecurScope(ds.recurScope); return true; }
  } else if(modal.kind==='saveTemplate'){
    if(ds.confirmTemplate!==undefined){
      const name = document.getElementById('tplName').value.trim() || 'Без названия';
      DB.templates.push({id:Storage.uid(), ownerId:selfParticipantId(), name, blocks: JSON.parse(JSON.stringify(modal.sourceBlocks))});
      Storage.save(); closeModal(); toast('Шаблон сохранён'); if(State.view==='templates') rerender();
      return true;
    }
  }
  return false;
}

// при вводе подхода не перерисовываем всё окно (на iPhone это дёргает клавиатуру) — обновляем только цифры
let liveRaf = 0;
function liveUpdateModal(){
  cancelAnimationFrame(liveRaf);
  autosaveWorkout();
  liveRaf = requestAnimationFrame(()=>{ if(!State.modal || State.modal.kind!=='workout') return;
    const tmp = document.createElement('div'); tmp.innerHTML = renderWorkoutModal();
    tmp.querySelectorAll('[data-live]').forEach(n=>{ const cur = document.querySelector(`#modalRoot [data-live="${n.dataset.live}"]`);
      if(cur && cur.innerHTML !== n.innerHTML) cur.innerHTML = n.innerHTML; }); });
}
function preserveFocusAndRerender(renderFn){
  const ae = document.activeElement;
  let attr=null, val=null, start=null, end=null;
  if(ae && (ae.tagName==='INPUT'||ae.tagName==='TEXTAREA')){
    for(const a of ['data-set','data-w','data-block-rest','data-setting']){
      if(ae.hasAttribute(a)){ attr=a; val=ae.getAttribute(a); break; }
    }
    start = ae.selectionStart; end = ae.selectionEnd;
  }
  renderFn();
  if(attr){
    const again = document.querySelector('['+attr+'="'+CSS.escape(val)+'"]');
    if(again){ again.focus(); if(start!=null && again.setSelectionRange){ try{ again.setSelectionRange(start,end); }catch(err){} } }
  }
}
function handleModalChange(e, ds){
  const modal = State.modal; if(!modal) return false;
  if(modal.kind==='workout'){
    const w = modal.w;
    if(ds.w==='shared'){ w.shared = e.target.checked; autosaveWorkout(); return true; }
    if(ds.w!==undefined){ w[ds.w] = ds.w==='bodyWeight' ? (e.target.value.trim()==='' ? '' : numIn(e.target.value)) : e.target.value;
      if(ds.w==='participantId') renderModal(); else { autosaveWorkout(); if(ds.w==='bodyWeight') liveUpdateModal(); } return true; }
    if(ds.blockRest!==undefined){ w.blocks[+ds.blockRest].restSeconds = numIn(e.target.value); autosaveWorkout(); return true; }
    // тип блока: обычный / суперсет / круговая; в блоке «кругами» число подходов у упражнений выравнивается
    if(ds.blockKind!==undefined){ const b = w.blocks[+ds.blockKind]; b.kind = e.target.value;
      if(isRoundBlock(b) && b.exercises.length){ const n = Math.max(...b.exercises.map(x=>x.sets.length)); b.exercises.forEach(x=>{ while(x.sets.length<n) x.sets.push(blankSet()); }); }
      autosaveWorkout(); renderModal(); return true; }
    if(ds.dropset!==undefined){ const [bi,ei]=pathGet(ds.dropset); const ex = w.blocks[bi].exercises[ei]; ex.isDropset = e.target.checked;
      if(ex.isDropset) ex.sets.forEach(s=>{ s.drops = s.drops || [{weight:'',reps:''},{weight:'',reps:''},{weight:'',reps:''}]; });
      renderModal(); return true; }
    if(ds.set!==undefined){
      const parts = ds.set.split('.'); const bi=+parts[0],ei=+parts[1],si=+parts[2];
      const set = w.blocks[bi].exercises[ei].sets[si];
      let target = set, field = parts[3];
      if(field==='drop'){ set.drops = set.drops || [{},{},{}]; target = set.drops[+parts[4]] = set.drops[+parts[4]] || {}; field = parts[5]; }
      const val = e.target.value.trim();
      // «70,» или «70.» — ещё набирают дробную часть: храним как есть в поле ввода, в данных — число
      if(field==='weight') target.weight = val==='' ? '' : toKg(val, DB.settings.units);
      else if(['reps','time','distance','incline'].includes(field)) target[field] = val==='' ? '' : numIn(val);
      else target[field] = e.target.value;
      liveUpdateModal(); return true;
    }
    if(ds.recurOn!==undefined){ modal.recurRule.on = e.target.checked; renderModal(); return true; }
    if(ds.recurFreq!==undefined){ modal.recurRule.freq = e.target.value; renderModal(); return true; }
    if(ds.recurUntil!==undefined){ modal.recurRule.until = e.target.value; return true; }
    if(ds.recurDay!==undefined){
      const i = +ds.recurDay; const days = modal.recurRule.days; const p = days.indexOf(i);
      if(e.target.checked && p===-1) days.push(i);
      if(!e.target.checked && p!==-1) days.splice(p,1);
      return true;
    }
  }
  return false;
}

// записали повторения подхода (поле покинули) — сам запускается отдых блока; в суперсете/круговой — после последнего упражнения круга
function restAfterSet(el){
  const m = State.modal, parts = el.dataset.set.split('.');
  if(!m || m.kind!=='workout' || parts[3]!=='reps' || el.value.trim()==='' || DB.settings.autoRest===false) return;

}
function handleRecurScope(scope){
  const w = State.modal.w;

}

// ===== LIGHT WEIGHT: новый личный рекорд веса в упражнении =====
// постеры лежат в img/lightweight/01.jpg … NN.jpg — чтобы добавить персонажа, положите следующий номер и увеличьте LW_COUNT
const LW_COUNT = 15;
const lwShown = new Set();   // уже показанные рекорды в этой сессии (id тренировки + упражнение + вес)
// рекорды тренировки: максимальный вес (≥1 повтор) больше, чем во всех прошлых тренировках этого участника
function findRecords(w){
  const out = [];
  (w.blocks||[]).forEach(b=>(b.exercises||[]).forEach(ex=>{
    let best = null;
    (ex.sets||[]).forEach(st=>{ const wt = Number(st.weight)||0, r = Number(st.reps)||0; if(wt>0 && r>=1 && (!best || wt>best.weight || (wt===best.weight && r>best.reps))) best = {weight:wt, reps:r}; });
    if(!best) return;
    let prev = 0;
    DB.workouts.forEach(o=>{ if(o.id===w.id || o.participantId!==w.participantId) return;
      (o.blocks||[]).forEach(ob=>(ob.exercises||[]).forEach(oe=>{ if(oe.exerciseId!==ex.exerciseId) return;
        (oe.sets||[]).forEach(st=>{ if(Number(st.reps)>=1) prev = Math.max(prev, Number(st.weight)||0); }); })); });
    const info = DB.exercises.find(e=>e.id===ex.exerciseId);
    if(prev>0 && best.weight>prev && !out.some(x=>x.exerciseId===ex.exerciseId)) out.push({exerciseId:ex.exerciseId, name:info?info.name:'упражнение', weight:best.weight, reps:best.reps, prev});
  }));
  return out;
}
function showLightWeight(w){
  const recs = findRecords(w).filter(r=>!lwShown.has(w.id+r.exerciseId+r.weight));
  if(!recs.length) return;
  recs.forEach(r=>lwShown.add(w.id+r.exerciseId+r.weight));
  const n = 1 + Math.floor(Math.random()*LW_COUNT), units = DB.settings.units;
  const box = document.createElement('div'); box.className = 'lw-box';
  box.innerHTML = `<div class="lw-frame"><img src="img/lightweight/${String(n).padStart(2,'0')}.jpg" alt="Light weight"></div>
    <div class="lw-text">${recs.map(r=>`Впервые достигнут вес <b>${convW(r.weight,units)} ${unitLabel(units)}</b> в упражнении <b>${esc(r.name)}</b>, количество повторений <b>${r.reps}</b>`).join('<br>')}</div>
    <button class="btn primary lw-ok">Light weight, baby! 💪</button>`;
  box.onclick = e=>{ if(e.target===box || e.target.classList.contains('lw-ok')) box.remove(); };
  document.body.appendChild(box);
}
// ачивки, полученные именно этой тренировкой: сравниваем «до» и «после» её учёта
function workoutAchievements(w){
  const pid = w.participantId, today = dstr(new Date());
  const isDone = o => o.status==='done' || (o.date<=today && hasFilledSets(o));
  const others = DB.workouts.filter(o=>o.participantId===pid && o.id!==w.id && isDone(o));
  State.achFor = pid;
  const before = achievementsList(others), after = achievementsList([...others, w]);
  const bMap = new Map(before.map(x=>[x.cat+'|'+x.title, x])), prevOf = a => bMap.get(a.cat+'|'+a.title) || {};
  const fresh = after.filter(a=>{ const b = prevOf(a); return a.got && (!b.got || (a.cat==='beast' && a.count>(b.count||0))); })
    .map(a=>a.cat==='beast' ? {...a, count:a.count-(prevOf(a).count||0)} : a);
  return compressBw(fresh);   // из лестницы «Свой вес» — только верхняя новая ступень
}

function showWorkoutResult(w){

function hasFilledSets(w){ return (w.blocks||[]).some(b=>(b.exercises||[]).some(ex=>(ex.sets||[]).some(s=>Number(s.reps)>0||Number(s.time)>0||Number(s.distance)>0))); }
// «Завершить»: отмечаем выполненной, сохраняем на сервер и просим бота прислать итог (участнику и его тренерам)
async function finishWorkout(){
  const w = State.modal.w;
  if(!hasFilledSets(w)){ toast('Заполните хотя бы один подход'); return; }
  if(!w.name) w.name = WT[w.type] || 'Тренировка';
  // время окончания и длительность — по нажатию «Завершить» (если тренировка была начата кнопкой ▶)
  if(w.startedAt && !w.finishedAt){ w.finishedAt = new Date().toISOString(); w.duration = Math.max(1, Math.round((Date.parse(w.finishedAt)-Date.parse(w.startedAt))/60000)); }
  w.status = 'done';
  const idx = DB.workouts.findIndex(x=>x.id===w.id); if(idx<0) DB.workouts.push(w); else DB.workouts[idx]=w;
  rerender();
  const achs = showWorkoutResult(w);
  await notifyBotDone(w, achs);
}
// итог тренировки в бот: сначала сохраняем на сервер, затем шлём со свежим токеном; при неудаче — повтор
function setBotStatus(text, err){ State.botStatus = {text, err}; const el = document.getElementById('botStatus'); if(el){ el.textContent = text; el.style.color = err ? 'var(--danger)' : ''; } }
async function notifyBotDone(w, achs){
  setBotStatus('⏳ Отправляем итог в бот…');
  const lw = (achs||[]).filter(a=>['lw','hero','wr'].includes(a.cat)).slice(0,5).map(a=>({title:I18N.t(a.title), desc:I18N.t(a.desc||''),
    img: a.cat==='wr' ? `img/lightweight/${a.wr.poster}.jpg` : a.hero ? `img/lightweight/${HERO_POSTER[a.hero]||'01'}.jpg` : `img/lightweight/${String(a.poster||1).padStart(2,'0')}.jpg`}));
  const body = JSON.stringify({action:'workout_done', workout_id:w.id, lw, achievements:(achs||[]).filter(a=>!['lw','hero','wr'].includes(a.cat)).slice(0,30).map(a=>`${a.icon||'🏅'} ${I18N.t(a.title)}${a.cat==='beast'&&a.count>1?' ×'+a.count:''}`)});
  for(let attempt=1; attempt<=3; attempt++){
    try{
      await Storage.flush();
      if(Storage.lastSyncError) throw Storage.lastSyncError;
      const r = await fetch(SUPABASE_URL + '/functions/v1/telegram-bot', { method:'POST',
        headers:{'Content-Type':'application/json', apikey:SUPABASE_ANON_KEY, Authorization:'Bearer '+(await Auth.freshToken())}, body });
      if(r.ok){ setBotStatus('✅ Итог отправлен в Telegram-бот'); toast('💪 Тренировка завершена — итог отправлен в бот'); return true; }
      const j = await r.json().catch(()=>({}));
      if(attempt===3){ setBotStatus('⚠️ Бот не принял итог: '+(j.error||r.status), true); toast('Тренировка сохранена, но бот ответил ошибкой: '+(j.error||r.status)); return false; }
    }catch(e){ if(attempt===3){ setBotStatus('⚠️ Не удалось отправить итог: '+(e.message||e), true); toast('Тренировка сохранена, но бот недоступен: '+(e.message||e)); return false; } }
    await new Promise(res=>setTimeout(res, 1500*attempt));
  }
}
// «Закрыть» / ✕: всё уже сохранено автоматически; пустая новая тренировка не сохраняется, повторяющаяся создаётся как при «Сохранить»
function closeWorkoutEditor(){
  const m = State.modal, w = m.w, has = (w.blocks||[]).some(b=>(b.exercises||[]).length) || w.notes || w.result;
  if(m.isNew && m.recurRule && m.recurRule.on) return saveWorkoutFromModal();
  if(m.isNew && !has){ DB.workouts = DB.workouts.filter(x=>x.id!==w.id); Storage.save(); State.modal = null; renderModal(); rerender(); return; }
  if(w.status!=='done' && w.date<=dstr(new Date()) && hasFilledSets(w) && !(w.startedAt && !w.finishedAt)) w.status = 'done';
  if(!w.name) w.name = WT[w.type] || 'Тренировка';
  closeModal(); rerender();
}
function saveWorkoutFromModal(){
  const w = State.modal.w, isNew = State.modal.isNew, recur = State.modal.recurRule;
  const wasDone = !isNew && (DB.workouts.find(x=>x.id===w.id)||{}).status==='done';
  // прошедшая тренировка с заполненными подходами считается выполненной (для вечернего вопроса бота)
  if(w.status!=='done' && w.date<=dstr(new Date()) && hasFilledSets(w) && !(w.startedAt && !w.finishedAt)) w.status='done';
  if(isNew && w.status!=='done') w.status='planned';
  // итог в бот отправляется только кнопкой «Завершить тренировку», при «Сохранить» — нет
  if(!w.name) w.name = WT[w.type] || 'Тренировка';
  if(isNew){
    DB.workouts = DB.workouts.filter(x=>x.id!==w.id);    // могла уже попасть в дневник автосохранением
    if(recur && recur.on){
      const groupId = Storage.uid();
      const start = parseD(w.date);
      const until = recur.until? parseD(recur.until) : new Date(start.getFullYear(), start.getMonth()+2, start.getDate());
      let cur = new Date(start);
      let count=0;
      while(cur<=until && count<400){
        const wd = (cur.getDay()+6)%7;
        const match = recur.freq==='daily' ? true : recur.days.includes(wd);
        if(match){
          const copy = JSON.parse(JSON.stringify(w));
          copy.id = Storage.uid(); copy.date = dstr(cur); copy.recurringId = groupId;
          DB.workouts.push(copy); count++;
        }
        cur = new Date(cur.getFullYear(),cur.getMonth(),cur.getDate()+1);
      }
    } else {
      DB.workouts.push(w);
    }
    Storage.save(); closeModal(); rerender();
  } else {
    if(w.recurringId){
      State.modal = {kind:'recurEdit', mode:'save', w};
      renderModal();
    } else {
      const idx = DB.workouts.findIndex(x=>x.id===w.id); if(idx<0) DB.workouts.push(w); else DB.workouts[idx]=w;
      Storage.save(); closeModal(); rerender();
    }
  }
}

const IMPORT_EXAMPLE = `# Грудь + трицепс
Жим лёжа: 60x10, 80x8, 80x8
Суперсет (отдых 60):
- Жим гантелей лёжа: 20x12, 20x10
- Разведение гантелей: 10x12, 10x12
Дроп-сет: Жим лёжа: 100x8, 80x8, 60x10
Французский жим: 3 по 10-12
Отжимания: 15, 12, 10

# Кардио
Бег: 30 мин, 5 км`;
function normName(n){ return String(n||'').toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ').trim(); }
function findOrCreateExercise(name, isCardio){
  const n = normName(name);
  let ex = DB.exercises.find(e=>normName(e.name)===n);
  if(!ex){ ex = {id:Storage.uid(), name:name.trim(), mainGroup:'other', secondaryGroups:[], type:isCardio?'cardio':'strength', ownerId:selfParticipantId()}; DB.exercises.push(ex); }
  return ex.id;
}
// "80x8, 80x8" | "3 по 10-12" | "3 по 8 @ 60" | "15, 12" (свой вес) | "30 мин, 5 км"
function parseSets(spec){
  spec = spec.trim(); const sets = [];
  const cardio = /мин|км/i.test(spec);
  if(cardio){
    const t = spec.match(/([\d.,]+)\s*мин/i), d = spec.match(/([\d.,]+)\s*км/i);
    sets.push({...blankSet(), time: t?Number(t[1].replace(',','.')):'', distance: d?Number(d[1].replace(',','.')):''});
    return {sets, cardio:true};
  }
  const m = spec.match(/^(\d+)\s*(?:по|x|х|×|\*)\s*(\d+)(?:\s*[-–]\s*(\d+))?(?:\s*@\s*([\d.,]+))?$/i);
  if(m && /по|@/i.test(spec) || (m && m[3])){
    for(let i=0;i<+m[1];i++) sets.push({...blankSet(), reps:+m[2], weight: m[4]?Number(m[4].replace(',','.')):'', note: m[3]?`${m[2]}–${m[3]} повт.`:''});
    return {sets, cardio:false};
  }
  spec.split(/[,;]/).map(x=>x.trim()).filter(Boolean).forEach(part=>{
    const wr = part.match(/^([\d.,]+)\s*(?:кг)?\s*[xх×*]\s*(\d+)$/i);
    if(wr) sets.push({...blankSet(), weight:Number(wr[1].replace(',','.')), reps:+wr[2]});
    else if(/^\d+$/.test(part)) sets.push({...blankSet(), reps:+part});
    else throw new Error('не понял подход «'+part+'»');
  });
  return {sets, cardio:false};
}
function parseTemplatesText(text){
  text = text.trim();
  if(text.startsWith('[') || text.startsWith('{')){
    // JSON: [{name, blocks:[{kind, restSeconds, exercises:[{name, isDropset, sets:[{weight,reps,time,distance,note}]}]}]}]
    const arr = [].concat(JSON.parse(text));
    return arr.map(t=>({name:t.name||'Без названия', blocks:(t.blocks||[]).map(b=>({id:Storage.uid(), kind:b.kind||'normal', restSeconds:+b.restSeconds||60,
      exercises:(b.exercises||[]).map(e=>({exerciseId:findOrCreateExercise(e.name, (e.sets||[]).some(s=>s.distance||s.time)), isDropset:!!e.isDropset,
        sets:(e.sets||[{}]).map(s=>({...blankSet(), ...s}))}))}))}));
  }
  const out = []; let cur = null, superset = null;
  text.split(/\r?\n/).forEach((raw, i)=>{
    const line = raw.trim(); if(!line) { superset=null; return; }
    const err = msg => { throw new Error(`строка ${i+1}: ${msg}`); };
    if(line.startsWith('#')){ cur = {name:line.replace(/^#+/,'').trim()||'Без названия', blocks:[]}; out.push(cur); superset=null; return; }
    if(!cur){ cur = {name:'Импортированный шаблон', blocks:[]}; out.push(cur); }
    const ss = line.match(/^суперсет\s*(?:\(\s*отдых\s*(\d+)\s*\))?\s*:?\s*$/i);
    if(ss){ superset = {id:Storage.uid(), kind:'superset', restSeconds:+ss[1]||60, exercises:[]}; cur.blocks.push(superset); return; }
    let body = line, inSuperset = false, drop = false;
    if(/^[-–•]/.test(body)){ if(!superset) err('упражнение с «-» должно идти после строки «Суперсет:»'); inSuperset = true; body = body.replace(/^[-–•]\s*/,''); }
    else superset = null;
    const dm = body.match(/^дроп-?сет\s*:\s*(.+)$/i); if(dm){ drop = true; body = dm[1]; }
    const idx = body.lastIndexOf(':'); if(idx<0) err('нет двоеточия между упражнением и подходами');
    const name = body.slice(0,idx).trim(); if(!name) err('не указано упражнение');
    let parsed; try{ parsed = parseSets(body.slice(idx+1)); }catch(e){ err(e.message); }
    const ex = {exerciseId:findOrCreateExercise(name, parsed.cardio), isDropset:drop, sets:parsed.sets};
    if(inSuperset) superset.exercises.push(ex);
    else cur.blocks.push({id:Storage.uid(), kind:drop?'dropset':'normal', restSeconds:DB.settings.restDefault||120, exercises:[ex]});
  });
  return out;
}

  if(!list.length) return `<div class="card muted" style="margin-bottom:10px">💪 Тренировки: друг пока не поделился ни одной.</div>`;
  const addEx = f.exercises.filter(e=>!DB.exercises.some(x=>x.id===e.id)); DB.exercises.push(...addEx);

        return `<div style="margin:4px 0"><span class="row" style="flex-wrap:nowrap;gap:6px">${exThumb(info,26)}<span>${esc(info?info.name:'Упражнение')}${b.kind==='superset'?' <span class="pill">суперсет</span>':b.kind==='circuit'?' <span class="pill">круговая</span>':''}</span></span><div class="muted" style="font-size:12.5px">${sets||'—'}</div></div>`; }).join('')).join('')}

  const addEx = f.exercises.filter(e=>!DB.exercises.some(x=>x.id===e.id));

  finally { DB.exercises = DB.exercises.filter(e=>!addEx.includes(e)); DB.weights = DB.weights.filter(w=>!addW.includes(w)); }

function weekKeyOf(ds){ const d=parseD(ds); const day=(d.getDay()+6)%7; const monday=new Date(d.getFullYear(),d.getMonth(),d.getDate()-day); return dstr(monday); }
function monthKeyOf(ds){ return ds.slice(0,7); }
function groupSumBy(workouts, keyFn){ const m={}; workouts.forEach(w=>{ const k=keyFn(w.date); m[k]=(m[k]||0)+Calc.workoutTonnage(w); }); return m; }
function avgOfValues(obj){ const vals=Object.values(obj); return vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : 0; }

// активность: шаги (вводятся здесь или в боте в дни без тренировок) и тоннаж — две линии на одном графике
function activityCard(pid, list, period){
  const me = pid===selfParticipantId(), today = new Date(), td = dstr(today);
  const span = {week:7, month:30, '3m':91, '6m':182, year:365}[period] || 90;
  const weekly = span > 62;                         // длинный период — по неделям
  const keys = []; const start = new Date(today.getFullYear(), today.getMonth(), today.getDate()-span+1);
  for(let d=new Date(start); d<=today; d.setDate(d.getDate()+1)){ const k = weekly ? weekKeyOf(dstr(d)) : dstr(d); if(!keys.includes(k)) keys.push(k); }
  const ton = {}, st = {};
  list.forEach(w=>{ const k = weekly ? weekKeyOf(w.date) : w.date; ton[k] = (ton[k]||0) + Calc.workoutTonnage(w); });
  (DB.activity||[]).filter(a=>a.user_id===pid && Number(a.steps)>0).forEach(a=>{ const k = weekly ? weekKeyOf(a.date) : a.date; st[k] = (st[k]||0) + Number(a.steps); });
  const tv = keys.map(k=>ton[k]||0), sv = keys.map(k=>st[k]||0), tm = Math.max(1,...tv), sm = Math.max(1,...sv);
  const W = 340, H = 130, x = i => 8 + i*(W-16)/Math.max(1,keys.length-1), y = (v,m) => H-14-(v/m)*(H-28);
  const line = (vals, m, col) => vals.some(v=>v>0) ? `<polyline points="${vals.map((v,i)=>x(i).toFixed(1)+','+y(v,m).toFixed(1)).join(' ')}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>` : '';
  const stepDays = sv.filter(v=>v>0), avg = stepDays.length ? Math.round(stepDays.reduce((a,b)=>a+b,0)/stepDays.length) : 0;
  const todayAct = (DB.activity||[]).find(a=>a.user_id===pid && a.date===td);
  const trainedToday = DB.workouts.some(w=>w.participantId===pid && w.date===td && (w.status==='done' || hasFilledSets(w)));
  return `<div class="card" style="margin-bottom:10px"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Активность</h3>
      <span class="muted"><span>${weekly?'по неделям':'по дням'}</span></span></div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;margin-top:6px">
      <line x1="8" x2="${W-8}" y1="${H-14}" y2="${H-14}" stroke="var(--border)"/>${line(sv, sm, 'var(--lw-orange,#f08a24)')}${line(tv, tm, 'var(--accent)')}</svg>
    <div class="row act-legend"><span><i style="background:var(--accent)"></i>Тоннаж</span><span><i style="background:var(--lw-orange,#f08a24)"></i>Шаги</span>${avg?`<span class="muted" style="margin-left:auto"><span>в среднем</span> <b data-no-tr>${fmtNum(avg)}</b> <span>шагов в день</span></span>`:''}</div>
    ${me ? `<div class="steps-in ${trainedToday?'':'steps-ask'}">${trainedToday?'':`<div style="font-weight:700;margin-bottom:6px">Сегодня без тренировки — сколько шагов вы прошли?</div>`}
      <div class="row" style="gap:6px;flex-wrap:nowrap"><select id="stepsDay" style="flex:none">${[0,1,2].map(i=>{ const d = dstr(new Date(today.getFullYear(),today.getMonth(),today.getDate()-i)); return `<option value="${d}">${i===0?'Сегодня':i===1?'Вчера':fmtDateShort(d)}</option>`; }).join('')}</select>
        <input id="stepsIn" type="text" inputmode="numeric" placeholder="${todayAct&&todayAct.steps?todayAct.steps:'например 8000'}" style="flex:1;min-width:0">
        <button class="btn primary" data-steps-save="1">Записать</button></div></div>` : ''}
  </div>`;
}
async function saveSteps(){
  const n = parseInt(String((document.getElementById('stepsIn')||{}).value||'').replace(/\D/g,''), 10), date = (document.getElementById('stepsDay')||{}).value || dstr(new Date());
  if(!(n>=0 && n<=200000)) return toast('Введите количество шагов числом, например 8000');
  const me = selfParticipantId(), cur = (DB.activity||[]).find(a=>a.user_id===me && a.date===date);
  const row = {user_id:me, date, kind: cur && cur.kind && cur.kind!=='none' ? cur.kind : 'steps', steps:n};
  const {error} = await Auth.getClient().from('daily_activity').upsert(row, {onConflict:'user_id,date'});

function viewStats(){
  const units = DB.settings.units;
  let list = DB.workouts.slice();
  if(State.statsParticipant) list = list.filter(w=>w.participantId===State.statsParticipant);
  const now = new Date(); let from=new Date(0);
  const periodMap = {week:7,month:30,'3m':90,'6m':180,year:365};
  if(State.statsPeriod!=='all'){ const days=periodMap[State.statsPeriod]||30; from=new Date(now.getFullYear(),now.getMonth(),now.getDate()-days); }
  list = list.filter(w=>parseD(w.date)>=from);

  const totalT = list.reduce((a,w)=>a+Calc.workoutTonnage(w),0);
  const avgT = list.length? totalT/list.length : 0;
  const hours = list.reduce((a,w)=>a+(Number(w.duration)||0),0)/60;
  const mgTotals = {}, mgWorkouts = {};
  list.forEach(w=>{ const b=Calc.muscleBreakdown(w,DB.exercises); Object.keys(b).forEach(g=>{ mgTotals[g]=(mgTotals[g]||0)+b[g]; if(b[g]>0) mgWorkouts[g]=(mgWorkouts[g]||0)+1; }); });
  // длина выбранного периода в днях («Всё время» — с первой тренировки); среднее за неделю/месяц… = тоннаж ÷ число таких отрезков в периоде

  const MG_COLS = [['week',7,'За неделю'],['month',30.44,'За месяц'],['3m',91.31,'За 3 месяца'],['6m',182.62,'За полгода'],['year',365.25,'За год']];
  const perUnit = (g, len) => spanDays >= len*0.97 ? fmtNum(convW(mgTotals[g]/(spanDays/len),units)) : '—';

  const exTotals = {};
  list.forEach(w=>(w.blocks||[]).forEach(b=>(b.exercises||[]).forEach(ex=>{

    exTotals[key] = exTotals[key] || {name:info.name, maxW:0, maxR:0, tonnage:0, count:0, ws:new Set()};

  list.forEach(w=>{ byDay[w.date]=(byDay[w.date]||0)+Calc.workoutTonnage(w); });

  const maxV = Math.max(1,...days.map(d=>byDay[d]));
  const svgW=560, svgH=110, step = days.length>1? svgW/(days.length-1) : svgW;
  const pts = days.map((d,i)=>`${i*step},${svgH-6-(byDay[d]/maxV)*(svgH-16)}`).join(' ');

  const fold = (key, title, html) => `<details class="fold" data-fold="${key}" ${(State.fold||{})[key]===false?'':'open'}><summary class="fold-sum">${title}</summary><div class="fold-body">${html}</div></details>`;

      <select data-stats-period>${[['week','Неделя'],['month','Месяц'],['3m','3 месяца'],['6m','6 месяцев'],['year','Год'],['all','Всё время']].map(([id,l])=>`<option value="${id}" ${State.statsPeriod===id?'selected':''}>${l}</option>`).join('')}</select>

    <div class="kpi"><div class="kpi-l">Тренировок</div><div class="kpi-n">${list.length}</div></div>

  ${focusGroupsCard(State.statsParticipant || selfParticipantId())}
  <div class="card" style="margin-bottom:10px">

  </div>

  ${fold('mg', 'По группам мышц', `

// итоги года: считаем из загруженных тренировок; если их нет (старые годы) — берём свод с сервера (yearly_archive)
function yearSummary(ws, y){
  const list = ws.filter(w=>w.date.startsWith(y+'-')).sort((a,b)=>a.date.localeCompare(b.date));
  if(!list.length) return null;
  const tons = list.map(w=>Calc.workoutTonnage(w)); const bi = tons.indexOf(Math.max(...tons));
  const weeks = new Set(list.map(w=>weekKeyOf(w.date))).size;
  const weeksInYear = y===new Date().getFullYear() ? Math.max(1, Math.ceil((Date.now()-new Date(y,0,1))/(7*86400000))) : 52;
  const durs = list.map(w=>Number(w.duration)||0).filter(Boolean);
  return { year:y, first:{date:list[0].date, name:list[0].name, tonnage:tons[0]}, best:{date:list[bi].date, name:list[bi].name, tonnage:tons[bi]},
    avgDur: durs.length ? durs.reduce((a,b)=>a+b,0)/durs.length : 0, stability: Math.min(100, weeks/weeksInYear*100),
    total: list.length, tonnage: tons.reduce((a,b)=>a+b,0), current: y===new Date().getFullYear() };
}
async function loadArchive(pid){
  State.archive = State.archive || {}; State.archive[pid] = [];   // помечаем «загружается», чтобы не запрашивать повторно
  const {data} = await Auth.getClient().from('yearly_archive').select('*').eq('participant_id', pid);
  State.archive[pid] = data || []; if(State.view==='stats') renderMain();
}
function archiveCard(pid){
  if(!State.archive || !State.archive[pid]){ loadArchive(pid); }
  const server = (State.archive && State.archive[pid]) || [];
  const ws = DB.workouts.filter(w=>w.participantId===pid && (w.status==='done' || (w.date<=dstr(new Date()) && hasFilledSets(w))));
  const years = [...new Set([...ws.map(w=>+w.date.slice(0,4)), ...server.map(r=>r.year)])].sort((a,b)=>b-a);
  const units = DB.settings.units, kg = v => `${fmtNum(convW(v,units))} ${unitLabel(units)}`;
  const rows = years.map(y=>{ const l = yearSummary(ws, y); if(l) return l; const r = server.find(x=>x.year===y);
    return r && { year:y, first:r.first_workout||{}, best:r.best_workout||{}, avgDur:+r.avg_duration_min||0, stability:+r.stability_percent||0, total:r.total_workouts, tonnage:+r.total_tonnage||0 }; }).filter(Boolean);
  return `<div class="card" style="margin-top:10px">
    <h3>📚 Архив по годам</h3>

// дневник: сразу последние 60 дней (для недельного графика и «недавних»), более ранние даты — по запросу
async function loadFood(date){
  const c = Auth.getClient(), uid = foodUid();
  State.foodLoaded = State.foodLoaded || {}; State.foodRows = State.foodRows || [];
  let q = c.from('food_log').select('*').eq('user_id', uid);
  if(!State.foodLoaded[uid]){
    const L = State.foodLoaded[uid] = {}, since = dstr(new Date(Date.now()-60*86400000));
    for(let d=parseD(since); d<=new Date(); d.setDate(d.getDate()+1)) L[dstr(d)] = 1;
    q = q.gte('date', since);
  } else { State.foodLoaded[uid][date] = 1; q = q.eq('date', date); }
  const {data, error} = await q.order('created_at');
  if(error){ toast('Не загрузился дневник питания: '+error.message); return; }
  const ids = new Set(State.foodRows.map(r=>r.id));
  State.foodRows.push(...(data||[]).filter(r=>!ids.has(r.id)));
  if(State.view==='food') renderMain();
}

// норма по формуле Миффлина — Сан-Жеора × активность, с поправкой на цель
const KCAL_GOALS = [['lose','Снижение веса',0.85],['keep','Поддержание веса',1],['gain','Набор мышечной массы',1.1]];
// цель питания: выбранная в разделе калорий, иначе — по цели занятий из личных данных
const kcalGoalOf = d => d.kcal_goal || (/похуд/i.test(d.goal||'') ? 'lose' : /масс/i.test(d.goal||'') ? 'gain' : 'keep');
function foodNorm(uid = foodUid()){
  const d = (DB.details||[]).find(x=>x.user_id===uid) || {};
  const w = +d.weight_kg || 0, h = +d.height_cm || 0, age = +ageFrom(d.birth_date) || 0;
  const goal = kcalGoalOf(d), gk = KCAL_GOALS.find(g=>g[0]===goal)[2], act = +d.activity || 1.375;
  const bmr = (w && h && age && d.gender) ? Math.round(10*w + 6.25*h - 5*age + (d.gender==='male' ? 5 : -161)) : 0;
  const tdee = bmr ? Math.round(bmr * act / 10) * 10 : 0;                       // расход за день = поддержание веса
  const byGoal = Object.fromEntries(KCAL_GOALS.map(([id,,k])=>[id, Math.round(bmr * act * k / 10) * 10]));
  const auto = bmr ? byGoal[goal] : 0;
  const kcal = +d.kcal_target || auto;
  if(!kcal) return null;
  const pk = goal==='keep' ? 1.6 : 2;
  const p = w ? w * pk : kcal*0.25/4, f = w ? w*0.9 : kcal*0.3/9;
  return { kcal, auto, manual: !!+d.kcal_target, goal, gk, bmr, tdee, byGoal, act, age, h, pk, gender: d.gender,
    p: Math.round(p), f: Math.round(f), c: Math.max(0, Math.round((kcal - p*4 - f*9)/4)), weight: w, activity: d.activity || '1.375' };
}
// «почему так»: расчёт по шагам простыми словами
function normExplain(n){
  if(!n.bmr) return '';
  const g = KCAL_GOALS.find(x=>x[0]===n.goal);

// примерный расход на тренировках дня: силовая ≈ 5 МЕТ, кардио ≈ 7 МЕТ
function workoutBurn(date, weight){
  return Math.round(DB.workouts.filter(w=>w.participantId===foodUid() && w.date===date && (w.status==='done' || hasFilledSets(w)))
    .reduce((a,w)=>a + (w.type==='cardio' ? 7 : 5) * (weight||70) * (Number(w.duration)||0)/60, 0));
}

  </div>
  <div class="card food-sum" style="margin-bottom:10px">
    ${n ? `${kcalRing(s.kcal, n.kcal)}
      <div class="food-macros">${macro('Белки', s.p, n.p)}${macro('Жиры', s.f, n.f)}${macro('Углеводы', s.c, n.c)}</div>`

// кольцо «осталось ккал»: заполняется по мере съеденного; сверх нормы — красное
function kcalRing(eaten, norm){
  const left = norm - eaten, k = Math.min(1, eaten/Math.max(norm,1)), over = eaten > norm*1.05, C = 2*Math.PI*84;
  return `<div class="kring"><svg viewBox="0 0 200 200" width="190" height="190"><circle cx="100" cy="100" r="84" stroke="var(--surface2)" stroke-width="16" fill="none"/>
    <circle cx="100" cy="100" r="84" stroke="${over?'var(--danger)':'var(--accent)'}" stroke-width="16" fill="none" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-k)).toFixed(1)}" transform="rotate(-90 100 100)"/></svg>
    <div class="kring-c"><b style="${left<0?'color:var(--danger)':''}">${fmtNum(Math.abs(Math.round(left)))}</b><span>${left>=0?'ккал осталось':'ккал сверх нормы'}</span></div></div>
    <div class="muted" style="text-align:center;margin:-2px 0 12px"><span>Съедено</span> <b data-no-tr>${fmtNum(Math.round(eaten))} / ${fmtNum(norm)}</b> <span>ккал</span></div>`;
}
async function saveFoodPatch(patch, msg){
  const uid = foodUid();
  const {error} = await Auth.getClient().rpc('set_food_norm', {p_user: uid, p_patch: patch});
  if(error) return toast('Не сохранено: '+error.message);
  const old = (DB.details||[]).find(x=>x.user_id===uid);
  DB.details = (DB.details||[]).filter(x=>x.user_id!==uid).concat([{...(old||{user_id:uid}), ...patch}]);
  toast(msg); renderMain();
}
async function saveFoodNorm(){
  const t = parseInt(document.getElementById('foodTarget').value, 10);
  return saveFoodPatch({ activity: document.getElementById('foodActivity').value, kcal_target: t > 0 ? t : null }, 'Норма сохранена');
}

function foodMatches(q){
  const recent = []; const seen = new Set();
  (State.foodRows||[]).filter(r=>r.user_id===foodUid()).reverse().forEach(r=>{ const k = normName(r.name); if(!seen.has(k) && +r.grams>0){ seen.add(k);
    const g = +r.grams/100; const cat0 = FOOD_DB.find(x=>normName(x.name)===k);
    recent.push({name:r.name, kcal:+r.kcal/g, p:+r.protein/g, f:+r.fat/g, c:+r.carbs/g, lastGrams:+r.grams, recent:true, unit:r.unit, pc:cat0&&cat0.pc, pcName:cat0&&cat0.pcName}); } });
  const nq = normName(q||'');
  const cat = FOOD_DB.filter(x=>!seen.has(normName(x.name)));
  if(!nq) return [...recent.slice(0,8), ...cat].slice(0,40);
  const stem = w => w.length>=4 ? w.slice(0,-1) : w;
  const words = nq.split(' ');
  const tn = x => { const t = I18N.lang!=='ru' ? I18N.t(x.name) : '', al = FOOD_ALIASES[x.name];
    return normName(x.name) + (t && t!==x.name ? ' '+normName(t) : '') + (al ? ' '+normName(al) : ''); };
  const hit = x => { const n = tn(x), nw = n.split(/[\s(),%]+/);
    return words.every(w => n.includes(w) || nw.some(t => t.startsWith(stem(w)))); };
  return [...recent, ...cat].filter(hit).sort((a,b)=>(tn(b).startsWith(nq)) - (tn(a).startsWith(nq))).slice(0,40);
}

async function saveFoodEntry(){
  const m = State.modal, num = v => { const x = parseFloat(String(v??'').replace(',','.')); return isFinite(x) ? x : 0; };
  let item, grams;
  if(m.custom){
    const cu = m.cu; grams = num(cu.grams);
    if(!(cu.name||'').trim() || grams<=0 || num(cu.kcal)<=0) return toast('Заполните название, граммы и калории');
    item = {name:cu.name.trim(), kcal:num(cu.kcal), p:num(cu.p), f:num(cu.f), c:num(cu.c), unit:cu.unit||'g'};
  } else { item = m.sel; grams = num(m.grams); if(grams<=0) return toast(unitOf(item)==='мл'?'Укажите объём':'Укажите вес порции'); }
  const r = foodCalc(item, grams), rd = v => Math.round(v*10)/10;
  const row = { user_id: m.uid, date: m.date, meal: m.meal, name: item.name, unit: unitOf(item)==='мл' ? 'ml' : 'g', grams: rd(grams), kcal: rd(r.kcal), protein: rd(r.p), fat: rd(r.f), carbs: rd(r.c) };
  const c = Auth.getClient();
  const {data, error} = m.editId ? await c.from('food_log').update(row).eq('id', m.editId).select().single() : await c.from('food_log').insert(row).select().single();
  if(error) return toast('Не сохранено: '+error.message);
  State.foodRows = State.foodRows.filter(r=>r.id!==m.editId).concat([data]); State.modal = null; renderModal(); renderMain();
}

function foodClick(ds){
  const a = ds.food, m = State.modal;
  if(a==='prev' || a==='next'){ const d = parseD(foodDate()); d.setDate(d.getDate() + (a==='next'?1:-1)); if(dstr(d)<=dstr(new Date())) State.foodDate = dstr(d); renderMain(); return; }
  if(a==='details'){ State.view='participants'; State.participantProfile=selfParticipantId(); rerender(); return; }
  if(a==='saveNorm') return saveFoodNorm();
  if(a==='goal') return saveFoodPatch({kcal_goal: ds.g}, 'Цель сохранена');
  if(a==='del'){ const id = ds.id;
    Auth.getClient().from('food_log').delete().eq('id', id).then(({error})=>{ if(error) return toast('Ошибка: '+error.message);
      State.foodRows = State.foodRows.filter(r=>r.id!==id); renderMain(); });
    return; }

}

async function saveLinks(){

  const bad = D.links.find(x=>!String(x.title||'').trim() || !/^https:\/\/\S+$/.test(String(x.url||'').trim()));
  if(bad){ State.linkError = 'У каждой ссылки нужно название и адрес, начинающийся с https://'; renderMain(); return; }
  const c = Auth.getClient(); State.linkError = '';
  const sorted = ['support','bloggers'].flatMap(sec=>D.links.filter(x=>x.section===sec).map((x,k)=>({...x, sort:k})));
  const rows = sorted.map(x=>({ ...(x.id?{id:x.id}:{}), section:x.section, kind:x.kind||'other', title:x.title.trim().slice(0,80), url:x.url.trim(), note:(x.note||'').trim().slice(0,200)||null, sort:x.sort }));
  const texts = Object.entries(D.texts).map(([key,value])=>({key, value:String(value||'').slice(0,500)}));
  const res = await Promise.all([
    D.removed.length ? c.from('app_links').delete().in('id', D.removed) : {error:null},
    rows.filter(r=>r.id).length ? c.from('app_links').upsert(rows.filter(r=>r.id)) : {error:null},
    rows.filter(r=>!r.id).length ? c.from('app_links').insert(rows.filter(r=>!r.id)) : {error:null},
    c.from('app_texts').upsert(texts) ]);
  const err = res.find(x=>x && x.error);
  if(err){ State.linkError = 'Не сохранено: '+err.error.message+(/app_links|app_texts|relation/.test(err.error.message)?' — запустите в Supabase файл stage18_links.sql':''); renderMain(); return; }

}

const CERT_STATUS = {pending:['на модерации','st-plan'], approved:['подтверждён','st-done'], rejected:['отклонён','st-rej']};
// фото лежат в закрытом хранилище — показываем по временной ссылке
const certUrlCache = {};
// ===== фон у загруженных ачивок: однотонный фон по краям картинки становится прозрачным =====
function removeBg(cv){
  const W = cv.width, H = cv.height, ctx = cv.getContext('2d'); let id;
  try{ id = ctx.getImageData(0, 0, W, H); }catch(e){ return false; }
  const d = id.data, px = i => [d[i*4], d[i*4+1], d[i*4+2], d[i*4+3]];
  const edge = []; for(let x=0;x<W;x++){ edge.push(x, (H-1)*W+x); } for(let y=0;y<H;y++){ edge.push(y*W, y*W+W-1); }
  if(edge.filter(i=>d[i*4+3]<20).length > edge.length*0.5) return false;          // уже прозрачная
  const q = {}; edge.forEach(i=>{ const [r,g,b] = px(i); const k = (r>>4)+','+(g>>4)+','+(b>>4); q[k] = (q[k]||0)+1; });
  const top = Object.entries(q).sort((a,b)=>b[1]-a[1])[0]; if(!top || top[1] < edge.length*0.35) return false;   // фон не однотонный
  const bg = top[0].split(',').map(v=>(+v<<4)+8);
  const dist = i => Math.max(Math.abs(d[i*4]-bg[0]), Math.abs(d[i*4+1]-bg[1]), Math.abs(d[i*4+2]-bg[2]));
  const seen = new Uint8Array(W*H), st = edge.filter(i=>dist(i)<40);
  st.forEach(i=>seen[i]=1);
  while(st.length){ const i = st.pop(); d[i*4+3] = 0; const x = i%W, y = (i/W)|0;
    for(const j of [x>0?i-1:-1, x<W-1?i+1:-1, y>0?i-W:-1, y<H-1?i+W:-1]){ if(j<0 || seen[j]) continue; seen[j]=1;
      const k = dist(j); if(k<40) st.push(j); else if(k<80) d[j*4+3] = Math.min(d[j*4+3], Math.round(255*(k-40)/40)); } }
  ctx.putImageData(id, 0, 0); return true;
}
// уже загруженные ачивки чистим при показе (результат кешируется)
const cbClean = { cache:{}, busy:{} };
function hydrateBadges(){
  document.querySelectorAll('img[data-cb-src]').forEach(img=>{
    const u = img.dataset.cbSrc; if(cbClean.cache[u]){ if(img.src!==cbClean.cache[u]) img.src = cbClean.cache[u]; return; }
    if(cbClean.busy[u]) return; cbClean.busy[u] = true;
    const i = new Image(); i.crossOrigin = 'anonymous';
    i.onload = ()=>{ try{ const cv = document.createElement('canvas'); cv.width = i.naturalWidth; cv.height = i.naturalHeight; cv.getContext('2d').drawImage(i,0,0);
      if(removeBg(cv)) cv.toBlob(b=>{ if(!b) return; cbClean.cache[u] = URL.createObjectURL(b); document.querySelectorAll('img[data-cb-src]').forEach(x=>{ if(x.dataset.cbSrc===u) x.src = cbClean.cache[u]; }); }, 'image/png');
      }catch(e){} };
    i.src = u;
  });
}
async function hydrateCertImages(){
  hydrateBadges();
  const imgs = [...document.querySelectorAll('img[data-cert-path]:not([src])')]; if(!imgs.length) return;
  const c = Auth.getClient(); if(!c || !c.storage) return;
  for(const img of imgs){
    const path = img.dataset.certPath;
    if(!certUrlCache[path]){ const {data} = await c.storage.from('certificates').createSignedUrl(path, 3600); certUrlCache[path] = data && data.signedUrl; }
    if(certUrlCache[path]){ img.src = certUrlCache[path]; img.dataset.zoom = certUrlCache[path]; }
  }
}

// уменьшаем фото до 1600 px (JPEG) — быстрее загрузка из мобильной сети
function compressImage(file, max=1600){
  return new Promise((res, rej)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{ const k = Math.min(1, max/Math.max(img.width, img.height)); const c = document.createElement('canvas');
      c.width = Math.round(img.width*k); c.height = Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); c.toBlob(b=>b?res(b):rej(new Error('не удалось обработать фото')), 'image/jpeg', 0.85); };
    img.onerror = ()=>rej(new Error('файл не похож на изображение')); img.src = url;
  });
}

  const row = { id:Storage.uid(), user_id:selfParticipantId(), competition_name:name, competition_date:v('certDate')||null,
    result:v('certResult')||null, competition_place:v('certPlace')||null };

  try{
    const c = Auth.getClient(), blob = await compressImage(file), path = `${row.user_id}/${row.id}.jpg`;
    const up = await c.storage.from('certificates').upload(path, blob, {contentType:'image/jpeg', upsert:true});
    if(up.error) throw new Error('фото: '+up.error.message);
    row.certificate_image_url = path;
    const {data, error} = await c.from('user_achievements').insert(row).select().single();
    if(error) throw new Error(error.message);
    DB.certs = [data||{...row, status:'pending'}, ...(DB.certs||[])];
    closeModal(); renderMain(); toast('Сертификат отправлен на проверку администратору');
  }catch(e){ m.busy = false; m.error = 'Не удалось отправить: '+e.message; renderModal(); }
}

// картинка → до 512 px (PNG, прозрачность сохраняется) → хранилище → запись в библиотеку → сразу выбрана
async function createCustomBadge(key){
  const f = (document.getElementById('cbFile')||{}).files?.[0], title = (document.getElementById('cbTitle')||{}).value?.trim(), desc = (document.getElementById('cbDesc')||{}).value?.trim();
  if(!f) return toast('Выберите картинку ачивки'); if(!title) return toast('Впишите название ачивки');
  try{
    const img = await new Promise((res, rej)=>{ const i = new Image(); i.onload=()=>res(i); i.onerror=rej; i.src = URL.createObjectURL(f); });
    const k = Math.min(1, 512/Math.max(img.width, img.height)), cv = document.createElement('canvas');
    cv.width = Math.round(img.width*k); cv.height = Math.round(img.height*k); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    removeBg(cv);   // однотонный фон картинки (белый, серый…) делаем прозрачным
    const blob = await new Promise(res=>cv.toBlob(res, 'image/png'));
    const c = Auth.getClient(), path = `${crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2)}.png`;
    const up = await c.storage.from('badges').upload(path, blob, {contentType:'image/png', upsert:false});
    if(up.error) throw up.error;
    const url = c.storage.from('badges').getPublicUrl(path).data.publicUrl;
    const {data, error} = await c.from('custom_badges').insert({title:title.slice(0,80), description:desc?desc.slice(0,300):null, image_url:url}).select().single();
    if(error) throw error;
    DB.customBadges = [...(DB.customBadges||[]), data];
    const cur = pickOf(key, key==='personal' ? [] : certBadgeRows(key).map(u=>u.badge_id));
    State.bpick[key] = [...cur, data.id]; State.cbNew = null;
    toast('Ачивка загружена и выбрана'); renderMain();
  }catch(e){ toast('Не загрузилось: '+(e.message||e)+(/badges|custom_badges|relation|bucket/i.test(String(e.message||e))?' — запустите stage19_cert_badges.sql':'')); }
}
// сохранить набор ачивок сертификата: новые — выдать, снятые — убрать
async function saveCertBadges(certId){
  const cert = (State.admin.approved||[]).find(x=>x.id===certId); if(!cert) return;
  const rows = certBadgeRows(certId), cur = rows.map(u=>u.badge_id), want = pickOf(certId, cur);
  const add = want.filter(id=>!cur.includes(id)), del = rows.filter(u=>!want.includes(u.badge_id)).map(u=>u.id), c = Auth.getClient();
  if(del.length){ const {error} = await c.from('user_badges').delete().in('id', del); if(error) return toast('Ошибка: '+error.message); }
  let added = [];
  if(add.length){ const {data, error} = await c.from('user_badges').insert(add.map(b=>({user_id:cert.user_id, badge_id:b, cert_id:certId}))).select(); if(error) return toast('Ошибка: '+error.message); added = [].concat(data||[]); }
  State.admin.userBadges = (State.admin.userBadges||[]).filter(u=>!del.includes(u.id)).concat(added);
  delete State.bpick[certId]; State.cbOpen = null;
  toast(add.length||del.length ? `Выдано: ${add.length}, снято: ${del.length}` : 'Без изменений'); renderMain();
}
async function findUsersForBadges(){
  const q = ((document.getElementById('pbQ')||{}).value||'').trim().replace(/^@/, ''); State.pbQ = q;
  if(q.length < 2){ State.pbResults = []; renderMain(); return toast('Введите хотя бы 2 буквы'); }
  const s = q.replace(/[%_,()]/g, ' ');
  const {data, error} = await Auth.getClient().from('profiles').select('id,name,telegram_username').or(`name.ilike.%${s}%,telegram_username.ilike.%${s}%`).limit(20);
  if(error) return toast('Ошибка: '+error.message);
  State.pbResults = data||[]; renderMain();
}
async function givePersonalBadges(){
  const u = State.pbUser, pick = pickOf('personal', []), note = ((document.getElementById('pbNote')||{}).value||'').trim().slice(0,300) || null;
  if(!u) return; if(!pick.length) return toast('Выберите хотя бы одну ачивку');
  const {data, error} = await Auth.getClient().from('user_badges').insert(pick.map(b=>({user_id:u.id, badge_id:b, note}))).select();

  toast(`Выдано ачивок: ${pick.length} — пользователю придёт сообщение`); renderMain();
}
async function removeUserBadge(id){
  askConfirm('Снять ачивку?', 'Она пропадёт у пользователя.', 'Снять', async ()=>{
    const {error} = await Auth.getClient().from('user_badges').delete().eq('id', id);
    if(error) return toast('Ошибка: '+error.message);
    State.admin.userBadges = (State.admin.userBadges||[]).filter(u=>u.id!==id); DB.userBadges = (DB.userBadges||[]).filter(u=>u.id!==id);
    toast('Ачивка снята'); renderMain(); });
}
async function deleteCustomBadge(id){
  const b = (DB.customBadges||[]).find(x=>x.id===id); if(!b) return;
  askConfirm('Удалить ачивку?', `«${b.title}» пропадёт у всех, кому она выдана.`, 'Удалить', async ()=>{
    const c = Auth.getClient(); const {error} = await c.from('custom_badges').delete().eq('id', id);
    if(error) return toast('Ошибка: '+error.message);
    const path = b.image_url.split('/badges/')[1]; if(path) c.storage.from('badges').remove([decodeURIComponent(path)]);
    DB.customBadges = DB.customBadges.filter(x=>x.id!==id);
    State.admin.userBadges = (State.admin.userBadges||[]).filter(u=>u.badge_id!==id); DB.userBadges = (DB.userBadges||[]).filter(u=>u.badge_id!==id);
    toast('Ачивка удалена'); renderMain(); });
}

// просмотр картинки на весь экран: нажатие — приблизить/отдалить, при приближении картинку можно двигать пальцем
function openZoom(src){
  const box=document.createElement('div'); box.className='zoom-box';
  box.innerHTML=`<button class="zoom-close" aria-label="Закрыть">✕</button><div class="zoom-scroll"><img src="${esc(src)}" alt=""></div>`;
  const img=box.querySelector('img'), sc=box.querySelector('.zoom-scroll');
  img.onclick=e=>{ e.stopPropagation();
    const r=img.getBoundingClientRect(), fx=(e.clientX-r.left)/r.width, fy=(e.clientY-r.top)/r.height;
    box.classList.toggle('zoomed');
    if(box.classList.contains('zoomed')){ sc.scrollLeft=img.offsetWidth*fx-sc.clientWidth/2; sc.scrollTop=img.offsetHeight*fy-sc.clientHeight/2; }
  };
  box.onclick=()=>box.remove();
  document.body.appendChild(box);
}
function askConfirm(title, text, yesLabel, onYes){
  // подтверждение поверх окна: «Отмена» возвращает в него же
  State.modal = {kind:'confirmDelete', title, text, yesLabel, back: State.modal || null, onYes:()=>{ closeModal(); onYes(); }};
  renderModal();
}
// ===== отдых между подходами: запускается сам после ввода повторений; в конце — «Приступаем!» =====
const Rest = { left:0, t:null, done:null,
  start(sec, done){ sec = Number(sec)||DB.settings.restDefault||120; if(sec<=0) return; this.stop(true); this.left = sec; this.done = done||null; this.draw(); this.t = setInterval(()=>this.tick(), 1000); },
  tick(){ this.left--; if(this.left>0) return this.draw(); clearInterval(this.t); this.t=null; this.draw(true);
    try{ const h = window.Telegram && Telegram.WebApp.HapticFeedback; h && h.notificationOccurred('success'); }catch(e){}
    try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){}
    const cb = this.done; this.done = null; if(cb) cb(); else setTimeout(()=>{ if(!this.t) this.stop(true); }, 4000); },
  add(d){ if(!this.t) return; this.left = Math.max(1, this.left+d); this.draw(); },
  stop(silent){ clearInterval(this.t); this.t=null; const el = document.getElementById('restBar'); if(el) el.remove(); if(!silent && this.done){ const cb=this.done; this.done=null; cb(); } },
  draw(end){ const g = document.getElementById('gRestNum'); if(g){ g.textContent = end ? 'Приступаем! 💪' : fmtTime(this.left); const b = document.getElementById('restBar'); if(b) b.remove(); return; }
    let el = document.getElementById('restBar');
    if(!el){ el = document.createElement('div'); el.id='restBar'; el.className='rest-bar'; document.body.appendChild(el);
      el.onclick = e=>{ const b = e.target.closest('[data-rest]'); if(!b) return; const a = b.dataset.rest; if(a==='x') Rest.stop(); else Rest.add(+a); }; }
    el.classList.toggle('go', !!end);
    el.innerHTML = end ? `<b>Приступаем! 💪</b><button data-rest="x">OK</button>`
      : `<span>Отдых</span><b data-no-tr>${fmtTime(this.left)}</b><button data-rest="-15">−15</button><button data-rest="15">+15</button><button data-rest="x" title="Пропустить отдых">✕</button>`; } };
function toast(msg){
  document.querySelectorAll('.toast').forEach(x=>x.remove());
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3200);
}
function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).then(()=>true).catch(()=>fallback());
  return Promise.resolve(fallback());
  function fallback(){
    const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch(e){} ta.remove(); return ok;
  }
}

function applyTheme(){
  const root = document.documentElement;
  root.setAttribute('data-theme', DB.settings.theme==='auto' ? '' : DB.settings.theme);
  const t = PRESET_THEMES.find(x=>x.id===DB.settings.themeColor) || PRESET_THEMES[0];
  const isDark = DB.settings.theme==='dark' || (DB.settings.theme==='auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  const v = isDark ? t.D : t.L;
  root.style.setProperty('--accent', isDark ? t.dark : t.accent);
  root.style.setProperty('--accent2', t.accent2);
  root.style.setProperty('--on-accent', isDark ? '#16211d' : '#ffffff');
  ['bg','surface','surface2','border'].forEach(k=>root.style.setProperty('--'+k, v[k]));
  root.style.setProperty('--bg-art', v.art || 'none');
  if(t.design) root.setAttribute('data-design', t.design); else root.removeAttribute('data-design');
  if(t.brand) root.setAttribute('data-brand', isDark ? 'dark' : 'light'); else root.removeAttribute('data-brand');
  root.style.setProperty('--on-accent', !isDark ? '#ffffff' : t.design==='luxe' ? '#121114' : t.design==='carbon' ? (['cb-toxic','cb-graphite','cb-sage'].includes(t.id) ? '#0b0d08' : '#ffffff') : '#16211d');
  // металл иконок: серебро на тёмном фоне, тёмная сталь на светлом
  root.style.setProperty('--metal-hi', isDark ? '#ffffff' : '#8b9096');
  root.style.setProperty('--metal-mid', isDark ? '#cfcfcf' : '#5a5f65');
  root.style.setProperty('--metal-lo', isDark ? '#8a8a8a' : '#2c3035');
  const meta = document.querySelector('meta[name=theme-color]'); if(meta) meta.content = v.bg;
}
if(window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', ()=>{ if(DB.settings.theme==='auto') applyTheme(); });

function handleMainClick(e, ds){
  if(ds.nav!==undefined){ State.view=ds.nav; State.participantProfile=null; rerender(); return true; }
  if(ds.calNav!==undefined){
    const act = ds.calNav, d = State.calDate;
    if(act==='today') State.calDate = new Date();
    else{
      const dir = act==='prev'?-1:1;
      if(State.calMode==='month') State.calDate = new Date(d.getFullYear(), d.getMonth()+dir, 1);
      else if(State.calMode==='week') State.calDate = new Date(d.getFullYear(), d.getMonth(), d.getDate()+7*dir);
      else State.calDate = new Date(d.getFullYear(), d.getMonth(), d.getDate()+dir);
    }
    renderMain(); return true;
  }
  if(ds.histMore!==undefined){ State.histLimit=(State.histLimit||50)+50; renderMain(); return true; }
  if(ds.calMode!==undefined){ State.calMode=ds.calMode; renderMain(); return true; }
  if(ds.openWorkout!==undefined){ e.preventDefault(); openWorkoutModal({workoutId:ds.openWorkout}); return true; }
