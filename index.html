function handleMainChange(e, ds){
  if(ds.adminDays!==undefined){ State.adminDays=Number(e.target.value); State.admin=null; renderMain(); return true; }
  if(ds.hf!==undefined){ State.historyFilters[ds.hf]=e.target.value; State.histLimit=50; renderMain(); return true; }
  if(ds.exEdit!==undefined){
    const [id,field] = ds.exEdit.split('.'); const ex = DB.exercises.find(x=>x.id===id);
    if(!ex || !(isAdmin() || ex.ownerId===selfParticipantId())) return true;   // своё упражнение может править и не админ
    if(field==='bodyweight'){ ex.bodyweight = e.target.checked; Storage.save(); State.achCache && State.achCache.clear(); return true; }
    if(field!=='name' || e.target.value.trim()){ ex[field] = field==='name' ? e.target.value.trim() : e.target.value; Storage.save(); }
    return true;
  }
  if(ds.statsParticipant!==undefined){ State.statsParticipant=e.target.value; renderMain(); return true; }
  if(ds.statsPeriod!==undefined){ State.statsPeriod=e.target.value; renderMain(); return true; }
  if(ds.setting!==undefined){
    const key = ds.setting; const val = e.target.value;
    DB.settings[key] = (key==='restDefault') ? Number(val) : val;
    Storage.save();
    if(key==='theme') applyTheme();
    if(key==='restDefault' && !timerRunning) timerLeft = Number(val)||120;
    preserveFocusAndRerender(renderMain); return true;
  }
  if(e.target.id==='pdMemTerm'){ document.getElementById('pdMemEndWrap').classList.toggle('hidden', e.target.value!=='custom'); return true; }
  if(e.target.id==='importTplFile'){
    const file=e.target.files[0]; if(!file) return true;
    const r=new FileReader(); r.onload=()=>{ State.modal.text=r.result; State.modal.error=''; renderModal(); }; r.readAsText(file); return true;
  }
  if(e.target.id==='importFile'){
    const file = e.target.files[0]; if(!file) return true;
    const reader = new FileReader();
    reader.onload = ()=>{
      let obj; try{ obj = JSON.parse(reader.result); }catch(err){ toast('Не удалось прочитать файл: '+err.message); return; }
      toast('⏳ Загружаем данные из файла…');
      Storage.importJSON(obj).then(n=>{ toast(`✅ Добавлено: тренировок ${n.workouts}, шаблонов ${n.templates}, упражнений ${n.exercises}, записей веса ${n.weights}, продуктов ${n.food}`);
        State.achCache && State.achCache.clear(); renderMain(); }).catch(err=>toast('Импорт не удался: '+(err.message||err)));
    };
    reader.readAsText(file);
    return true;
  }
  return false;
}

/* ===================== GLOBAL DELEGATED LISTENERS (bound once) ===================== */
function initEvents(){
  document.addEventListener('click', (e)=>{
    const foodEl = e.target.closest('#main [data-food],#modalRoot [data-food]');
    if(foodEl){ if(!foodEl.disabled) foodClick(foodEl.dataset); return; }
    const modalEl = e.target.closest('#modalRoot [data-close-overlay],#modalRoot [data-close-modal],#modalRoot [data-add-block],#modalRoot [data-ach-info],#modalRoot [data-set-drop],#modalRoot [data-move-ex],#modalRoot [data-move-block],#modalRoot [data-add-cardio],#modalRoot [data-remove-block],#modalRoot [data-add-exercise],#modalRoot [data-remove-exercise],#modalRoot [data-add-set],#modalRoot [data-remove-set],#modalRoot [data-save-workout],#modalRoot [data-close-editor],#modalRoot [data-finish-workout],#modalRoot [data-save-as-template],#modalRoot [data-delete-workout],#modalRoot [data-pick-exercise],#modalRoot [data-create-exercise],#modalRoot [data-confirm-yes],#modalRoot [data-recur-scope],#modalRoot [data-confirm-template],#modalRoot [data-import-example],#modalRoot [data-import-run],#modalRoot [data-help],#modalRoot [data-zoom],#modalRoot [data-send-cert]');
    if(modalEl){ if(handleModalClick({target:e.target, currentTarget:modalEl, preventDefault:()=>e.preventDefault()}, modalEl.dataset)) return; }
    const overlay = e.target.closest('.overlay');
    if(overlay && e.target===overlay){ closeModal(); return; }
    const mainEl = e.target.closest('#main [data-nav],#sidebar [data-nav],#bottomnav [data-nav],[data-cal-nav],[data-cal-mode],[data-open-workout],[data-add-day],[data-day],[data-repeat-workout],[data-use-template],[data-delete-template],[data-toggle-public],[data-copy-template],[data-import-templates],[data-rename-template],[data-open-participant],[data-back-participants],[data-save-participant],[data-save-details],[data-add-cert],[data-del-cert],[data-review-cert],[data-open-admin],#main img[data-cert-path],#main img[data-zoom],[data-ach-tab],[data-ach-info],[data-ach-beast],[data-trainee-color],#main [data-help],[data-ext],[data-copy-code],[data-paste-code],[data-add-friend],[data-friend-respond],[data-trainer-respond],[data-offer-trainer],[data-drop-link],[data-remove-friend],[data-delete-exercise],[data-export],[data-timer],[data-pick-theme],[data-shared-more],[data-steps-save],[data-hist-more],[data-lk-add],[data-lk-del],[data-lk-move],[data-lk-save],[data-lk-reset],[data-cb-pick],[data-cb-new],[data-cb-create],[data-cb-open],[data-cb-save],[data-cb-del],[data-pb-find],[data-pb-user],[data-pb-give],[data-ub-del],[data-transfer-code],[data-copy-transfer],[data-transfer-claim],[data-mv-find],[data-mv-pick],[data-mv-go]');
    if(mainEl){ handleMainClick(e, mainEl.dataset); }
  });
  function onChangeOrInput(e){
    if(e.target.matches('[data-food-in]')){ if(e.type==='input') foodInput(e); return; }
    if(e.target.id==='foodUser'){ if(e.type==='change'){ State.foodUser = e.target.value || null; renderMain(); } return; }
    if(e.target.matches('[data-help-search]')){
      if(e.type!=='input') return;
      State.helpQuery = e.target.value; renderMain();
      const el=document.querySelector('[data-help-search]'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      return;
    }
    if(e.target.matches('[data-exsearch]')){
      if(e.type!=='input') return;
      State.modal.query = e.target.value; renderModal();
      const el = document.querySelector('[data-exsearch]'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      return;
    }
    // for free-text/number fields use 'input' for live recalculation; for select/checkbox use 'change'
    const tag = e.target.tagName;
    const isTextish = tag==='INPUT' && ['text','number','date','time'].includes(e.target.type);
    if(isTextish && e.type!=='input'){ if(e.type==='change' && e.target.matches('#modalRoot [data-set]')) restAfterSet(e.target); return; }
    if(!isTextish && e.type!=='change') return;
    const modalEl = e.target.closest('#modalRoot [data-w],#modalRoot [data-block-kind],#modalRoot [data-block-rest],#modalRoot [data-dropset],#modalRoot [data-set],#modalRoot [data-recur-on],#modalRoot [data-recur-freq],#modalRoot [data-recur-until],#modalRoot [data-recur-day]');
    if(modalEl){ if(handleModalChange(e, modalEl.dataset)) return; }
    const lk = e.target.closest('#main [data-lk]');
    if(lk && State.linkDraft){ State.linkDraft.dirty = true; const [a,b]=lk.dataset.lk.split('.'); if(a==='t') State.linkDraft.texts[b]=e.target.value; else if(State.linkDraft.links[+a]) State.linkDraft.links[+a][b]=e.target.value; return; }
    const mainEl = e.target.closest('[data-admin-days],#pdMemTerm,#importTplFile,[data-hf],[data-ex-edit],[data-stats-participant],[data-stats-period],[data-setting],#importFile');
    if(mainEl){ handleMainChange(e, mainEl.dataset); }
  }
  // помним раскрытую группу базовых программ между перерисовками
  document.addEventListener('toggle', e=>{ const d=e.target; if(d.id==='exList') State.exListOpen = d.open; if(d.dataset && d.dataset.fold){ State.fold = State.fold||{}; State.fold[d.dataset.fold] = d.open; } if(d.dataset && d.dataset.themeGroup){ State.themeOpen = State.themeOpen||{}; State.themeOpen[d.dataset.themeGroup] = d.open; } if(d.classList && d.classList.contains('base-group')){ if(d.open) State.openBase=d.dataset.baseGroup; else if(State.openBase===d.dataset.baseGroup) State.openBase=null; } }, true);
  document.addEventListener('change', onChangeOrInput);
  document.addEventListener('input', onChangeOrInput);
}

/* ===================== УПРОЩЁННЫЙ (МИНИМАЛИСТИЧНЫЙ) РЕЖИМ ТРЕНИРОВКИ =====================
   Приложение ведёт по тренировке шаг за шагом: упражнение → подход k из N → «сколько сделали?» → отдых → «Приступаем!».
   Это только другой интерфейс: подходы пишутся в саму тренировку (DB.workouts); её можно в любой момент открыть в обычном режиме

      : {weight:0, why:TT('Две тренировки подряд по {r}+ повторений — можно добавить небольшое отягощение.', {r:hi})};

}

let swTimer = null;
function swTick(){ const m = State.modal, el = document.getElementById('gSw'); if(!m || m.kind!=='guided' || !m.sw || !el){ clearInterval(swTimer); swTimer = null; return; } el.textContent = fmtTime(Math.floor((Date.now()-m.sw)/1000)); }
function guidedClick(a, el){
  const m = State.modal;
  if(a==='ask'){ openCoachSetup(); return; }
  if(a==='start'){ const d = el.dataset.day ? PROGRAMS[progKey(coach())].days.find(x=>x.id===el.dataset.day) : nextProgramDay(); if(d) startGuided(newGuidedWorkout(d.title, programBlocks(d))); return; }

    State.modal = null; startGuided(newGuidedWorkout(t.ownerId ? t.name : t.name.split(' · ').slice(2).join(' · ')||t.name, blocks)); return; }

    autosaveWorkout(); if(!DB.workouts.some(x=>x.id===w.id)) DB.workouts.push(w); startGuided(w); return; }
  if(a==='mintoggle'){ const c = coach(); c.minimal = !c.minimal; c.asked = true; saveCoach(); rerender();
    toast(c.minimal ? '🧭 Упрощённый режим включён: в «Календаре» — «Начать тренировку»' : 'Упрощённый режим выключен'); return; }
  if(a==='setlevel'){ const c = coach(); c.level = el.dataset.v; saveCoach(); renderMain(); return; }
  if(a==='pickday'){ State.pickDay = !State.pickDay; renderMain(); return; }
  if(a==='whyinfo'){ State.modal = {kind:'guidedWhy', back:State.modal}; renderModal(); return; }
  if(!m || m.kind!=='guided') return;
  const w = m.w;
  if(a==='exit'){ closeModal(); return; }
  if(a==='classic'){ Rest.stop(true); clearInterval(swTimer); guidedSaveW(w); openWorkoutModal({workoutId:w.id}); return; }
  if(a==='explained'){ const c = coach(); c.explained = true; saveCoach(); m.phase = hasFilledSets(w) ? 'set' : 'intro'; renderModal(); return; }
  if(a==='why'){ m.sub='why'; renderModal(); return; }
  if(a==='begin'){ m.phase='set'; renderModal(); return; }
  if(a==='swap'){ m.sub='swap'; renderModal(); return; }
  if(a==='unsub'){ m.sub=null; renderModal(); return; }
  if(a==='pick'){ const st = gSteps(w)[gPos(w)]; if(st){ const ex = gEx(w, st); ex.exerciseId = el.dataset.id; ex.sets.forEach(s=>{ if(!setDone(s) && s.ph) delete s.ph.weight; }); delete m.rec[st.bi+'.'+st.ei]; guidedSaveW(w); } m.sub=null; renderModal(); return; }
  if(a==='extra' || a==='noextra'){ m.extra = a==='extra'; renderModal(); return; }
  if(a==='rest-15' || a==='rest+15'){ Rest.add(a==='rest-15'?-15:15); return; }
  if(a==='restskip'){ Rest.stop(); return; }
  if(a==='swstart'){ m.sw = Date.now(); m.swVal = null; renderModal(); clearInterval(swTimer); swTimer = setInterval(swTick, 500); return; }

    const rv = numIn((document.getElementById('gReps')||{}).value||''), wv = (document.getElementById('gWeight')||{}).value, dv = (document.getElementById('gDist')||{}).value;

    if(w.startedAt) w.duration = Math.max(1, Math.round((Date.now()-Date.parse(w.startedAt))/60000));
    guidedSaveW(w);

    Rest.stop(true); guidedSaveW(w);

    finishWorkout();
    return;
  }
}

      <div class="row" style="gap:6px;margin-top:4px"><button class="btn sm ghost" data-gm="pickday">${State.pickDay?'Скрыть':'Другая тренировка программы'}</button><button class="btn sm ghost" data-gm="whyinfo">Как считается вес?</button></div>
      ${State.pickDay?`<div class="row" style="gap:6px;flex-wrap:wrap;margin-top:6px">${P.days.map(x=>`<button class="btn sm" data-gm="start" data-day="${x.id}">${esc(x.title)}</button>`).join('')}</div>`:''}`
    :`<div class="muted" style="margin:6px 0">Программа не выбрана. Выберите программу — приложение подскажет упражнения и веса.</div><button class="btn primary" data-gm="ask">Выбрать программу</button>`}
    ${mineT.length?`<div class="muted" style="margin-top:8px;font-size:12.5px">Или по своему шаблону:</div><div class="row" style="gap:6px;flex-wrap:wrap">${mineT.map(t=>`<button class="btn sm" data-gm="tpl" data-id="${t.id}">▶ ${esc(t.name)}</button>`).join('')}</div>`:''}
  </div>`;
}

// ===== советы после тренировки: по упражнениям (8–12), объёму, длительности, тоннажу и уровню =====
function workoutAdvice(w){
  const out = [], lv = coach().level || 'mid', me = w.participantId;
  const exs = (w.blocks||[]).flatMap(b=>(b.exercises||[]).map(ex=>({ex, info:DB.exercises.find(e=>e.id===ex.exerciseId)||{}})));
  let workSets = 0; const up = [], heavy = [];
  exs.forEach(({ex, info})=>{ if(isTimedEx(info)) return;
    const done = (ex.sets||[]).filter(setDone); if(!done.length) return;
    const top = Math.max(...done.map(s=>Number(s.weight)||0));
    const work = done.filter((s,i)=>!s.warm && !(i===0 && top>0 && (Number(s.weight)||0) < top*0.8));
    workSets += work.length;
    const [lo, hi] = parseReps(ex.target || '8–12');
    if(work.length>=2 && work.every(s=>Number(s.reps)>=hi)) up.push(info.name);
    else if(work.some(s=>Number(s.reps) < lo)) heavy.push(info.name); });
  if(up.length) out.push(TT('Во всех подходах по 12+ повторений: {x}. Если и в следующий раз будет так же — слегка добавьте вес (+0,5–1 кг).', {x:up.slice(0,3).map(trn).join(', ')}));
  if(heavy.length) out.push(TT('Меньше 8 повторений: {x}. Вес пока тяжеловат — оставьте его и добирайте повторения, при необходимости снизьте на 5–10%.', {x:heavy.slice(0,3).map(trn).join(', ')}));
  const lim = {beginner:[8,16], mid:[10,22], pro:[12,28]}[lv] || [10,22];
  if(workSets && workSets < lim[0]) out.push(TT('Рабочих подходов: {n} — для вашего уровня можно добавить 1–2 подхода в основных упражнениях.', {n:workSets}));
  if(workSets > lim[1]) out.push(TT('Рабочих подходов: {n} — это много для вашего уровня. Следите за восстановлением: сон, питание, без тренировки «через боль».', {n:workSets}));
  const dur = Number(w.duration)||0;
  if(dur > 90) out.push(TT('Тренировка длилась {m} мин. Оптимально 45–75 мин: сократите отдых или число упражнений.', {m:dur}));
  const t = Calc.workoutTonnage(w);
  const prev = DB.workouts.filter(x=>x.participantId===me && x.id!==w.id && x.status==='done' && x.name===w.name).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4).map(x=>Calc.workoutTonnage(x)).filter(x=>x>0);
  if(t>0 && prev.length){ const avg = prev.reduce((a,b)=>a+b,0)/prev.length, d = Math.round((t/avg-1)*100);
    if(d >= 10) out.push(TT('Тоннаж на {p}% выше, чем в прошлые такие тренировки — отличный прогресс! 💪', {p:d}));
    else if(d <= -15) out.push(TT('Тоннаж на {p}% ниже обычного. Бывает — проверьте сон и питание; если повторится 2–3 раза, сделайте лёгкую неделю.', {p:-d})); }
  const groups = Object.keys(Calc.muscleBreakdown(w, DB.exercises)).filter(g=>g!=='other').slice(0,4).map(g=>trn(MG[g]||g));
  if(groups.length) out.push(TT('Следующая тренировка на {g} — не раньше чем через {h} ч: мышцам нужно восстановиться.', {g:groups.join(', '), h: lv==='beginner' ? 72 : 48}));
  if(lv==='beginner') out.push(trn('Новичку важнее техника, чем вес: если движение «плывёт», снизьте вес. Белок — 1,6–2 г на кг веса в день, сон — 7–9 часов.'));
  else out.push(trn('Восстановление: белок 1,6–2 г на кг веса в день, вода и сон 7–9 часов.'));
  return out.slice(0, 6);
}

/* ===================== INIT ===================== */
(async function init(){
  window.__splash && __splash(15);
  const auth = await Auth.login();
  if(!auth) return; // authOverlay уже показывает причину ошибки, дальше не идём
  window.__splash && __splash(45);
  try{
    await Storage.load(auth);
    window.__splash && __splash(85);
  }catch(e){
    document.getElementById('authStatus').textContent = '❌ Не удалось загрузить данные';
    document.getElementById('authLog').style.display='block';
    document.getElementById('authLog').textContent = String(e && e.stack || e);
    return;
  }
  applyTheme();
  initEvents();
  // свернули или закрыли приложение — сразу отправляем несохранённое
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') Storage.flush(); });
  window.addEventListener('pagehide', ()=>Storage.flush());
  rerender();
  loadLinks();
  if(!coach().asked) setTimeout(()=>{ if(!State.modal) openCoachSetup(); }, 1600);
  // заранее и в фоне считаем свои ачивки, чтобы «Статистика» открывалась мгновенно
  const idle = window.requestIdleCallback || (fn=>setTimeout(fn, 1500));
  idle(()=>{ try{ const me = selfParticipantId(); achievementsCard(DB.workouts.filter(w=>w.participantId===me), me); }catch(e){} });
  window.__splash && __splash(100);
  const overlay = document.getElementById('authOverlay');
  if(overlay){ const left = Math.max(450, 1200 - (performance.now() - (window.__splashStart||0)));
    setTimeout(()=>{ overlay.style.transition='opacity .4s'; overlay.style.opacity='0'; setTimeout(()=>overlay.remove(), 400); }, left); }
})();
