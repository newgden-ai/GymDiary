<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ТренДневник</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Permanent+Marker&display=swap" media="print" onload="this.media='all'">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="help/data.js" defer></script>
<script src="i18n.js"></script>
<style>
:root{
  --bg:#f6f5f2; --surface:#ffffff; --surface2:#f0eee8; --border:#e2ded4;
  --text:#1f2320; --text-dim:#6b6f68; --accent:#3d5a45; --accent2:#8a9a5b;
  --danger:#b3503f; --warn:#c08a2e; --radius:10px;
  --shadow:0 1px 2px rgba(0,0,0,.06);
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#181a17; --surface:#20221f; --surface2:#272a25; --border:#33362f;
    --text:#e9e8e2; --text-dim:#9a9d94; --accent:#8fae7d; --accent2:#c7d69a;
  }
}
:root[data-theme="dark"]{
  --bg:#181a17; --surface:#20221f; --surface2:#272a25; --border:#33362f;
  --text:#e9e8e2; --text-dim:#9a9d94; --accent:#8fae7d; --accent2:#c7d69a;
}
*{box-sizing:border-box;}
html,body{height:100%;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:var(--bg-art,none);pointer-events:none;}
.bottomnav{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.4;}
button,input,select,textarea{font-family:inherit;font-size:14px;color:var(--text);}
button{cursor:pointer;}
a{color:var(--accent);}
h1,h2,h3{margin:0 0 8px;font-weight:600;}
.hidden{display:none!important;}
.app{display:flex;min-height:100vh;}
.sidebar{width:210px;flex:0 0 210px;background:var(--surface);border-right:1px solid var(--border);padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto;}
.brand{font-weight:700;font-size:17px;padding:6px 10px 18px;letter-spacing:.2px;}
.navitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius);color:var(--text-dim);cursor:pointer;margin-bottom:2px;background:none;border:none;width:100%;text-align:left;}
.navitem:hover{background:var(--surface2);}
.navitem.active{background:var(--accent);color:var(--on-accent,#fff);}
.main{flex:1;min-width:0;padding:18px 20px 90px;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.btn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 13px;font-weight:500;}
.btn:hover{filter:brightness(0.97);}
.btn.primary{background:var(--accent);color:var(--on-accent,#fff);border-color:var(--accent);}
.btn.danger{background:var(--danger);color:#fff;border-color:var(--danger);}
.btn.ghost{background:transparent;border-color:transparent;}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:6px;}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;background:var(--surface2);border:1px solid var(--border);}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);}
.row{display:flex;gap:8px;align-items:center;}
.grow{flex:1;}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
.field label{font-size:12px;color:var(--text-dim);}
.field input,.field select,.field textarea{padding:8px 9px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);width:100%;}
.field textarea{resize:vertical;min-height:50px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid2>*,.grid3>*{min-width:0;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
/* calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.cal-head{background:var(--surface2);padding:6px;text-align:center;font-size:12px;color:var(--text-dim);}
.cal-cell{background:var(--surface);min-height:92px;padding:5px;cursor:pointer;display:flex;flex-direction:column;gap:3px;}
.cal-cell:hover{background:var(--surface2);}
.cal-cell.other{opacity:.4;}
.cal-cell.today .daynum{background:var(--accent);color:var(--on-accent,#fff);border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;}
.daynum{font-size:12px;font-weight:600;}
.chip{font-size:11px;border-radius:5px;padding:2px 5px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.week-cols{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
.week-col{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:6px;min-height:220px;}
.week-col.today{outline:2px solid var(--accent);}
.week-colhead{font-size:12px;color:var(--text-dim);margin-bottom:6px;text-align:center;}
.agenda-item{background:var(--surface2);border-radius:8px;padding:7px 8px;margin-bottom:6px;cursor:pointer;font-size:12.5px;}
.agenda-item .t{font-weight:600;}
.day-list .agenda-item{font-size:14px;padding:10px;}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:20px 10px;overflow:auto;z-index:50;}
.modal{background:var(--surface);border-radius:14px;max-width:640px;width:100%;padding:18px;margin:10px 0 60px;}
.modal h2{margin-bottom:12px;}
.block-card{border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:10px;background:var(--surface2);}
.ex-card{border:1px dashed var(--border);border-radius:8px;padding:8px;margin:6px 0;background:var(--surface);}
.set-row{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) minmax(0,1.4fr) 32px;gap:6px;align-items:center;margin-bottom:4px;}
.set-row input{padding:6px;min-width:0;width:100%;border:1px solid var(--border);border-radius:6px;background:var(--surface);}
.set-row .btn{padding:5px 0;width:32px;}
.set-row.cardio{grid-template-columns:28px repeat(3,minmax(0,1fr)) minmax(0,1.2fr) 32px;}
.w-actions{position:sticky;bottom:-18px;margin:12px -18px -18px;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--border);border-radius:0 0 14px 14px;z-index:3;}
.big-finish{width:100%;padding:12px;font-size:16px;font-weight:700;}
.w-actions-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.w-actions-row .btn{flex:1 1 auto;}
.bot-status{font-size:12.5px;margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--surface2);}
.drop-add{display:block;margin:-2px 0 4px 34px;padding:0;border:none;background:none;color:var(--warn);font-size:11.5px;font-weight:600;}
.drop-add.rm{margin:0 0 2px;color:var(--text-dim);}
.drops{display:flex;flex-direction:column;gap:3px;margin:-1px 0 5px 34px;padding-left:8px;border-left:2px solid var(--warn);}
.drop-row{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1fr);gap:6px;align-items:center;font-size:12px;color:var(--warn);font-weight:700;}
.drop-row input{padding:5px 6px;min-width:0;width:100%;border:1px solid var(--border);border-radius:6px;background:var(--surface);font-size:16px;}
.set-rec{font-size:11px;color:var(--accent);margin:-2px 0 3px 34px;}
.best-pill{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:color-mix(in srgb,#f5b82e 18%,transparent);color:#c98c00;border:1px solid color-mix(in srgb,#f5b82e 45%,transparent);white-space:nowrap;}
.ss-tag{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:20px;padding:0 5px;border-radius:6px;background:var(--accent);color:var(--on-accent,#fff);font-size:11px;font-weight:800;}
.ss-pair{font-size:12.5px;margin:6px 0 2px;padding:6px 8px;border-radius:8px;background:color-mix(in srgb,var(--accent) 10%,transparent);}
.block-card.superset{border-left:4px solid var(--accent);}
.btn.mv{padding:3px 7px;font-weight:700;}
.btn.mv:disabled{opacity:.3;}
.cardio-quick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;}
.autosave-note{font-size:11px;margin-left:8px;}
.flash{animation:flashbg .7s ease;}
@keyframes flashbg{0%{box-shadow:0 0 0 3px var(--accent);}100%{box-shadow:0 0 0 0 transparent;}}
.ex-card .row,.block-card .row{flex-wrap:wrap;min-width:0;}
.ex-card.dropset{border:1px solid var(--warn);border-left:4px solid var(--warn);}
.drop-badge{background:var(--warn);color:#fff;border-radius:999px;font-size:11px;padding:1px 8px;font-weight:600;}
.ex-admin{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 32px;gap:6px;padding:8px 0;border-bottom:1px solid var(--border);}
.ex-admin input{grid-column:1/-1;}
.ex-admin input,.ex-admin select{min-width:0;width:100%;padding:6px;border:1px solid var(--border);border-radius:6px;background:var(--surface);}
.ex-admin .btn{padding:5px 0;}
.invite-code{font-size:18px;letter-spacing:1px;background:var(--surface2);border:1px dashed var(--border);border-radius:8px;padding:7px 10px;user-select:all;overflow-wrap:anywhere;}
.req-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--border);}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:9px 14px;border-radius:10px;z-index:100;font-size:14px;max-width:90vw;text-align:center;}
.del-link{color:var(--danger);font-size:12px;padding:3px 6px;margin-left:auto;}
.swatches{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.swatch{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
.swatch.on{border-color:var(--text);box-shadow:0 0 0 2px var(--surface) inset;}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;}
.theme-opt{display:flex;flex-direction:column;gap:6px;align-items:flex-start;background:var(--surface);border:2px solid var(--border);border-radius:10px;padding:8px;font-size:13px;text-align:left;}
.theme-opt.on{border-color:var(--accent);}
.theme-prev{position:relative;display:block;width:100%;height:54px;border-radius:7px;overflow:hidden;border:1px solid var(--border);}
.theme-prev i{position:absolute;bottom:7px;width:22px;height:9px;border-radius:4px;}
.theme-prev i:first-child{left:8px;}.theme-prev i:nth-child(2){left:34px;}
.theme-prev b{position:absolute;right:8px;top:8px;width:44%;height:26px;border-radius:5px;box-shadow:0 1px 3px rgba(0,0,0,.12);}
.ico{width:24px;height:24px;flex:0 0 auto;}
:root{--metal-hi:#8b9096;--metal-mid:#5a5f65;--metal-lo:#2c3035;--ico-red:#e3262e;}
.bottomnav button.active .ico,.navitem.active .ico{filter:drop-shadow(0 0 3px rgba(227,38,46,.45));}
.navitem .ico{width:20px;height:20px;}
@font-face{font-family:'GD Brush';src:url(img/fonts/yanone-700.woff) format('woff');font-weight:700;font-display:swap;}
.cal-nav{flex-wrap:nowrap!important;gap:5px;min-width:0;width:100%}.cal-nav .btn{flex:none;padding-left:9px;padding-right:9px}.cal-nav h2{margin:0 0 0 2px;flex:1 1 auto;min-width:0;overflow:hidden;white-space:nowrap;padding:2px 8px 2px 2px}
.cal-title{font-family:'GD Brush',Impact,'Arial Narrow',sans-serif;font-weight:700;color:var(--accent);font-size:28px;line-height:1.05;white-space:nowrap;letter-spacing:.2px;transform:skewX(-14deg) rotate(-3deg);transform-origin:left center;}
.cal-actions{margin:0 0 10px;gap:8px;flex-wrap:wrap;align-items:center}.cal-actions .cal-log{margin-left:auto}
.back-up{margin-bottom:8px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.kpi{background:var(--surface2);border-radius:var(--radius);padding:14px 16px}.kpi-wide{grid-column:1/-1}
.kpi-l{font-size:11.5px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em}
.kpi-n{font-size:30px;font-weight:800;line-height:1.1;margin-top:4px;color:var(--ink,var(--text));font-variant-numeric:tabular-nums;letter-spacing:-.02em}.kpi-n small{font-size:15px;font-weight:700;color:var(--text-dim);margin-left:4px}
.kpi-wide .kpi-n{font-size:34px}
.act-legend{gap:14px;font-size:12.5px;margin-top:4px;flex-wrap:wrap}.act-legend i{display:inline-block;width:12px;height:4px;border-radius:2px;margin-right:5px;vertical-align:middle}
.steps-in{margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}.steps-in select,.steps-in input{padding:9px;border:1px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--text);font-size:15px}
.steps-ask{background:color-mix(in srgb,var(--lw-orange,#f08a24) 9%,transparent);border:none;border-radius:12px;padding:12px}
details.fold{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.fold-sum{list-style:none;cursor:pointer;padding:14px 16px;font-weight:800;font-size:16px;display:flex;justify-content:space-between;align-items:center;color:var(--ink,var(--text))}
.fold-sum::-webkit-details-marker{display:none}.fold-sum::after{content:'›';font-size:22px;color:var(--text-dim);transform:rotate(90deg);transition:transform .2s}
details.fold:not([open]) .fold-sum::after{transform:rotate(0deg)}
.fold-body{padding:0 14px 14px}
.fold-ach .card{border:none;box-shadow:none;padding:0;margin:0!important;background:none}.fold-ach .card>.row:first-child h3{display:none}
#main .topbar select{padding:7px 10px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-weight:600;font-size:13px}
.kring{position:relative;width:190px;height:190px;margin:2px auto 6px}.kring svg{display:block}
.kring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.kring-c b{font-size:38px;font-weight:800;line-height:1;color:var(--ink,var(--text));font-variant-numeric:tabular-nums}.kring-c span{font-size:13px;color:var(--text-dim);font-weight:600;margin-top:4px}
.food-macros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;font-size:13px}
/* ===== фирменный стиль Light Weight (тема «Light Weight») ===== */
[data-brand]{--ink:#1a1e21;--lw-red:#e3262e;--lw-orange:#f08a24;--text:#1f2427;--text-dim:#69726d;--radius:16px;--shadow:0 1px 2px rgba(16,24,20,.04),0 8px 22px -14px rgba(16,24,20,.18);}
[data-brand="dark"]{--ink:#f2f4f3;--text:#e8ebe9;--text-dim:#9aa39e;--shadow:0 8px 22px -14px rgba(0,0,0,.6);}
[data-brand] body{background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
[data-brand] h2,[data-brand] h3{color:var(--ink);letter-spacing:-.01em;}
[data-brand] #main .topbar h2:not(.cal-title){font-size:25px;font-weight:800;}
[data-brand] .card h3{font-size:16px;font-weight:800;margin-top:0;}
[data-brand] .card{border:1px solid var(--border);box-shadow:var(--shadow);}
[data-brand] .grid3>.card,[data-brand] .fg{background:var(--surface2);border-color:transparent;box-shadow:none;}
[data-brand] .grid3>.card>div:last-child{color:var(--ink);font-weight:800!important;font-variant-numeric:tabular-nums;}
[data-brand] .btn{border-radius:12px;font-weight:600;background:var(--surface2);border-color:transparent;color:var(--ink);}
[data-brand] .btn.sm{border-radius:10px;}
[data-brand] .btn.ghost{background:transparent;}
[data-brand] .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#fff);box-shadow:0 8px 16px -10px var(--accent);}
[data-brand] .btn.danger{background:#fdecec;border-color:transparent;color:var(--lw-red);}
[data-brand="dark"] .btn.danger{background:rgba(227,38,46,.16);}
[data-brand] .btn.finish{background:var(--ink);border-color:var(--ink);color:var(--bg);}
[data-brand] .field label{font-weight:600;color:var(--text-dim);}
[data-brand] .field input,[data-brand] .field select,[data-brand] .field textarea,[data-brand] .sf input{background:var(--surface2);border-color:transparent;border-radius:12px;}
[data-brand] .field input:focus,[data-brand] .field select:focus,[data-brand] .field textarea:focus,[data-brand] .sf input:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent);}
[data-brand] .pill{background:var(--surface2);border-color:transparent;font-weight:600;}
[data-brand] .cal-grid{gap:0;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);}
[data-brand] .cal-head{background:var(--surface);font-weight:700;color:var(--text-dim);border-bottom:1px solid var(--border);}
[data-brand] .cal-cell{border-right:1px solid var(--border);border-bottom:1px solid var(--border);}
[data-brand] .cal-cell.other{background:var(--surface2);}
[data-brand] .cal-cell.today{background:color-mix(in srgb,var(--accent) 7%,var(--surface));}
[data-brand] .agenda-item{border-radius:12px;}
[data-brand] .tot-box{background:var(--ink);color:var(--bg);border-radius:16px;}
[data-brand] .tot-box .big{font-size:26px;font-weight:800;}
[data-brand] .set-box{border-radius:14px;border-color:transparent;background:var(--surface2);}
[data-brand] .set-box .sf input{background:var(--surface);}
[data-brand] .block-card{border-radius:16px;}
[data-brand] .subtabs button{border-radius:12px;border-color:transparent;background:var(--surface2);}
[data-brand] .subtabs button.active{background:var(--ink);color:var(--bg);}
[data-brand] .g-card,[data-brand] .g-run{border:none;background:linear-gradient(135deg,var(--surface2),var(--surface));box-shadow:var(--shadow);position:relative;overflow:hidden;}
[data-brand] .g-card::before,[data-brand] .g-run::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--lw-red);}
[data-brand] .rest-bar{background:var(--ink);color:var(--bg);}
[data-brand] .g-rest-num{color:var(--ink);}
[data-brand] .cal-title{color:var(--lw-red);}
[data-brand] .ach-chip.on{box-shadow:0 0 0 2px var(--lw-red) inset;}
@media (max-width:860px){
  [data-brand] .bottomnav{background:color-mix(in srgb,var(--surface) 92%,transparent);border-top:1px solid var(--border);}
  [data-brand] .bottomnav button{font-weight:600;}
  [data-brand] .bottomnav button .bnicon{display:inline-flex;align-items:center;justify-content:center;width:46px;height:28px;border-radius:14px;transition:background .2s;}
  [data-brand] .bottomnav button.active{color:var(--ink);}
  [data-brand] .bottomnav button.active .bnicon{background:var(--surface2);}
}
.fg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.fg{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;background:var(--surface2);border-left:4px solid var(--border)}
.fg-n{font-size:13px;color:var(--text-dim)}.fg-d{font-size:16px;color:var(--text)}
.fg-ok{border-left-color:#2e9d5b}.fg-mid{border-left-color:#f08a24}.fg-late{border-left-color:#e3262e}.fg-none{border-left-color:var(--border)}
.overlay.g-overlay{inset:0;bottom:0;padding:calc(8px + env(safe-area-inset-top,0px)) 8px calc(8px + env(safe-area-inset-bottom,0px));align-items:stretch;background:var(--bg);z-index:80;overflow:hidden}
.g-modal{margin:0 auto;border-radius:20px;height:100%;max-width:640px;padding:10px 14px 12px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px -12px rgba(0,0,0,.45);border:1px solid var(--border)}
.g-body{flex:1;min-height:0;display:flex;flex-direction:column}
.g-scroll{flex:1;min-height:0;overflow:auto}
.g-head2{display:flex;justify-content:space-between;align-items:center;gap:6px;min-height:30px}
.g-figbox{flex:1 1 0;min-height:70px;display:flex;align-items:center;justify-content:center;margin:4px 0}
.g-figbox.g-nofig{flex:0.2 1 0;min-height:0}
.g-figbox .g-fig{max-height:100%;margin:0}
.g-why{font-size:12px;color:var(--muted);margin-bottom:4px;line-height:1.3}.g-why a{color:var(--accent)}
.g-done{font-size:12.5px;font-weight:500}
.g-sw{display:flex;align-items:center;justify-content:center;gap:12px;margin:4px 0}.g-sw-num{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.g-actions{display:flex;flex-direction:column;gap:4px;align-items:stretch}.g-actions .btn.sm{align-self:center}
.g-skip{display:block;margin:0 auto;width:84px;height:84px;border-radius:50%;border:none;background:var(--accent);color:var(--on-accent,#fff);font-size:30px;box-shadow:0 8px 20px -8px var(--accent)}
.g-skip-l{text-align:center;margin:6px 0 10px;font-weight:600}
.g-explain ol{padding-left:20px}.g-explain li{margin:8px 0;line-height:1.4}
.g-run{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;border:1.5px solid var(--accent)}
.w-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.w-head-l{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.w-x{padding:2px 8px;margin:-4px 0 2px -6px;font-size:18px}
.w-head-l h2{font-size:20px}
.w-play{display:flex;align-items:center;gap:8px;flex:none;font-size:15px;font-weight:700;white-space:nowrap;text-align:left;line-height:1.2;padding:8px 12px}
.w-play-ico{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.22);font-size:13px;flex:none}
.w-times{font-size:12.5px;margin-top:6px}
.w-lock{white-space:normal!important;font-size:12.5px!important;max-width:52%;line-height:1.25;background:var(--surface2);color:var(--text-dim)}.w-lock small{font-weight:600}.w-lock .w-play-ico{background:transparent}
.w-actions-3{flex-wrap:nowrap}.w-actions-3 .w-ico{flex:0 0 46px!important;padding:8px 0;font-size:17px}.w-actions-3 .w-close{flex:1 1 auto}
.play-btn{min-width:38px;font-size:13px}
ul.advice{padding-left:18px;margin:6px 0}ul.advice li{margin:5px 0;line-height:1.35}
.g-top{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:0 -6px 10px}.g-title{flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-warn{background:rgba(227,38,46,.1);border:1px solid rgba(227,38,46,.35);border-radius:12px;padding:12px;margin-bottom:12px}
.g-list{padding-left:20px}.g-list li{margin:8px 0}.g-step{font-size:13px}.g-name{margin:2px 0;font-size:20px;line-height:1.2}
.g-fig{display:block;width:100%;height:100%;object-fit:contain;background:var(--surface2);border-radius:12px}
.g-set{font-size:18px;font-weight:800;margin:4px 0 2px}.g-task{font-size:14.5px;margin-bottom:4px;line-height:1.35}
.g-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:6px 0 8px;align-items:end}.g-form input{font-size:20px;padding:9px;font-weight:700}
.g-go{background:#1faa59;color:#fff;text-align:center;font-weight:800;font-size:20px;border-radius:12px;padding:10px;margin-bottom:10px;animation:gpulse .5s ease 2 alternate}@keyframes gpulse{to{transform:scale(1.04)}}
.g-rest{text-align:center;padding:20px 0;flex:1}.g-rest-num{font-size:64px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent);margin:6px 0 12px}
.g-big{font-size:24px;font-weight:800;text-align:center;margin:20px 0 6px}
.g-alt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px;margin-bottom:6px;border:1px solid var(--border);border-radius:12px;background:var(--surface);flex-wrap:wrap}
.g-alt b{width:100%}.g-alt b + .muted{width:100%;font-size:12.5px}
.g-card{margin-bottom:10px;border:1.5px solid var(--accent)}.g-card .big-finish{margin-top:6px;width:100%}
.rest-bar{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:150;background:var(--accent);color:var(--on-accent,#fff);border-radius:14px;padding:8px 10px 8px 16px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px -6px rgba(0,0,0,.5);font-weight:600;}
.rest-bar b{font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.rest-bar button{border:none;background:rgba(255,255,255,.22);color:inherit;border-radius:9px;padding:6px 9px;font-weight:700}
.rest-bar.go{background:#1faa59;animation:restgo .5s ease 2 alternate}@keyframes restgo{to{transform:translateX(-50%) scale(1.08)}}
.ach-ico{display:inline-flex;align-items:center;justify-content:center;}
.ach-ico .ico{width:26px;height:26px;}
.medals{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
.medal{min-width:30px;height:30px;padding:0 5px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:2px dashed var(--border);color:var(--text-dim);}
.medal.got{border:2px solid var(--accent2);background:var(--accent);color:var(--on-accent,#fff);}
.help-btn{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font:italic 700 13px Georgia,serif;display:inline-flex;align-items:center;justify-content:center;padding:0;flex:0 0 auto;}
.help-row{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);cursor:pointer;}
.help-row:last-child{border-bottom:none;}
.help-imgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:8px 0;}
.help-imgs img{width:100%;border-radius:8px;background:#fff;border:1px solid var(--border);}
.help-imgs.small{grid-template-columns:repeat(2,minmax(0,110px));}
.link-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;}
.link-card{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px;}
.help-imgs img{cursor:zoom-in;}
.help-note p{margin:0 0 6px;line-height:1.5;}
.zoom-box{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:200;display:flex;}
.zoom-scroll{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;-webkit-overflow-scrolling:touch;}
.zoom-box img{max-width:100%;max-height:100%;cursor:zoom-in;background:#fff;}
.zoom-box.zoomed .zoom-scroll{display:block;}
.zoom-box.zoomed img{max-width:none;max-height:none;width:250%;cursor:zoom-out;}
.zoom-close{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:2;width:38px;height:38px;border-radius:50%;border:none;background:rgba(255,255,255,.18);color:#fff;font-size:18px;}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:10px;max-height:420px;overflow:auto;padding-right:2px;}
.ach-tile{background:radial-gradient(circle at 50% 30%,#2a2a2e 0,#121214 70%);border:1px solid #2c2c30;border-radius:12px;padding:10px 6px 8px;text-align:center;color:#e9e9ea;display:flex;flex-direction:column;align-items:center;gap:3px;}
.ach-emo{font-size:34px;line-height:44px;height:44px;filter:grayscale(1) brightness(.9);opacity:.35;}
.ach-tile.got .ach-emo{filter:drop-shadow(0 0 8px color-mix(in srgb,var(--ach) 70%,transparent));opacity:1;}
.ach-tile.rare{background:radial-gradient(circle at 50% 30%,#2f2640 0,#131018 70%);}
.ach-tile.rare.got{border-color:#b388ff;box-shadow:0 0 16px -4px #b388ff inset, 0 0 10px -4px #b388ff;}
.ach-tile{position:relative;}
.ach-x{position:absolute;top:6px;right:7px;font-size:11px;font-weight:800;color:#121214;background:var(--ach);border-radius:999px;padding:1px 6px;}
.ach-tag{font-size:10px;line-height:1.25;color:#b9b9c0;font-style:italic;}
.ach-badge{width:100%;aspect-ratio:1;object-fit:contain;filter:grayscale(1) brightness(.55);opacity:.55;}
.ach-tile.got .ach-badge{filter:drop-shadow(0 0 10px color-mix(in srgb,var(--ach) 60%,transparent));opacity:1;}
.ach-tile.has-badge{padding:4px 4px 8px;}
.lw-poster{width:100%;aspect-ratio:2/3;border-radius:8px;overflow:hidden;border:2px solid #555;filter:grayscale(1) brightness(.5);}
.ach-tile.got .lw-poster{filter:none;border-color:#e3262e;box-shadow:0 0 10px rgba(227,38,46,.55);}
.lw-poster img{width:100%;height:100%;object-fit:cover;display:block;}
.wr-card{position:relative;width:100%;aspect-ratio:2/3;border-radius:8px;overflow:hidden;border:2px solid #444;filter:grayscale(1) brightness(.5);}
.ach-tile.got .wr-card{filter:none;border-color:#6a6a70;}
.wr-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 0;transform:scale(1.5);transform-origin:50% 0;filter:brightness(.45) saturate(.8);}
.wr-card img.wr-lw{position:absolute;left:8%;top:22%;width:84%;height:auto;inset:auto;transform:none;object-fit:contain;filter:drop-shadow(0 2px 3px #000);}
.wr-kg{position:absolute;left:0;right:0;bottom:22%;text-align:center;font:800 17px Impact,'Arial Black',sans-serif;color:#fff;text-shadow:0 2px 4px #000;}
.wr-pct{position:absolute;left:4px;right:4px;bottom:8%;text-align:center;font-size:9.5px;font-weight:800;letter-spacing:.04em;color:var(--wr);text-shadow:0 1px 2px #000;text-transform:uppercase;}
.lw-show{margin:12px 0 4px;padding:10px 8px;border-radius:14px;background:radial-gradient(ellipse at 50% 0,rgba(227,38,46,.25),transparent 70%),#111114;text-align:center;}
.lw-show-title{width:150px;display:block;margin:0 auto 6px;filter:drop-shadow(0 2px 4px #000);}
.lw-show-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;}
.lw-show-row .ach-tile{width:104px;flex:0 0 104px;}
.lw-show.empty{padding:14px;}
/* тоннаж по периодам: одна и та же картинка, разный металл */
.ach-tile.got.ach-tday .ach-badge{filter:grayscale(1) sepia(.2) hue-rotate(170deg) saturate(.6) brightness(1.2) contrast(1.1) drop-shadow(0 0 8px rgba(220,235,255,.5));}
.ach-tile.got.ach-tweek .ach-badge{filter:grayscale(1) sepia(1) saturate(2.6) hue-rotate(-6deg) brightness(1.05) contrast(1.1) drop-shadow(0 0 8px rgba(245,197,66,.55));}
.ach-tile.got.ach-tmonth .ach-badge{filter:grayscale(1) brightness(1.12) contrast(1.15) drop-shadow(0 0 8px rgba(210,215,225,.45));}
.ach-tile.got.ach-tquarter .ach-badge{filter:grayscale(1) sepia(1) saturate(1.4) hue-rotate(-20deg) brightness(.82) contrast(1.15) drop-shadow(0 0 8px rgba(192,133,72,.5));}
.tier-medal{position:relative;width:100%;aspect-ratio:1;filter:grayscale(1) brightness(.55);opacity:.6;}
.ach-tile.got .tier-medal{filter:drop-shadow(0 0 10px color-mix(in srgb,var(--ach) 60%,transparent));opacity:1;}
.tier-medal img{position:absolute;inset:0;width:100%;height:100%;}
.tier-medal .tier-ico{left:15.5%;top:5.5%;width:69%;height:69%;}
.tier-txt{position:absolute;left:12%;right:12%;top:72.5%;height:19%;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.05;
  font-weight:800;text-transform:uppercase;color:#f3d9a4;text-shadow:0 1px 0 #000,0 0 4px #000;overflow:hidden;overflow-wrap:anywhere;letter-spacing:-.2px;}
/* «Зоопарк» — рельефная однотонная медаль (как иллюстрированные значки): тон задаётся --ach / --hue */
.ach-tile.ach-zoo:not(.has-badge){border-radius:50% 50% 16px 16px / 38% 38% 16px 16px;border:3px solid color-mix(in srgb,var(--ach) 70%,#000);
  background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--ach) 55%,#1a1a1a) 0,color-mix(in srgb,var(--ach) 22%,#0e0e0e) 75%);
  box-shadow:inset 0 2px 2px rgba(255,255,255,.18),inset 0 -3px 6px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.4);}
.ach-tile.ach-zoo:not(.has-badge) .ach-emo{font-size:40px;opacity:.4;
  filter:grayscale(1) sepia(1) hue-rotate(calc(var(--hue,30deg) - 35deg)) saturate(.7) brightness(.85) contrast(1.15) drop-shadow(-1px -1px 0 rgba(255,255,255,.35)) drop-shadow(1px 2px 1px rgba(0,0,0,.85));}
.ach-tile.ach-zoo.got:not(.has-badge) .ach-emo{opacity:1;}
.ach-tile.ach-zoo .ach-t{font-family:Impact,'Arial Black',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.3px;font-size:12px;
  color:color-mix(in srgb,var(--ach) 55%,#fff);text-shadow:0 1px 0 rgba(0,0,0,.9),0 -1px 0 rgba(255,255,255,.15);}
.ach-tile.ach-zoo .ach-tag{color:color-mix(in srgb,var(--ach) 40%,#ddd);}
.ach-tile.ach-zoo:not(.got){filter:saturate(.35) brightness(.8);}
/* «Как техника» — стальная плита, заклёпки, опасная полоса */
.ach-tile.ach-machine{border-radius:6px;border:2px solid #3a3a3e;background:
  repeating-linear-gradient(135deg,#f5b82e 0 8px,#141414 8px 16px) top/100% 7px no-repeat,
  radial-gradient(circle at 7px 16px,#8d8d92 0 2px,transparent 3px),radial-gradient(circle at calc(100% - 7px) 16px,#8d8d92 0 2px,transparent 3px),
  radial-gradient(circle at 7px calc(100% - 7px),#8d8d92 0 2px,transparent 3px),radial-gradient(circle at calc(100% - 7px) calc(100% - 7px),#8d8d92 0 2px,transparent 3px),
  linear-gradient(180deg,#2e2f33,#18191b);padding-top:14px;}
.ach-tile.ach-machine .ach-t{font-family:Impact,'Arial Black','Oswald',sans-serif;text-transform:uppercase;letter-spacing:.3px;font-weight:400;font-size:12px;color:#f5f5f5;}
.ach-tile.ach-machine .ach-tag{font-style:normal;text-transform:uppercase;font-size:9px;letter-spacing:.4px;color:#f5b82e;}
.ach-tile.ach-machine.got{border-color:#f5b82e;box-shadow:0 0 14px -6px #f5b82e inset;}
.result-modal .ach-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));}
/* герои: портрет в медали. relief — рельефная бронза с ободком, mono — однотонная гравировка */
.hero-medal{width:74px;height:74px;border-radius:50%;padding:5px;margin:2px auto 4px;}
.hero-medal img{width:100%;height:100%;border-radius:50%;display:block;}
.hero-medal.relief{background:radial-gradient(circle at 35% 30%,#f3d08a,#a8782e 45%,#5a3b12 100%);box-shadow:inset 0 2px 3px rgba(255,255,255,.5),inset 0 -3px 5px rgba(0,0,0,.6),0 3px 8px rgba(0,0,0,.6);}
.hero-medal.relief img{filter:grayscale(1) sepia(1) saturate(1.4) hue-rotate(-8deg) contrast(1.35) brightness(.95);box-shadow:inset 0 0 8px rgba(0,0,0,.8);}
.hero-medal.mono{background:#3b3d42;border:2px solid #6c6f76;box-shadow:inset 0 0 0 3px #26272b;}
.hero-medal.mono img{filter:grayscale(1) contrast(1.6) brightness(1.05);mix-blend-mode:luminosity;opacity:.9;}
.ach-tile.ach-hero:not(.got) .hero-medal{filter:grayscale(1) brightness(.5);}
.ach-tile.ach-hero .ach-t{font-family:Impact,'Arial Black',sans-serif;font-weight:400;text-transform:uppercase;font-size:11px;letter-spacing:.2px;overflow-wrap:normal;word-break:normal;hyphens:auto;}
.subtabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;}
.subtabs button{flex:1;min-width:max-content;padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text-dim);font-weight:600;}
.subtabs button.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.fbar{height:10px;border-radius:6px;background:var(--surface2);overflow:hidden;border:1px solid var(--border);}
.fbar>i{display:block;height:100%;background:var(--accent);border-radius:6px;}
.fbar.over>i{background:var(--danger);}
.food-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--border);}
.food-item:first-of-type{border-top:none;}
.food-pick{display:block;width:100%;text-align:left;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);margin-bottom:6px;color:inherit;}
.bw-medal{width:64px;height:64px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;
  background:radial-gradient(circle at 35% 30%,#f1f3f5,#aeb6bf 45%,#6e7781 80%,#4c535b);box-shadow:inset 0 2px 3px rgba(255,255,255,.7),inset 0 -3px 5px rgba(0,0,0,.45),0 2px 5px rgba(0,0,0,.5);color:#23272c;text-shadow:0 1px 0 rgba(255,255,255,.55);}
.ach-tile:not(.got) .bw-medal{filter:grayscale(1) brightness(.55);}
.bw-medal span{font-size:15px;}.bw-medal b{font-size:17px;}.bw-medal i{font-style:normal;font-size:9.5px;font-weight:700;}
.bw-lad{border:1px solid var(--border);border-radius:10px;padding:8px 10px;margin-bottom:8px;background:var(--surface2);}
.bw-lad summary{display:flex;justify-content:space-between;cursor:pointer;list-style:none;}
.bw-row{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:12px;}
.bw-kg{width:58px;flex:0 0 58px;color:var(--text-dim);}
.bw-cells{flex:1;display:flex;gap:2px;min-width:0;}
.bw-cells i{flex:1;height:12px;border-radius:3px;background:var(--border);}
.bw-cells i.on{background:#9fb4c7;box-shadow:inset 0 1px 0 rgba(255,255,255,.5);}
.bw-best{width:28px;text-align:right;font-weight:700;}
.year-card{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--surface2);}
.year-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:8px;}
.ach-chips{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none;}
.ach-chip{flex:0 0 auto;border:1px solid var(--border);background:var(--surface2);border-radius:999px;padding:5px 10px;font-size:12.5px;white-space:nowrap;}
.ach-chip b{color:var(--ach);filter:brightness(.8);}
.ach-chip.on{background:#141416;color:#fff;border-color:var(--ach);}
.ach-chip.on b{filter:none;}
.ach-tile.got{border-color:color-mix(in srgb,var(--ach) 55%,#121214);box-shadow:0 0 14px -6px var(--ach) inset;}

.ach-t{font-size:12px;font-weight:700;line-height:1.2;overflow-wrap:anywhere;hyphens:auto;max-width:100%;}
.ach-d{font-size:10.5px;color:#9a9aa0;line-height:1.2;}
.ach-ok{font-size:10px;color:var(--ach);font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
.ach-bar{width:80%;height:4px;background:#2c2c30;border-radius:3px;overflow:hidden;margin-top:2px;}
.ach-bar i{display:block;height:100%;background:var(--ach);}
.chip.planned{opacity:.55;outline:1.5px dashed rgba(255,255,255,.8);outline-offset:-2px;}
.agenda-item.planned{opacity:.7;border-style:dashed;}
.btn.finish{background:#2e7d4f;color:#fff;border-color:#2e7d4f;}
.st-done{background:#2e7d4f;color:#fff;border-color:#2e7d4f;}
.st-plan{border-style:dashed;}
.act-tag{font-size:10px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.base-group{margin-bottom:8px;border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:0 10px;}
.base-group summary{padding:11px 0;cursor:pointer;font-weight:600;}
.base-group[open] summary{border-bottom:1px solid var(--border);margin-bottom:10px;}
.transfer-code{font:700 26px/1.2 ui-monospace,Menlo,monospace;letter-spacing:3px;text-align:center;padding:10px;border:2px dashed var(--accent);border-radius:10px;margin:8px 0;}
details.ex-list>summary{cursor:pointer;list-style:none;}
details.ex-list>summary::before{content:'▸ ';color:var(--muted);}
details.ex-list[open]>summary::before{content:'▾ ';}
.mg-table th,.mg-table td{white-space:nowrap;}
.cert-row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border);}
.cb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;}
.cb-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px;border:2px solid var(--border);border-radius:8px;background:var(--surface);font-size:11px;line-height:1.2;color:inherit;cursor:pointer;}
.cb-item img{width:56px;height:56px;object-fit:contain;}
.cb-item.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent);}
.cb-add b{font-size:28px;line-height:56px;height:56px;}
.cb-item{position:relative;}
.cb-check{position:absolute;top:3px;right:5px;font-style:normal;font-weight:800;color:var(--accent);}

window.__splashStart = performance.now();
// экран загрузки: своя картинка на каждый день недели (img/splash/1.jpg — понедельник … 7.jpg — воскресенье);
// низ экрана — цвет нижнего края картинки, надпись LIGHT WEIGHT окрашивается по мере загрузки
(function(){ var n=((new Date().getDay()+6)%7)+1, el=document.getElementById('authOverlay');
  var BG=["#02060d","#0a060f","#0f0d06","#2d3433","#040b03","#56709d","#012540"], bg=BG[n-1];
  el.style.backgroundImage='url(img/splash/'+n+'.jpg)'; el.style.backgroundColor=bg;
  document.getElementById('splashFade').style.background='linear-gradient(rgba(0,0,0,0),'+bg+' 45%)';
  var fill=document.getElementById('splashLWfill'), shown=0, target=5;
  function draw(){ var v='inset(0 '+(100-shown).toFixed(1)+'% 0 0)'; fill.style.clipPath=v; fill.style.webkitClipPath=v; }
  // этапы загрузки двигают цель; между ними надпись сама медленно окрашивается, но не дальше следующего этапа
  window.__splash=function(p){ target=Math.max(target,p); };
  (function tick(){ if(!document.getElementById('splashLWfill')) return;
    var cap=target>=100?100:Math.min(95,target+12); if(shown<target) shown+=Math.max(.6,(target-shown)*.18); else if(shown<cap) shown+=.15;
    shown=Math.min(shown,cap); draw(); requestAnimationFrame(tick); })();
})();
</script>

    try{ tg.disableVerticalSwipes && tg.disableVerticalSwipes(); }catch(e){}
    // кнопка «Назад» Telegram закрывает открытое окно (данные уже сохранены), а не всё приложение
    try{ tg.BackButton && tg.BackButton.onClick(()=>{ goBack(); }); }catch(e){} // свайп вниз не сворачивает приложение и не сдвигает меню

    setStatus('Проверяем вход…');
    let res, payload;
    try{
      res = await fetch(SUPABASE_URL + '/functions/v1/telegram-auth', {
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
        },
        body: JSON.stringify({initData: tg.initData})
      });
      payload = await res.json();
    }catch(e){ setStatus('❌ Нет связи с сервером входа'); log(String(e)); return null; }

    if(!res.ok || payload.error){
      setStatus('Ошибка входа: '+(payload.error||res.status));
      log('HTTP: ' + res.status);
      log('Ответ сервера: ' + JSON.stringify(payload));
      log('URL: ' + SUPABASE_URL + '/functions/v1/telegram-auth');
      return null;
    }

    const { data, error } = await client.auth.verifyOtp({ email: payload.email, token: payload.otp, type:'email' });
    if(error){
  setStatus('❌ Не удалось войти: '+error.message);
  log('VERIFY OTP ERROR: ' + JSON.stringify(error, Object.getOwnPropertyNames(error), 2));
  return null;
}

    session = data.session;
    setStatus('Загружаем данные…');
    return { client, userId: data.user.id };
  }
  function getClient(){ return client; }
  function getToken(){ return session && session.access_token; }
  // свежий токен: сессия живёт час, supabase-js продлевает её сам — берём актуальную
  async function freshToken(){ try{ const {data} = await client.auth.getSession(); if(data && data.session) session = data.session; }catch(e){} return session && session.access_token; }
  return { login, getClient, getToken, freshToken };
})();

/* ===================== STORAGE MODULE (Supabase, с diff-синхронизацией) ===================== */
const Storage = (function(){
  let selfId = null;
  // снимок последнего состояния, отправленного на сервер — по нему считаем, что изменилось
  let snapshot = { workouts:[], templates:[], exercises:[], profile:null };

  function rowsToDiff(current, previous, keyField){
    const prevMap = new Map(previous.map(r=>[r[keyField], JSON.stringify(r)]));
    const curMap = new Map(current.map(r=>[r[keyField], r]));
    const upserts = [];
    for(const [id,row] of curMap){
      const prevJson = prevMap.get(id);
      const curJson = JSON.stringify(row);
      if(prevJson === undefined || prevJson !== curJson) upserts.push(row);
    }
    const deletes = [];
    for(const [id] of prevMap){ if(!curMap.has(id)) deletes.push(id); }
    return { upserts, deletes };
  }

  function workoutToDb(w){
    return {
      id:w.id, participant_id:w.participantId, created_by:w.createdBy||selfId, date:w.date,
      time:w.time||null, duration:w.duration?Number(w.duration):null, name:w.name||null,
      type:w.type, blocks:w.blocks||[], notes:w.notes||null, result:w.result||null,
      recurring_group_id:w.recurringId||null, status:w.status||'planned',
      ...(w.bodyWeight!==''&&w.bodyWeight!=null ? {body_weight:Number(w.bodyWeight)} : {}),
      ...(w.shared!==undefined && w.shared!==null ? {shared:!!w.shared} : {}),
      ...(w.startedAt ? {started_at:w.startedAt} : {}), ...(w.finishedAt ? {finished_at:w.finishedAt} : {})
    };
  }
  function workoutFromDb(r){
    return { id:r.id, date:r.date, time:r.time||'', duration:r.duration||'', name:r.name||'',
      participantId:r.participant_id, createdBy:r.created_by, type:r.type, blocks:r.blocks||[], notes:r.notes||'',
      result:r.result||'', recurringId:r.recurring_group_id||null, status:r.status||'planned', bodyWeight:r.body_weight??'', shared:r.shared??undefined, startedAt:r.started_at||undefined, finishedAt:r.finished_at||undefined };
  }
  function templateToDb(t){ return { id:t.id, owner_id:(t.ownerId===undefined?selfId:t.ownerId), name:t.name, blocks:t.blocks||[], is_public:!!t.isPublic, author_name:t.authorName||null }; }
  function templateFromDb(r){ return { id:r.id, name:r.name, blocks:r.blocks||[], ownerId:r.owner_id, isPublic:!!r.is_public, authorName:r.author_name||'' }; }
  function exerciseToDb(e){ return { id:e.id, owner_id:(e.ownerId===undefined?selfId:e.ownerId), name:e.name, main_group:e.mainGroup, secondary_groups:e.secondaryGroups||[], type:e.type, image_url:e.imageUrl||null, ...(e.bodyweight!==undefined && e.bodyweight!==null ? {bodyweight:!!e.bodyweight} : {}) }; }
  function exerciseFromDb(r){ return { id:r.id, name:r.name, mainGroup:r.main_group, secondaryGroups:r.secondary_groups||[], type:r.type, imageUrl:r.image_url||null, ownerId:r.owner_id, bodyweight:r.bodyweight??null }; }

  async function load(auth){
    selfId = auth.userId;
    const client = auth.client;

    const [{data:profile}, {data:exRows}, {data:tplRows}] = await Promise.all([
      client.from('profiles').select('*').eq('id', selfId).single(),
      client.from('exercises').select('*').or(`owner_id.is.null,owner_id.eq.${selfId}`),
      client.from('templates').select('*').or(`owner_id.eq.${selfId},is_public.eq.true,owner_id.is.null`)
    ]);
    // язык: выбран на этом устройстве → сохраняем в профиль (по нему пишет бот); не выбран → берём из профиля
    if(profile){ if(!I18N.chosen && profile.lang && profile.lang!==I18N.lang) I18N.set(profile.lang, true);
      else if(profile.lang!==I18N.lang) client.from('profiles').update({lang:I18N.lang}).eq('id', selfId).then(()=>{}, ()=>{}); }
    window.addEventListener('gd-lang', e=>{ client.from('profiles').update({lang:e.detail}).eq('id', selfId).then(()=>{}, ()=>{}); });
    const social = await fetchSocial(client, profile);
    const wRows = social.wRows;

    const exercises = (exRows||[]).map(exerciseFromDb);
    const templates = (tplRows||[]).map(templateFromDb);
    const workouts = (wRows||[]).map(workoutFromDb);

    // пишем сразу в глобальный DB (а не в приватную копию), чтобы Storage и приложение
    // всегда смотрели на один и тот же объект — иначе DB.x = DB.x.filter(...) в коде
    // приложения перестаёт быть видно модулю Storage
    Object.assign(DB, {
      participants: social.participants,
      friends: social.friends, trainerLinks: social.links,
      details: social.details, weights: social.weights, activity: social.activity, certs: social.certs,
      me: { role: profile?.role || 'user', inviteCode: profile?.invite_code || '' },
      exercises, templates, workouts,
      settings: {
        units: profile?.units || 'kg',
        theme: profile?.theme || 'auto',
        themeColor: profile?.theme_color || 'forest',
        restDefault: profile?.rest_default ?? 120
      },
      coach: profile?.coach || null
    });
    snapshot = {
      workouts: JSON.parse(JSON.stringify((wRows||[]).map(r=>workoutToDb(workoutFromDb(r))))),
      templates: JSON.parse(JSON.stringify((tplRows||[]).filter(r=>profile?.role==='admin' || r.owner_id===selfId).map(r=>templateToDb(templateFromDb(r))))),
      exercises: JSON.parse(JSON.stringify((exRows||[]).filter(r=>profile?.role==='admin' || r.owner_id===selfId))),
      profile: profile ? JSON.parse(JSON.stringify(profile)) : null
    };
    return DB;
  }

  // участники: я + принятые друзья; тренировки: мои + подопечных (где я активный тренер)
  async function fetchSocial(client, profile){
    const since = dstr(new Date(Date.now()-120*86400000));
    const res = await Promise.all([
      client.rpc('my_friends'),
      client.from('trainer_links').select('*'),
      client.from('profile_details').select('*'),          // RLS: свои + тех, кто разрешил показывать
      client.from('body_weights').select('*').order('date'),
      client.from('daily_activity').select('*').gte('date', since),
      client.from('user_achievements').select('*').not('competition_name','is',null).order('competition_date',{ascending:false})
    ]);
    const [{data:friends}, {data:links}, {data:details}, {data:weights}, {data:activity}, {data:certs}] = res;
    // ошибки загрузки не прячем — иначе раздел просто выглядит пустым
    const errs = res.map((r,i)=>r.error?['участники','тренеры','личные данные','вес','активность','сертификаты'][i]+': '+r.error.message:null).filter(Boolean);
    if(errs.length) setTimeout(()=>toast('Ошибка загрузки — '+errs.join('; ')), 800);
    const traineeIds = (links||[]).filter(l=>l.trainer_id===selfId && l.active).map(l=>l.trainee_id);
    const {data:wRows} = await client.from('workouts').select('*').in('participant_id', [selfId, ...traineeIds]);
    const self = (DB.participants[0] && DB.participants[0].id===selfId) ? DB.participants[0]
      : { id: selfId, name: profile?.name || 'Я', color: profile?.color || '#3d5a45' };
    // подопечным тренер выбирает свой цвет; пока не выбран — берём незанятый из палитры
    const used = new Set([self.color, ...(links||[]).map(l=>l.color).filter(Boolean)]);
    const autoColor = () => PALETTE.find(c=>!used.has(c) && used.add(c)) || '#888';
    const participants = [self, ...(friends||[]).filter(f=>f.status==='accepted').map(f=>{
      const tl = (links||[]).find(l=>l.trainer_id===selfId && l.trainee_id===f.other_id && l.active);
      return {id:f.other_id, name:f.name, color: tl ? (tl.color || autoColor()) : (f.color||'#888')};
    })];
    return { friends: friends||[], links: links||[], wRows: wRows||[], participants, details: details||[], weights: weights||[], activity: activity||[], certs: certs||[] };
  }
  // перечитать участников/заявки/тренировки после действий в разделе «Участники»
  async function reloadSocial(){
    const client = Auth.getClient(); if(!client) return;
    clearTimeout(saveTimer); await syncAll();
    const social = await fetchSocial(client, null);
    Object.assign(DB, { participants: social.participants, friends: social.friends, trainerLinks: social.links,
      details: social.details, weights: social.weights, activity: social.activity, certs: social.certs,
      workouts: social.wRows.map(workoutFromDb) });
    snapshot.workouts = JSON.parse(JSON.stringify(social.wRows.map(r=>workoutToDb(workoutFromDb(r)))));
  }

  let saveTimer = null;
  function save(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(syncAll, 500);
  }

  async function syncAll(){
    const client = Auth.getClient();
    if(!client) return;
    try{
      const wDb = DB.workouts.map(workoutToDb);
      const wDiff = rowsToDiff(wDb, snapshot.workouts, 'id');
      // ошибку не глотаем: снимок не обновится, и следующая попытка отправит изменения снова
      const must = r => { if(r && r.error) throw r.error; };
      // пишем только то, что можно: свои тренировки и подопечных; существующие — обновляем, новые — добавляем
      const writable = pid => pid===selfId || (DB.trainerLinks||[]).some(l=>l.trainer_id===selfId && l.trainee_id===pid && l.active);
      const known = new Set(snapshot.workouts.map(r=>r.id));
      const ups = wDiff.upserts.filter(r=>writable(r.participant_id));
      const ins = ups.filter(r=>!known.has(r.id)), upd = ups.filter(r=>known.has(r.id));
      if(ins.length){ const res = await client.from('workouts').insert(ins);
        // строка уже есть на сервере (создана на другом устройстве) — обновляем по одной
        if(res.error && res.error.code==='23505') for(const row of ins){
          const one = await client.from('workouts').insert(row);
          if(one.error && one.error.code==='23505'){ const {id, ...rest} = row; must(await client.from('workouts').update(rest).eq('id', id)); } else must(one); }
        else must(res); }
      for(const row of upd){ const {id, ...rest} = row; must(await client.from('workouts').update(rest).eq('id', id)); }
      const dels = wDiff.deletes.filter(id=>{ const r0 = snapshot.workouts.find(x=>x.id===id); return !r0 || writable(r0.participant_id); });
      if(dels.length) must(await client.from('workouts').delete().in('id', dels));

      // свои шаблоны синхронизируем; чужие общие — только чтение (админ может править все)
      const tDb = DB.templates.filter(t=>isAdmin() || t.ownerId===undefined || t.ownerId===selfId).map(templateToDb);
      const tDiff = rowsToDiff(tDb, snapshot.templates, 'id');
      if(tDiff.upserts.length) await client.from('templates').upsert(tDiff.upserts);
      if(tDiff.deletes.length) await client.from('templates').delete().in('id', tDiff.deletes);

      // обычный пользователь синхронизирует только свои упражнения; админ — все (в т.ч. общие)
      const ownExDb = DB.exercises.filter(e=>isAdmin() || e.ownerId===selfId).map(exerciseToDb);
      const eDiff = rowsToDiff(ownExDb, snapshot.exercises, 'id');
      if(eDiff.upserts.length) await client.from('exercises').upsert(eDiff.upserts);
      if(eDiff.deletes.length) await client.from('exercises').delete().in('id', eDiff.deletes);

      const self = DB.participants[0];
      const profileRow = { name:self.name, color:self.color, units:DB.settings.units, theme:DB.settings.theme, theme_color:DB.settings.themeColor, rest_default:Number(DB.settings.restDefault)||120 };
      if(!snapshot.profile || JSON.stringify(profileRow) !== JSON.stringify({name:snapshot.profile.name,color:snapshot.profile.color,units:snapshot.profile.units,theme:snapshot.profile.theme,theme_color:snapshot.profile.theme_color,rest_default:snapshot.profile.rest_default})){
        await client.from('profiles').update(profileRow).eq('id', selfId);
      }

      snapshot = {
        workouts: JSON.parse(JSON.stringify(wDb)),
        templates: JSON.parse(JSON.stringify(tDb)),
        exercises: JSON.parse(JSON.stringify(ownExDb)),
        profile: { id:selfId, ...profileRow }
      };
      Storage.lastSyncError = null;
    }catch(e){ console.error('Ошибка синхронизации:', e); Storage.lastSyncError = e;
      if(!syncAll.warned){ syncAll.warned = true; toast('Не удалось сохранить на сервер: '+(e.message||e)+'. Повторим автоматически.'); setTimeout(()=>{ syncAll.warned=false; save(); }, 8000); } }
  }
  function isGlobalExercise(e){ return e.ownerId === null || e.ownerId === undefined; }

  // резервная копия: только свои данные (тренировки, шаблоны, свои упражнения, вес, личные данные, активность, питание)
  async function backupObject(){
    const me = selfId; let food = [];
    try{ const {data} = await Auth.getClient().from('food_log').select('date,meal,unit,name,grams,kcal,protein,fat,carbs').eq('user_id', me); food = data||[]; }catch(e){}
    return { app:'GymDiary', version:2, owner:me, exportedAt:new Date().toISOString(),
      workouts: DB.workouts.filter(w=>w.participantId===me),
      templates: DB.templates.filter(t=>t.ownerId===me || t.ownerId===undefined),
      exercises: DB.exercises.filter(e=>e.ownerId===me),
      weights: (DB.weights||[]).filter(x=>x.user_id===me).map(x=>({date:x.date, weight_kg:x.weight_kg})),
      details: (()=>{ const d = (DB.details||[]).find(x=>x.user_id===me); if(!d) return null; const {user_id, updated_at, ...rest} = d; return rest; })(),
      activity: (DB.activity||[]).filter(x=>x.user_id===me).map(x=>({date:x.date, kind:x.kind, steps:x.steps})),
      food };
  }
  // экспорт: файл приходит в чат с ботом (скачивание внутри Telegram на iPhone не работает); если бот недоступен — обычное скачивание
  async function exportJSON(){
    const obj = await backupObject(), name = 'gymdiary-backup-'+new Date().toISOString().slice(0,10)+'.json';
    try{
      const r = await fetch(SUPABASE_URL + '/functions/v1/telegram-bot', { method:'POST',
        headers:{'Content-Type':'application/json', apikey:SUPABASE_ANON_KEY, Authorization:'Bearer '+(await Auth.freshToken())},
        body: JSON.stringify({action:'backup', name, data:obj}) });
      if(r.ok){ toast('📦 Резервная копия отправлена вам в чат с ботом — сохраните файл'); return; }
    }catch(e){}
    const blob = new Blob([JSON.stringify(obj,null,1)],{type:'application/json'});
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
  }
  // импорт ДОБАВЛЯЕТ данные из файла к текущим (ничего не удаляет): новые id, всё записывается на этот аккаунт, повторы пропускаются
  async function importJSON(obj){
    const me = selfId, c = Auth.getClient(), nid = () => (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2)+Date.now().toString(36));
    const oldMe = obj.owner || (obj.participants && obj.participants[0] && obj.participants[0].id) || null;
    const nn = x => String(x||'').toLowerCase().replace(/ё/g,'е').trim();
    const exMap = {}; let nEx = 0;
    (obj.exercises||[]).forEach(e=>{ const ex = DB.exercises.find(x=>x.id===e.id) || DB.exercises.find(x=>nn(x.name)===nn(e.name));
      if(ex){ exMap[e.id] = ex.id; return; }
      if(e.ownerId===null){ return; }   // общее упражнение из старой версии — ищется по id/названию выше
      const n = {...e, id:nid(), ownerId:me}; DB.exercises.push(n); exMap[e.id] = n.id; nEx++; });
    const remap = bl => JSON.parse(JSON.stringify(bl||[])).map(b=>({...b, id:nid(), exercises:(b.exercises||[]).map(x=>({...x, exerciseId: exMap[x.exerciseId] || x.exerciseId}))}));
    const sig = w => w.date+'|'+(w.time||'')+'|'+JSON.stringify((w.blocks||[]).map(b=>(b.exercises||[]).map(x=>[x.exerciseId,(x.sets||[]).map(s=>[s.weight,s.reps,s.time,s.distance])])));
    const have = new Set(DB.workouts.filter(w=>w.participantId===me).map(sig));
    let nW = 0, nT = 0, nWt = 0, nF = 0;
    (obj.workouts||[]).filter(w=>!oldMe || w.participantId===oldMe || w.participantId===me).forEach(w=>{
      const n = {...w, id:nid(), participantId:me, createdBy:me, blocks:remap(w.blocks), recurringId:null};
      if(have.has(sig(n))) return; have.add(sig(n)); DB.workouts.push(n); nW++; });
    const tHave = new Set(DB.templates.map(t=>nn(t.name)));
    (obj.templates||[]).filter(t=>!t.ownerId || t.ownerId===oldMe || t.ownerId===me).forEach(t=>{
      if(tHave.has(nn(t.name))) return; DB.templates.push({...t, id:nid(), ownerId:me, isPublic:false, blocks:remap(t.blocks)}); tHave.add(nn(t.name)); nT++; });
    await flush();
    const w = (obj.weights||[]).filter(x=>x && x.date && x.weight_kg).map(x=>({user_id:me, date:x.date, weight_kg:x.weight_kg}));
    if(w.length){ const r = await c.from('body_weights').upsert(w, {onConflict:'user_id,date', ignoreDuplicates:true}); if(!r.error) nWt = w.length; }
    const a = (obj.activity||[]).filter(x=>x && x.date && x.kind).map(x=>({user_id:me, date:x.date, kind:x.kind, steps:x.steps??null}));
    if(a.length) await c.from('daily_activity').upsert(a, {onConflict:'user_id,date', ignoreDuplicates:true});
    if(obj.details){ const cur = (DB.details||[]).find(x=>x.user_id===me) || {}; const patch = {};
      Object.entries(obj.details).forEach(([k,v])=>{ if(v!=null && v!=='' && (cur[k]==null || cur[k]==='') && !['user_id','updated_at'].includes(k)) patch[k]=v; });
      if(Object.keys(patch).length) await c.from('profile_details').upsert({user_id:me, ...cur, ...patch, updated_at:new Date().toISOString()}, {onConflict:'user_id'}); }
    if((obj.food||[]).length){
      const {data:mine} = await c.from('food_log').select('date,meal,name,grams').eq('user_id', me);
      const fk = x => [x.date,x.meal,nn(x.name),Number(x.grams)].join('|'), fh = new Set((mine||[]).map(fk));
      const rows = obj.food.filter(x=>x && x.date && x.name && !fh.has(fk(x))).map(x=>({user_id:me, date:x.date, meal:x.meal||'snack1', unit:x.unit||'g', name:x.name, grams:x.grams, kcal:x.kcal||0, protein:x.protein||0, fat:x.fat||0, carbs:x.carbs||0}));
      for(let i=0;i<rows.length;i+=200){ const r = await c.from('food_log').insert(rows.slice(i,i+200)); if(!r.error) nF += Math.min(200, rows.length-i); }
    }
    return {workouts:nW, templates:nT, exercises:nEx, weights:nWt, food:nF};
  }
  const flush = ()=>{ clearTimeout(saveTimer); return syncAll(); };
  // настройки упрощённого режима (уровень, программа) — в profiles.coach; нет колонки (не выполнен stage27) — остаются в браузере
  function saveCoach(c){ const cl = Auth.getClient(); if(!cl || !selfId) return; cl.from('profiles').update({coach:c}).eq('id', selfId).then(()=>{}, ()=>{}); }
  return { workoutFromDb, exerciseFromDb, load, save, flush, saveCoach, reloadSocial, exportJSON, importJSON, uid: ()=> (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2,10)) };
})();

/* ===================== CALC MODULE (tonnage) ===================== */
const Calc = (function(){
  // bw — вес спортсмена: подход без веса отягощения (подтягивания, отжимания…) = повторения × собственный вес
  // withDrops — у дроп-сета к подходу прибавляются 3 «дропа» (вес × повторения каждого)
  // bw > 0 только у упражнений «можно с личным весом»: тоннаж = (свой вес + отягощение) × повторы; у остальных — вес × повторы
  function setTonnage(s, bw, withDrops){ const wt = Number(s.weight)||0, r = Number(s.reps)||0, b = Number(bw)||0; let t = (wt + b) * r;
    if(withDrops) (s.drops||[]).forEach(d=>{ const dw = Number(d.weight)||0, dr = Number(d.reps)||0; t += (dw + b) * dr; });
    return t; }
  function exTonnage(ex, bw){ return (ex.sets||[]).reduce((a,s)=>a+setTonnage(s, bw, !!(ex.isDropset || s.isDrop)),0); }
  // bwFor(w, ex) задаёт приложение: какой собственный вес подставлять для упражнения этой тренировки (0 — не учитывать)
  let bwFor = () => 0;
  function setBodyWeightProvider(fn){ bwFor = fn; }
  function blockTonnage(b, w){ return (b.exercises||[]).reduce((a,ex)=>a+exTonnage(ex, w?bwFor(w,ex):0),0); }
  function workoutTonnage(w){ return (w.blocks||[]).reduce((a,b)=>a+blockTonnage(b, w),0); }
  function muscleBreakdown(w, exercisesDb){
    const map = {};
    (w.blocks||[]).forEach(b=>(b.exercises||[]).forEach(ex=>{
      const info = exercisesDb.find(e=>e.id===ex.exerciseId);
      if(!info) return;
      const t = exTonnage(ex, bwFor(w, ex));
      if(t<=0) return;
      map[info.mainGroup] = (map[info.mainGroup]||0) + t;
    }));
    return map;
  }
  return {setTonnage, exTonnage, blockTonnage, workoutTonnage, muscleBreakdown, setBodyWeightProvider, bwFor:(w,ex)=>bwFor(w,ex)};
})();

function weeklyStreak(workouts){
  if(!workouts.length) return {current:0, longest:0};
  const weeks = Array.from(new Set(workouts.map(w=>weekKeyOf(w.date)))).sort();
  let longest=1, run=1;
  for(let i=1;i<weeks.length;i++){
    const diffDays = Math.round((parseD(weeks[i])-parseD(weeks[i-1]))/86400000);
    run = (diffDays===7) ? run+1 : 1;
    longest = Math.max(longest, run);
  }
  const thisWeek = weekKeyOf(dstr(new Date()));
  let current=0;
  const lastWeek = weeks[weeks.length-1];
  const gapFromNow = Math.round((parseD(thisWeek)-parseD(lastWeek))/86400000)/7;
  if(gapFromNow<=1){
    current=1;
    for(let i=weeks.length-1;i>0;i--){
      const diffDays = Math.round((parseD(weeks[i])-parseD(weeks[i-1]))/86400000);
      if(diffDays===7) current++; else break;
    }
  }
  return {current, longest};
}

function heroContext(workouts){
  const uid = (workouts[0]||{}).participantId || State.achFor;
  const exOf = id => DB.exercises.find(e=>e.id===id) || {};
  const sets = []; workouts.forEach(w=>(w.blocks||[]).forEach(b=>(b.exercises||[]).forEach(ex=>(ex.sets||[]).forEach(s=>sets.push({w, ex, info:exOf(ex.exerciseId), s})))));
  const byWeek = {}; workouts.forEach(w=>{ const k=weekKeyOf(w.date); (byWeek[k]=byWeek[k]||[]).push(w); });
  const d = (DB.details||[]).find(x=>x.user_id===uid) || {};
  const dates = [...new Set(workouts.map(w=>w.date))].sort(); let run=0, best=0, prev=null;
  dates.forEach(ds=>{ run = prev && (parseD(ds)-parseD(prev))/86400000===1 ? run+1 : 1; best=Math.max(best,run); prev=ds; });
  const weeks = Object.keys(byWeek).sort(); let wr=0, wbest=0, wprev=null;
  const c = {
    bw: bodyWeightOn(uid, dstr(new Date())), height: Number(d.height_cm)||0, streak: weeklyStreak(workouts).longest, dayStreak: best,
    maxW: (rx, minReps=1) => Math.max(0, ...sets.filter(x=>rx.test(x.info.name||'') && Number(x.s.reps)>=minReps).map(x=>Number(x.s.weight)||0)),
    maxReps: rx => Math.max(0, ...sets.filter(x=>rx.test(x.info.name||'')).map(x=>Number(x.s.reps)||0)),
    has: (w, rx) => (w.blocks||[]).some(b=>(b.exercises||[]).some(ex=>rx.test(exOf(ex.exerciseId).name||''))),
    hasType: (w, t) => (w.blocks||[]).some(b=>(b.exercises||[]).some(ex=>exOf(ex.exerciseId).type===t)),
    hasGroup: (w, gs) => (w.blocks||[]).some(b=>(b.exercises||[]).some(ex=>gs.includes(exOf(ex.exerciseId).mainGroup))),
    workoutsWith: rx => workouts.filter(w=>c.has(w,rx)).length,
    bestTonWith: rx => Math.max(0, ...workouts.filter(w=>c.has(w,rx)).map(w=>Calc.workoutTonnage(w))),
    count: fn => workouts.filter(fn).length,
    maxWeekOf: fn => Math.max(0, ...Object.values(byWeek).map(ws=>ws.filter(fn).length)),
    maxWeekSets: Math.max(0, ...Object.values(byWeek).map(ws=>ws.reduce((a,w)=>a+(w.blocks||[]).reduce((b,bl)=>b+(bl.exercises||[]).reduce((e,ex)=>e+(ex.sets||[]).filter(s=>Number(s.reps)>0||Number(s.time)>0).length,0),0),0))),
    weeksInRowWith: n => { let r=0, bst=0, pv=null; weeks.forEach(k=>{ if(byWeek[k].length>=n){ r = pv && (parseD(k)-parseD(pv))/86400000===7 ? r+1 : 1; bst=Math.max(bst,r); pv=k; } else { r=0; pv=null; } }); return bst; },
    // все условия выполнены; прогресс — по самому отстающему условию
    all: pairs => { const ok = pairs.every(([v,t])=>t>0 && v>=t); const pct = Math.min(...pairs.map(([v,t])=>t>0?Math.min(1,v/t):0));
      return {got:ok, cur:Math.round(pct*100), target:100}; }
  };
  return c;
}

  const keep = new Set(Object.values(groups).map(g=>g.reduce((m,a)=>a.reps>m.reps?a:m)));

function achievementsCard(workouts, pid){
  State.achFor = pid || (workouts[0]||{}).participantId;

  const done = workouts.filter(w=>w.status==='done' || (w.date<=dstr(new Date()) && hasFilledSets(w)));
  // пересчёт ~850 ачивок заметен на телефоне — повторяем только если тренировки или личные данные изменились
  const key = State.achFor+'|'+dstr(new Date())+'|'+done.map(w=>w.id+w.date+(w.time||'')+(w.duration||'')+w.status+JSON.stringify(w.blocks)).join('~')
    +'|'+(DB.exercises||[]).length+'|'+JSON.stringify((DB.details||[]).find(d=>d.user_id===State.achFor)||{})+'|'+(DB.weights||[]).length+'|'+JSON.stringify((DB.certs||[]).map(c=>c.id+(c.badge_id||'')))+'|'+(DB.customBadges||[]).length+'|'+(DB.userBadges||[]).length;
  State.achCache = State.achCache || new Map();
  let all = State.achCache.get(key);
  if(!all){ all = achievementsList(done); if(State.achCache.size>8) State.achCache.clear(); State.achCache.set(key, all); }
  const tab = State.achTab || 'weight';
  const cat = id => ACH_CATS.find(c=>c.id===id);
  const list = tab==='got' ? compressBw(all.filter(a=>a.got)) : all.filter(a=>a.cat===tab);
  State.achBeasts = all.filter(a=>a.cat==='beast'); State.achAll = all;
  const tile = a => achTile(a, cat(a.cat).color);
  return achCardHtml(all, list, tab, cat, tile);
}

}

/* ===================== UTIL ===================== */
function pad(n){return n<10?'0'+n:''+n;}
function dstr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseD(s){const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}
function fmtDate(s){const d=parseD(s);return d.toLocaleDateString(I18N.locale,{day:'numeric',month:'long',year:'numeric'});}
function fmtDateShort(s){const d=parseD(s);return d.toLocaleDateString(I18N.locale,{day:'numeric',month:'short'});}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtNum(n){return Math.round(n*10)/10;}
function convW(kg, units){ return units==='lb' ? fmtNum(kg*2.20462) : fmtNum(kg); }
function unitLabel(units){ return units==='lb' ? 'фунт' : 'кг'; }
function toKg(v, units){ const x = parseFloat(String(v??'').replace(/\s/g,'').replace(',','.')) || 0; return units==='lb' ? x/2.20462 : x; }

function selfParticipantId(){ return DB.participants[0].id; }
// собственный вес участника на дату тренировки: последний замер не позже даты, иначе ближайший позже, иначе из анкеты
function weightPoints(uid){
  const pts = (DB.weights||[]).filter(x=>x.user_id===uid).map(x=>({date:x.date, weight_kg:+x.weight_kg}));
  DB.workouts.forEach(w=>{ if(w.participantId===uid && Number(w.bodyWeight)>0){ const i = pts.findIndex(p=>p.date===w.date);
    const p = {date:w.date, weight_kg:Number(w.bodyWeight)}; if(i<0) pts.push(p); else pts[i] = p; } });
  return pts.sort((a,b)=>a.date.localeCompare(b.date));
}
function bodyWeightOn(uid, date){
  const list = weightPoints(uid);
  const before = list.filter(x=>x.date<=date).sort((a,b)=>b.date.localeCompare(a.date))[0];
  const after = list.filter(x=>x.date>date).sort((a,b)=>a.date.localeCompare(b.date))[0];
  const d = (DB.details||[]).find(x=>x.user_id===uid);
  return Number((before||after||{}).weight_kg) || Number(d&&d.weight_kg) || 0;
}
// «можно выполнять с личным весом»: флаг упражнения (Настройки → Управление упражнениями); пока флаг не задан — по названию
const BW_NAME_RX = /подтяг|отжим|брус|выход силой|переворот|пистолет|свой вес|австрал|стойк.*рук|планк|уголок|\bвис|флаж|планш|бёрпи|берпи|выпрыгив|подъём ног в висе|pull-?up|chin-?up|push-?up|dips?\b|muscle-?up|burpee/i;
function isBodyweightEx(info){ if(!info || info.type==='cardio' || info.type==='stretch') return false;
  return info.bodyweight!==null && info.bodyweight!==undefined ? !!info.bodyweight : BW_NAME_RX.test(info.name||''); }
Calc.setBodyWeightProvider((w, ex)=>{
  const info = DB.exercises.find(e=>e.id===ex.exerciseId);
  return isBodyweightEx(info) ? (Number(w.bodyWeight) || bodyWeightOn(w.participantId, w.date)) : 0;
});

/* ===================== MAIN ROUTER ===================== */
function renderMain(){
  const m = document.getElementById('main');
  // та же страница перерисовывается — остаёмся на месте прокрутки; перешли в другой раздел — наверх
  const key = State.view+'|'+(State.participantProfile||''), y = window.scrollY, same = renderMain.lastKey===key;
  renderMain.lastKey = key;
  // горизонтальные полосы (категории ачивок) не прыгают к началу при перерисовке
  const hx = same ? [...m.querySelectorAll('.ach-chips')].map(el=>el.scrollLeft) : [];
  requestAnimationFrame(()=>{ window.scrollTo(0, same ? y : 0);
    m.querySelectorAll('.ach-chips').forEach((el,i)=>{ if(hx[i]) el.scrollLeft = hx[i];
      const on = el.querySelector('.on'); if(on && (on.offsetLeft < el.scrollLeft || on.offsetLeft+on.offsetWidth > el.scrollLeft+el.clientWidth)) el.scrollLeft = on.offsetLeft - 8; }); });
  if(State.view==='calendar'){ m.innerHTML = viewCalendar(); fitCalTitle(); if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitCalTitle); }
  else if(State.view==='history') m.innerHTML = viewHistory();
  else if(State.view==='templates') m.innerHTML = viewTemplates();
  else if(State.view==='participants') m.innerHTML = State.participantProfile ? viewParticipantProfile(State.participantProfile) : viewParticipants();
  else if(State.view==='stats') m.innerHTML = viewStats();
  else if(State.view==='settings') m.innerHTML = viewSettings();
  else if(State.view==='help') m.innerHTML = viewHelp();
  else if(State.view==='admin') m.innerHTML = viewAdmin();
  else if(State.view==='food') m.innerHTML = viewFood();
  if(LINK_PAGES.includes(State.view)) m.insertAdjacentHTML('beforeend', linksFooter());   // ссылки автора/блогеров — в самом низу
  applyTheme();
  hydrateCertImages();
}

/* ===================== CALENDAR VIEW ===================== */
function occurrencesInRange(from,to){
  // returns workouts (materialized) with date within [from,to]
  return DB.workouts.filter(w=>{
    const d=parseD(w.date); return d>=from && d<=to;
  });
}
// «Сентябрь 2026г»: месяц с заглавной, «г» слитно и строчная (по-украински «р»)
// заголовки календаря в стиле надписи LIGHT WEIGHT: заглавными, «г» — строчная и слитно с годом
const yearMark = () => (I18N.lang==='ru' ? 'г' : I18N.lang==='uk' ? 'р' : '');
const capsT = t => t.toLocaleUpperCase(I18N.locale);
function calMonthTitle(d){
  const L = I18N.lang||'ru';
  if(L==='ru' || L==='uk') return capsT(d.toLocaleDateString(I18N.locale,{month:'long'}))+' '+d.getFullYear()+yearMark();
  return capsT(d.toLocaleDateString(I18N.locale,{month:'long',year:'numeric'}));
}
function calWeekTitle(a, b){ const f = x => capsT(x.toLocaleDateString(I18N.locale,{day:'numeric',month:'short'}).replace('.','')); return f(a)+' — '+f(b); }
function calDayTitle(d){ const L = I18N.lang||'ru';
  if(L==='ru' || L==='uk') return capsT(d.toLocaleDateString(I18N.locale,{day:'numeric',month:'long'}))+' '+d.getFullYear()+yearMark();
  return capsT(d.toLocaleDateString(I18N.locale,{day:'numeric',month:'long',year:'numeric'})); }
